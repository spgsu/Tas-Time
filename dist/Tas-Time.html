/* ── Tokens ─────────────────────────────────────────────── */
/* Every colour is light-dark(light, dark). color-scheme picks the side:
   "light dark" follows Windows; data-scheme="light"/"dark" forces one. */
:root {
  color-scheme: light dark;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  --sidebar: 236px; --drawer: 440px;
}
:root[data-scheme="light"] { color-scheme: light; }
:root[data-scheme="dark"] { color-scheme: dark; }

/* Notebook: warm paper, soft cards, green ink. */
:root[data-style="notebook"] {
  --bg: light-dark(#f6f5f1, #121715); --surface: light-dark(#ffffff, #1a201e);
  --surface-2: light-dark(#f0eee8, #212826); --surface-3: light-dark(#e8e5dd, #2a3330);
  --line: light-dark(#e3e0d7, #2c3532); --line-strong: light-dark(#cfcabd, #3b4642);
  --ink: light-dark(#1c2622, #e7ece9); --ink-2: light-dark(#44514b, #b9c3be); --muted: light-dark(#7b847f, #8a9590);
  --accent: light-dark(#2f6b4f, #5fae86); --accent-strong: light-dark(#245a41, #79c39d);
  --accent-soft: light-dark(#e2ede6, #1f3a2d); --on-accent: light-dark(#fff, #0d1a13);
  --danger: light-dark(#b3432e, #ec8a74); --danger-soft: light-dark(#fbe8e3, #3d221c);
  --warn: light-dark(#94650c, #e2b459); --warn-soft: light-dark(#fbf0d6, #3a2f17); --good: light-dark(#2d7a4c, #6cc394);
  --focus: #c08a2e;
  --shadow-1: light-dark(rgb(20 30 25 / .06), rgb(0 0 0 / .4)) 0 1px 2px;
  --shadow-2: light-dark(rgb(20 30 25 / .14), rgb(0 0 0 / .5)) 0 8px 28px;
  --radius: 10px; --radius-sm: 7px;
}

/* Fluent: Microsoft 365 circa 2020 — neutral greys, Office blue, 2px corners, depth shadows. */
:root[data-style="fluent"] {
  --font: "Segoe UI", "Segoe UI Web (West European)", system-ui, -apple-system, sans-serif;
  --font-display: var(--font);
  --bg: light-dark(#faf9f8, #1b1a19); --surface: light-dark(#ffffff, #252423);
  --surface-2: light-dark(#f3f2f1, #2d2c2b); --surface-3: light-dark(#edebe9, #3b3a39);
  --line: light-dark(#edebe9, #3b3a39); --line-strong: light-dark(#c8c6c4, #605e5c);
  --ink: light-dark(#323130, #f3f2f1); --ink-2: light-dark(#484644, #d2d0ce); --muted: light-dark(#605e5c, #a19f9d);
  --accent: light-dark(#0078d4, #2899f5); --accent-strong: light-dark(#106ebe, #6cb8f6);
  --accent-soft: light-dark(#deecf9, #0b3557); --on-accent: light-dark(#ffffff, #0b1a29);
  --danger: light-dark(#a4262c, #f1707b); --danger-soft: light-dark(#fde7e9, #442726);
  --warn: light-dark(#8a5300, #fce100); --warn-soft: light-dark(#fff4ce, #433519); --good: light-dark(#107c10, #92c353);
  --focus: light-dark(#323130, #f3f2f1);
  --shadow-1: light-dark(rgb(0 0 0 / .13), rgb(0 0 0 / .45)) 0 1.6px 3.6px, light-dark(rgb(0 0 0 / .11), rgb(0 0 0 / .35)) 0 .3px .9px;
  --shadow-2: light-dark(rgb(0 0 0 / .18), rgb(0 0 0 / .55)) 0 6.4px 14.4px, light-dark(rgb(0 0 0 / .13), rgb(0 0 0 / .4)) 0 1.2px 3.6px;
  --radius: 2px; --radius-sm: 2px;
  --header: light-dark(#0078d4, #1b1a19); --on-header: #ffffff;
}

/* ── Base ───────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: .45; }
input, select, textarea {
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  padding: 7px 10px; min-width: 0; width: 100%;
}
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
input[type=checkbox] { width: auto; accent-color: var(--accent); }
textarea { resize: vertical; line-height: 1.55; }
.resume-text, .week-notes, .note-text, .drawer textarea { field-sizing: content; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }
kbd { font: 11px/1 var(--mono); padding: 2px 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--surface); }
h1, h2, h3, p { margin: 0; }
.icon { flex-shrink: 0; display: block; }
.muted { color: var(--muted); }
.danger { color: var(--danger); }
.warn-text { color: var(--warn); }
.spacer { flex: 1; }
[hidden] { display: none !important; }

/* ── Frame ──────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; height: 100vh; }
.sidebar { background: var(--surface-2); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.workspace { display: flex; flex-direction: column; min-width: 0; height: 100vh; transition: margin-right .18s ease; }
.main { flex: 1; overflow: auto; padding: 28px 36px 64px; outline: none; }
@media (min-width: 1360px) { body.has-drawer .workspace { margin-right: var(--drawer); } }

.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand strong { display: block; font: 600 15px/1.2 var(--font-display); letter-spacing: -.2px; }
.book-name { font-size: 12px; color: var(--muted); text-align: left; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.book-name:hover { color: var(--ink); text-decoration: underline; }

.nav { display: grid; gap: 2px; margin-bottom: 14px; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--ink-2); font-weight: 500; }
.nav-item span { flex: 1; text-align: left; }
.nav-item kbd { opacity: 0; transition: opacity .15s; }
.nav:hover kbd { opacity: 1; }
.nav-item:hover { background: var(--surface-3); color: var(--ink); }
.nav-item.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.nav-item.on .icon { color: var(--accent); }

.jobs-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.jobs { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.job-link { width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: var(--radius-sm); color: var(--ink-2); }
.job-link:hover { background: var(--surface-3); color: var(--ink); }
.job-link.on { background: color-mix(in srgb, var(--job) 14%, var(--surface)); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--job); }
.job-link .dot, .job-tag .dot, .notes-job .dot, .drawer-crumbs .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--job); flex-shrink: 0; }
.job-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; color: var(--muted); min-width: 18px; text-align: right; font-variant-numeric: tabular-nums; }
.late-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--danger); flex-shrink: 0; }
.jobs-empty { padding: 4px 10px; color: var(--muted); font-size: 13px; }
.side-foot { margin-top: auto; padding-top: 12px; }
.foot-link { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; padding: 6px 10px; border-radius: var(--radius-sm); width: 100%; }
.foot-link:hover { color: var(--ink); background: var(--surface-3); }

/* ── Top bar ────────────────────────────────────────────── */
.topbar { display: flex; align-items: center; gap: 16px; padding: 10px 36px; border-bottom: 1px solid var(--line); background: var(--surface); position: relative; z-index: 5; }
.quick { flex: 1; max-width: 720px; position: relative; display: flex; align-items: center; }
.quick-icon { position: absolute; left: 12px; color: var(--muted); pointer-events: none; }
#quick-add { padding: 9px 44px 9px 38px; background: var(--surface-2); border-color: transparent; border-radius: 9px; }
#quick-add:focus { background: var(--surface); border-color: var(--accent); }
#quick-add::placeholder { color: var(--muted); }
.quick-kbd { position: absolute; right: 10px; pointer-events: none; }
#quick-add:focus ~ .quick-kbd { display: none; }
.quick-preview { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-2); padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.qp-title { font-weight: 600; margin-right: 4px; }
.qp-help { margin-left: auto; color: var(--muted); font-size: 12px; }
.file-status { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 6px 10px; border-radius: 99px; max-width: 280px; }
.status:hover { background: var(--surface-2); color: var(--ink); }
.status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); flex-shrink: 0; }
.status.ok .status-dot { background: var(--good); }
.status.warn { color: var(--warn); } .status.warn .status-dot { background: var(--warn); }
.status.danger { color: var(--danger); } .status.danger .status-dot { background: var(--danger); }
.status.busy .status-dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.banner { display: flex; align-items: center; gap: 12px; padding: 10px 36px; background: var(--warn-soft); color: var(--ink); border-bottom: 1px solid var(--line); }
.banner > span { flex: 1; }

/* ── Buttons & controls ─────────────────────────────────── */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); border-color: transparent; color: var(--ink); }
.btn.sm { padding: 4px 10px; font-size: 13px; gap: 5px; }
.btn.lg { padding: 10px 18px; font-size: 15px; }
.icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: var(--radius-sm); color: var(--ink-2); flex-shrink: 0; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.icon-btn.sm { width: 24px; height: 24px; }
.icon-btn.sm .icon { width: 15px; height: 15px; }
.icon-btn.on { color: var(--accent); background: var(--accent-soft); }
.segmented { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
.segmented button { padding: 4px 11px; border-radius: 6px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.segmented button:hover { color: var(--ink); }
.segmented button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); font-weight: 600; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.link { color: var(--accent); text-align: left; }
.link:hover { text-decoration: underline; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 5px; font-size: 12px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.chip.danger { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.accent { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.chip.muted { color: var(--muted); }
.job-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: color-mix(in srgb, var(--job) 80%, var(--ink)); white-space: nowrap; }
.effort { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ── Page structure ─────────────────────────────────────── */
.view { max-width: 1320px; margin: 0 auto; }
.view.plan, .view.week, .view.board { max-width: none; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { font: 600 28px/1.2 var(--font-display); letter-spacing: -.5px; }
.page-head .sub { color: var(--muted); margin-top: 4px; max-width: 70ch; }
.page-actions { display: flex; align-items: center; gap: 6px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow-1); }
.panel + .panel { margin-top: 16px; }
.panel-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-head h2 { font-size: 15px; font-weight: 600; }
.panel-head .btn { margin-left: auto; }
.hint { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.empty-actions { margin-top: 14px; display: flex; gap: 8px; justify-content: center; }

/* ── Rows (Today) ───────────────────────────────────────── */
.list { display: grid; }
.row-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 6px; border-top: 1px solid var(--line); border-radius: 0; }
.row-item:first-child { border-top: 0; }
.row-item:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 500; text-align: left; line-height: 1.35; }
.row-title:hover { color: var(--accent); }
.row-item.is-done .row-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.row-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 3px; font-size: 12px; }
.row-actions { display: flex; gap: 4px; opacity: .55; transition: opacity .15s; }
.row-item:hover .row-actions, .row-actions:focus-within { opacity: 1; }

.tick { width: 20px; height: 20px; border-radius: 50%; border: 1.6px solid var(--line-strong); display: grid; place-items: center; color: transparent; flex-shrink: 0; margin-top: 1px; background: var(--surface); transition: background .12s, border-color .12s; }
.tick.tick-ms { border-radius: 4px; transform: rotate(45deg) scale(.85); }
.tick.tick-ms .icon { transform: rotate(-45deg); }
.tick:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.tick.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tick:disabled { opacity: 1; border-style: dashed; cursor: not-allowed; }

.today-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
.today-main .panel + .panel { margin-top: 16px; }
.today-side { display: grid; gap: 16px; }
.today-side .panel + .panel { margin-top: 0; }
.resume { border-left: 3px solid var(--job); padding: 2px 0 2px 12px; margin-top: 12px; }
.resume:first-of-type { margin-top: 0; }
.resume-text { margin-top: 6px; border-color: transparent; background: var(--surface-2); resize: none; overflow: hidden; }
.milestones { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.milestones li { display: flex; gap: 12px; align-items: flex-start; }
.milestones .diamond { width: 11px; height: 11px; background: var(--job); transform: rotate(45deg); margin-top: 5px; border-radius: 2px; flex-shrink: 0; }
.milestones li > div { flex: 1; }
.milestones .muted { font-size: 12px; }

.meter-track { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter-track span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
.meter.over .meter-track span { background: var(--danger); }
.meter-label { margin-top: 8px; font-size: 13px; color: var(--ink-2); }
.meter-label strong { font-size: 15px; color: var(--ink); }

/* ── Welcome ────────────────────────────────────────────── */
.welcome { display: grid; place-items: center; min-height: 70vh; }
.welcome-card { max-width: 720px; text-align: left; }
.welcome h1 { font: 600 38px/1.15 var(--font-display); letter-spacing: -1px; margin: 4px 0 14px; }
.welcome .lead { font-size: 16px; color: var(--ink-2); max-width: 60ch; }
.welcome-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 26px 0 34px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.steps li { display: flex; gap: 12px; }
.steps p { color: var(--muted); font-size: 13px; margin-top: 2px; }
.step-n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
.fine { color: var(--muted); font-size: 12px; margin-top: 30px; }

/* ── Week ───────────────────────────────────────────────── */
.week-summary { display: grid; grid-template-columns: auto minmax(220px, 1fr) auto; gap: 10px 24px; align-items: center; margin-bottom: 18px; }
.cap { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink-2); }
.cap-input { width: 90px; font-weight: 600; text-align: center; }
.cap-meter .meter-label { margin-top: 6px; }
.cap-facts { font-size: 13px; }
.week-notes { grid-column: 1 / -1; resize: none; overflow: hidden; background: var(--surface-2); border-color: transparent; }
.week-body { display: grid; grid-template-columns: minmax(0, 1fr) 264px; gap: 14px; align-items: start; }
.days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) repeat(2, minmax(0, .72fr)); gap: 6px; }
.day { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); min-height: 340px; display: flex; flex-direction: column; transition: background .12s, border-color .12s; }
.day.weekend { background: color-mix(in srgb, var(--surface-2) 70%, var(--bg)); }
.day.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.day.is-past header { opacity: .6; }
.day header { display: flex; align-items: baseline; gap: 5px; padding: 10px 8px 6px; white-space: nowrap; overflow: hidden; }
.day-name { font-weight: 700; font-size: 13px; }
.day.is-today .day-name { color: var(--accent); }
.day-date { font-size: 12px; color: var(--muted); }
.day-total { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.day-cards, .tray-cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 4px 5px 10px; align-content: start; flex: 1; }
.day-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 4px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); opacity: .7; }
.drop-over { background: var(--accent-soft) !important; border-color: var(--accent) !important; }
.wcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px; align-items: start; padding: 8px 8px 8px 7px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--job); border-radius: var(--radius-sm); box-shadow: var(--shadow-1); cursor: grab; position: relative; }
.wcard:hover { border-color: var(--line-strong); border-left-color: var(--job); }
.wcard.dragging, .bcard.dragging { opacity: .4; }
.wcard .tick { width: 17px; height: 17px; }
.wcard-body { flex: 1; min-width: 0; }
.wcard-title { font-size: 13px; font-weight: 500; text-align: left; line-height: 1.3; overflow-wrap: anywhere; }
.wcard-title:hover { color: var(--accent); }
.wcard.is-done .wcard-title { text-decoration: line-through; color: var(--muted); }
.wcard-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; align-items: center; }
.wcard-meta .chip { font-size: 11px; }
.wcard-menu { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; opacity: 0; background: var(--surface); }
.wcard-meta .chip { max-width: 100%; }
.wcard:hover .wcard-menu, .wcard-menu:focus-visible { opacity: 1; }
.tray { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 8px 4px; position: sticky; top: 0; max-height: calc(100vh - 140px); overflow: auto; }
.tray header { display: flex; align-items: baseline; gap: 8px; padding: 0 6px; }
.tray h2 { font-size: 14px; }
.tray .hint { padding: 4px 6px 4px; font-size: 12px; }

/* ── Plan (Gantt) ───────────────────────────────────────── */
.plan-toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.plan-scroll { overflow: auto; max-height: calc(100vh - 210px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-1); position: relative; }
.plan-grid { position: relative; min-width: 100%; }
.ph, .prow { display: grid; grid-template-columns: var(--lw) 1fr; }
.pl { position: sticky; left: 0; z-index: 2; background: var(--surface); border-right: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 12px; min-width: 0; }
.pt { position: relative; }
.ph { position: sticky; top: 0; z-index: 4; height: 52px; border-bottom: 1px solid var(--line-strong); }
.ph .pl { z-index: 5; font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); background: var(--surface-2); align-items: flex-end; padding-bottom: 8px; }
.ph .pl span:first-of-type { margin-left: auto; width: 104px; }
.ph .pl span:last-of-type { width: 52px; text-align: right; }
.ph-time { background: var(--surface-2); overflow: hidden; }
.ph-months, .ph-weeks { position: relative; height: 26px; }
.ph-month { position: absolute; top: 0; height: 26px; padding: 6px 8px 0; font-size: 12px; font-weight: 600; border-left: 1px solid var(--line-strong); white-space: nowrap; overflow: hidden; }
.ph-week { position: absolute; top: 0; height: 26px; padding: 5px 0 0 5px; font-size: 11px; color: var(--muted); border-left: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.prow { border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.prow .pt {
  background-image:
    linear-gradient(to right, var(--line) 1px, transparent 1px),
    linear-gradient(to right, transparent calc(var(--px) * 5), color-mix(in srgb, var(--surface-2) 70%, transparent) calc(var(--px) * 5));
  background-size: calc(var(--px) * 7) 100%, calc(var(--px) * 7) 100%;
}
.prow-job .pl { font-weight: 600; background: color-mix(in srgb, var(--job) 7%, var(--surface)); }
.prow-job .pt { background-color: color-mix(in srgb, var(--job) 4%, transparent); }
.job-bar { width: 4px; height: 22px; border-radius: 2px; background: var(--job); flex-shrink: 0; }
.job-title { font: 600 15px/1.2 var(--font-display); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.job-title:hover { color: var(--accent); }
.job-facts { margin-left: auto; font-size: 12px; font-weight: 500; white-space: nowrap; }
.prow-phase .pl { padding-left: 26px; }
.phase-title { font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--ink-2); }
.phase-title:hover { color: var(--accent); }
.prow-item .pl { padding-left: 24px; }
.prow-item:hover .pl, .prow-item:hover .pt { background-color: color-mix(in srgb, var(--accent-soft) 35%, transparent); }
.prow-item:hover .pl { background-color: color-mix(in srgb, var(--accent-soft) 35%, var(--surface)); }
.prow-item .tick { width: 17px; height: 17px; margin: 0; }
.item-title { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.item-title:hover { color: var(--accent); }
.ms-mark { color: var(--accent); font-size: 11px; }
.blocked-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
.item-dates { width: 104px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item-effort { width: 52px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prow-item.is-done .item-title { color: var(--muted); text-decoration: line-through; }
.is-archived { opacity: .55; }
.prow-add .pl { padding-left: 50px; }
.add-inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 3px 6px; border-radius: 5px; }
.add-inline:hover { color: var(--accent); background: var(--accent-soft); }
.prow-add .add-inline { opacity: 0; }
.prow-add:hover .add-inline, .add-inline:focus-visible { opacity: 1; }
.add-input { padding: 4px 8px; font-size: 13px; }
.track.unscheduled { cursor: copy; }
.track.unscheduled:hover::after { content: 'Click a day to schedule'; position: absolute; left: 8px; top: 9px; font-size: 11px; color: var(--muted); pointer-events: none; }

.bar { position: absolute; top: 9px; height: 18px; border-radius: 5px; background: color-mix(in srgb, var(--accent) 70%, var(--surface)); border: 1px solid var(--accent); cursor: grab; touch-action: none; min-width: 6px; }
.bar.doing { background: var(--accent); }
.bar.done { background: var(--surface-3); border-color: var(--line-strong); }
.bar.late { background: color-mix(in srgb, var(--danger) 55%, var(--surface)); border-color: var(--danger); }
.bar.blocked { background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgb(255 255 255 / .35) 5px 9px); }
.bar.dragging, .gms.dragging { cursor: grabbing; box-shadow: var(--shadow-2); z-index: 3; }
.bar:focus-visible, .gms:focus-visible { outline-offset: 1px; }
.grip { position: absolute; right: -1px; top: -1px; bottom: -1px; width: 9px; cursor: ew-resize; border-radius: 0 5px 5px 0; }
.bar:hover .grip { background: rgb(0 0 0 / .18); }
.base { position: absolute; top: 29px; height: 3px; border-radius: 2px; background: var(--muted); opacity: .55; pointer-events: none; }
.gms { position: absolute; top: 10px; width: 15px; height: 15px; margin-left: -7.5px; background: var(--ink); border: 0; transform: rotate(45deg); border-radius: 2px; cursor: grab; touch-action: none; }
.gms.done { background: var(--muted); } .gms.late { background: var(--danger); }
.slip { position: absolute; top: 10px; font-size: 11px; font-weight: 700; white-space: nowrap; pointer-events: none; }
.slip.good { color: var(--good); }
.plan-overlay { position: absolute; top: 0; pointer-events: none; z-index: 1; overflow: visible; }
.today-line { stroke: var(--danger); stroke-width: 1.5; stroke-dasharray: 3 3; }
.dep { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: .75; }
.dep.bad { stroke: var(--danger); opacity: 1; stroke-dasharray: 4 2; }
.arrow-head { fill: var(--muted); } .arrow-head.bad { fill: var(--danger); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
.legend > span[class^=lg] { display: inline-block; margin-right: -8px; }
.lg-bar { width: 22px; height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--accent) 70%, var(--surface)); border: 1px solid var(--accent); }
.lg-base { width: 22px; height: 3px; background: var(--muted); opacity: .6; }
.lg-ms { width: 9px; height: 9px; background: var(--ink); transform: rotate(45deg); }
.lg-late { width: 22px; height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--danger) 55%, var(--surface)); border: 1px solid var(--danger); }
.lg-dep { width: 22px; height: 0; border-top: 1.5px solid var(--muted); }

/* ── Board ──────────────────────────────────────────────── */
.cols { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; align-items: start; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 8px; min-height: 60vh; transition: background .12s; }
.col header { display: flex; align-items: center; gap: 8px; padding: 2px 6px 10px; }
.col h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: var(--ink-2); }
.col-blocked h2 { color: var(--warn); }
.col-done h2 { color: var(--muted); }
.count { font-size: 12px; color: var(--muted); background: var(--surface); border-radius: 99px; padding: 0 8px; }
.col-cards { display: grid; gap: 8px; }
.col-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }
.bcard { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--job); border-radius: var(--radius-sm); padding: 10px 12px; box-shadow: var(--shadow-1); cursor: grab; }
.bcard:hover { box-shadow: var(--shadow-2); }
.bcard-title { font-weight: 600; text-align: left; line-height: 1.35; overflow-wrap: anywhere; }
.bcard-title:hover { color: var(--accent); }
.bcard-meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; flex-wrap: wrap; }
.bcard-why { margin-top: 8px; font-size: 12px; color: var(--warn); background: var(--warn-soft); padding: 5px 8px; border-radius: 5px; }
.bcard-after { margin-top: 6px; font-size: 12px; color: var(--muted); }
.bcard-foot { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.bcard-foot:empty { display: none; }
.col-done .bcard { opacity: .75; }

/* ── Notes ──────────────────────────────────────────────── */
.notes-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
.notes-layout > * { min-width: 0; }
.notes-jobs { display: grid; gap: 2px; position: sticky; top: 0; }
.notes-job { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); text-align: left; color: var(--ink-2); }
.notes-job span:nth-child(2) { flex: 1; }
.notes-job:hover { background: var(--surface-2); }
.notes-job.on { background: var(--surface); box-shadow: var(--shadow-1); color: var(--ink); font-weight: 600; }
.notes-job .muted { font-size: 11px; font-weight: 400; }
.paper { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-1); min-height: 60vh; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 6px 10px 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs button { padding: 9px 12px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.paper-tools { padding: 10px 24px 0; }
.note-text { border: 0; border-radius: 0; padding: 20px 28px 40px; font-size: 15px; line-height: 1.75; min-height: 50vh; resize: none; background: transparent; box-shadow: none !important; overflow: hidden; }

/* ── Drawer ─────────────────────────────────────────────── */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: var(--drawer); max-width: 100vw; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-2); z-index: 20; overflow-y: auto; padding: 14px 22px 40px; display: flex; flex-direction: column; gap: 14px; animation: slide-in .18s ease; outline: none; }
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 -8px; }
.drawer-crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); font-weight: 600; min-width: 0; padding-left: 8px; }
.drawer-head-actions { display: flex; gap: 2px; }
.drawer-title { font: 600 21px/1.3 var(--font-display); border-color: transparent; padding: 4px 8px; margin: 0 -8px; width: calc(100% + 16px); background: transparent; letter-spacing: -.3px; }
.drawer-title:hover { border-color: var(--line); }
.drawer-row { display: flex; gap: 10px; flex-wrap: wrap; }
.fields.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
.field-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.field-hint.danger { color: var(--danger); }
.notice { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px; }
.notice .icon { margin-top: 2px; }
.notice ul { margin: 2px 0 0; padding-left: 16px; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.danger { background: var(--danger-soft); color: var(--danger); }
.deps { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 4px; }
.deps li { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 8px; background: var(--surface-2); border-radius: 6px; font-size: 13px; }
.deps li .link { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.deps li.is-done .link { color: var(--muted); text-decoration: line-through; }
.tick-mini { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; flex-shrink: 0; }
.tick-mini.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 7px; background: var(--sw); border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--surface); }
.swatch.on { border-color: var(--sw); }
.phase-list { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 4px; counter-reset: ph; }
.phase-list li { display: flex; align-items: center; gap: 4px; counter-increment: ph; }
.phase-list li::before { content: counter(ph); width: 18px; font-size: 12px; color: var(--muted); text-align: right; margin-right: 4px; }
.phase-list input { padding: 4px 8px; }
.phase-list .muted { width: 22px; text-align: center; font-size: 12px; }
.phase-list .up .icon { transform: rotate(90deg); } .phase-list .down .icon { transform: rotate(90deg); }

/* ── Overlays ───────────────────────────────────────────── */
.menu { position: fixed; z-index: 50; min-width: 230px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-2); padding: 5px; display: grid; }
.menu-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; text-align: left; }
.menu-item span:not(.icon-gap) { flex: 1; }
.menu-item:hover:not(:disabled), .menu-item:focus-visible { background: var(--surface-2); outline: none; }
.menu-item.danger { color: var(--danger); }
.icon-gap { width: 16px; }
.menu-sep { height: 1px; background: var(--line); margin: 4px 2px; }
.menu-heading { font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--muted); padding: 6px 10px 2px; }
.toasts { position: fixed; bottom: 18px; left: 16px; right: 16px; z-index: 60; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--bg); padding: 9px 10px 9px 14px; border-radius: 9px; box-shadow: var(--shadow-2); max-width: min(620px, calc(100vw - 32px)); font-size: 13px; animation: toast-in .18s ease; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }
.toast.error .icon:first-child { color: light-dark(#ff9b85, var(--danger)); } .toast.warn .icon:first-child { color: light-dark(#f2c66d, var(--warn)); }
.toast-action { color: light-dark(var(--accent-soft), var(--accent-strong)); font-weight: 700; padding: 2px 6px; border-radius: 5px; }
.toast-action:hover { background: rgb(255 255 255 / .12); }
.toast-close { opacity: .6; padding: 2px; } .toast-close:hover { opacity: 1; }
.modal { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-2); width: min(560px, calc(100vw - 32px)); max-height: 86vh; }
.modal.wide { width: min(920px, calc(100vw - 32px)); }
.modal::backdrop { background: rgb(10 20 15 / .4); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 17px; }
.modal-body { padding: 18px 22px 24px; overflow: auto; }
.help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.help-grid h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 18px 0 8px; }
.help-grid h3:first-child { margin-top: 0; }
.help-grid p { margin-bottom: 8px; color: var(--ink-2); }
.keys { border-collapse: collapse; width: 100%; font-size: 13px; }
.keys td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.keys td:first-child { white-space: nowrap; padding-right: 14px; width: 1%; }
.keys kbd { margin-right: 4px; }

/* ── Fluent component styling ───────────────────────────── */
:root[data-style="fluent"] {
  /* Suite header: the brand block and the top bar share one blue band. */
  & .sidebar { padding: 0 0 12px; background: var(--surface-2); border-right-color: var(--line); gap: 2px; }
  & .brand { height: 48px; padding: 0 16px; margin-bottom: 10px; background: var(--header); color: var(--on-header); gap: 10px; }
  & .brand-mark { width: auto; height: auto; background: none; color: var(--on-header); border-radius: 0; }
  & .brand strong { font: 600 16px/1 var(--font); letter-spacing: 0; }
  & .book-name { color: rgb(255 255 255 / .8); font-size: 11px; }
  & .book-name:hover { color: #fff; }
  & .topbar { height: 48px; padding: 0 20px; background: var(--header); border-bottom: 0; color: var(--on-header); }
  & #quick-add { height: 32px; padding: 0 40px 0 36px; background: rgb(255 255 255 / .9); color: #323130; border: 1px solid transparent; border-radius: 2px; }
  & #quick-add::placeholder { color: #605e5c; }
  & #quick-add:focus { background: #fff; border-color: #fff; box-shadow: none; }
  & .quick-icon { color: #0078d4; }
  & .quick-kbd { background: transparent; border-color: #c8c6c4; color: #605e5c; }
  & .topbar .status, & .topbar .icon-btn { color: var(--on-header); }
  & .topbar .status:hover, & .topbar .icon-btn:hover { background: rgb(255 255 255 / .15); color: #fff; }
  & .topbar .status-dot { box-shadow: 0 0 0 1.5px rgb(255 255 255 / .8); }
  & .topbar .status.warn, & .topbar .status.danger { color: #fff; }
  & .topbar .btn { background: #fff; border-color: #fff; color: #0078d4; }
  & .topbar .btn:hover:not(:disabled) { background: #f3f2f1; border-color: #f3f2f1; }
  & .topbar .btn.primary { background: #fff; color: #005a9e; font-weight: 600; }

  /* Left navigation: flat rows, blue indicator bar on the current view. */
  & .nav { padding: 0 8px; gap: 0; }
  & .nav-item { border-radius: 2px; padding: 9px 12px; font-weight: 400; color: var(--ink); position: relative; }
  & .nav-item:hover { background: var(--surface-3); }
  & .nav-item.on { background: var(--surface); box-shadow: none; font-weight: 600; }
  & .nav-item.on::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: var(--accent); border-radius: 2px; }
  & .jobs-head { padding: 12px 20px 4px; font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--ink); }
  & .jobs { padding: 0 8px; }
  & .job-link { border-radius: 2px; }
  & .job-link.on { background: var(--surface); box-shadow: inset 3px 0 0 var(--job); }
  & .side-foot { padding: 12px 8px 0; }

  /* Page headers: plain semibold titles, no decorative eyebrows. */
  & .main { padding: 24px 32px 64px; }
  & .page-head h1 { font: 600 24px/32px var(--font); letter-spacing: 0; }
  & .eyebrow { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 400; color: var(--muted); }
  & .welcome h1 { font: 600 32px/40px var(--font); letter-spacing: 0; }

  /* Surfaces: borderless cards on depth shadows. */
  & .panel, & .plan-scroll, & .tray, & .paper { border: 0; box-shadow: var(--shadow-1); }
  & .panel-head h2, & .tray h2 { font-size: 16px; font-weight: 600; }
  & .day, & .col { border: 0; background: var(--surface-2); }
  & .day.weekend { background: color-mix(in srgb, var(--surface-2) 55%, var(--bg)); }
  & .day.is-today { box-shadow: inset 0 3px 0 var(--accent); border: 0; }
  & .wcard, & .bcard { border: 0; box-shadow: var(--shadow-1); }
  & .wcard { border-left: 3px solid var(--job); }
  & .bcard { border-top: 0; border-left: 3px solid var(--job); }
  & .bcard:hover, & .wcard:hover { box-shadow: var(--shadow-2); }
  & .col h2 { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); }
  & .col-blocked h2 { color: var(--danger); }
  & .count { background: transparent; padding: 0; }

  /* Controls: 32px, 2px corners, 600-weight buttons, Fluent focus borders. */
  & .btn { min-height: 32px; padding: 0 16px; border-color: var(--muted); font-weight: 600; }
  & .btn.sm { min-height: 24px; padding: 0 8px; font-weight: 400; }

<script>
(() => {
'use strict';
// ── core/dates.js ──
// Calendar-day arithmetic on ISO dates (YYYY-MM-DD). All math is done in UTC
// day numbers so daylight-saving changes never shift a date.

const DAY_MS = 86400000;
const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;
const WEEKDAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const FULL_WEEKDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function isIsoDate(value) {
  if (typeof value !== 'string' || !ISO_RE.test(value)) return false;
  const [y, m, d] = value.split('-').map(Number);
  if (y < 1900 || y > 2200) return false;
  return new Date(Date.UTC(y, m - 1, d)).toISOString().slice(0, 10) === value;
}

function todayIso(now = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}`;
}

function dayNum(iso) {
  if (!isIsoDate(iso)) throw new Error(`Not a valid date: ${iso}`);
  const [y, m, d] = iso.split('-').map(Number);
  return Date.UTC(y, m - 1, d) / DAY_MS;
}

function fromDayNum(n) { return new Date(n * DAY_MS).toISOString().slice(0, 10); }
function addDays(iso, n) { return fromDayNum(dayNum(iso) + n); }
function diffDays(a, b) { return dayNum(b) - dayNum(a); }
function weekday(iso) { return new Date(dayNum(iso) * DAY_MS).getUTCDay(); }
function mondayOf(iso) { return addDays(iso, -((weekday(iso) + 6) % 7)); }

function weekDays(monday) { return Array.from({ length: 7 }, (_, i) => addDays(monday, i)); }

/** "Mon 20 Oct" — or "Mon 20 Oct 2027" outside the current year. */
function fmtDate(iso, today = todayIso()) {
  if (!iso) return '';
  const n = new Date(dayNum(iso) * DAY_MS);
  const base = `${DAY_NAMES[n.getUTCDay()]} ${n.getUTCDate()} ${MONTHS[n.getUTCMonth()]}`;
  return iso.slice(0, 4) === today.slice(0, 4) ? base : `${base} ${iso.slice(0, 4)}`;
}

/** "Saturday 17 October". */
function fmtLong(iso) {
  const n = new Date(dayNum(iso) * DAY_MS);
  const month = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][n.getUTCMonth()];
  return `${FULL_WEEKDAYS[n.getUTCDay()][0].toUpperCase()}${FULL_WEEKDAYS[n.getUTCDay()].slice(1)} ${n.getUTCDate()} ${month}`;
}

function fmtShort(iso) {
  if (!iso) return '';
  const n = new Date(dayNum(iso) * DAY_MS);
  return `${n.getUTCDate()} ${MONTHS[n.getUTCMonth()]}`;
}

/** Human distance from today: "today", "tomorrow", "in 3 days", "2 days ago". */
function relDay(iso, today = todayIso()) {
  const d = diffDays(today, iso);
  if (d === 0) return 'today';
  if (d === 1) return 'tomorrow';
  if (d === -1) return 'yesterday';
  return d > 0 ? `in ${d} days` : `${-d} days ago`;
}

/** Parses "today", "tomorrow", weekday names (next occurrence, today included) and ISO dates. */
function parseDayWord(word, today = todayIso()) {
  const w = word.toLowerCase();
  if (w === 'today' || w === 'tod') return today;
  if (w === 'tomorrow' || w === 'tmr' || w === 'tom') return addDays(today, 1);
  const idx = WEEKDAYS.findIndex(d => w === d || w === FULL_WEEKDAYS[WEEKDAYS.indexOf(d)]);
  if (idx >= 0) return addDays(today, (idx - weekday(today) + 7) % 7);
  if (isIsoDate(word)) return word;
  return null;
}

const MONTH_NAMES = MONTHS;

// ── core/model.js ──
// Planning-book schema: factories, validation and migration from older files.

const FORMAT = 'tas-time-planning-book';
const VERSION = 3;
const MAX_FILE_BYTES = 15_000_000;

const STATUS = { todo: 'To do', doing: 'Doing', done: 'Done' };
const JOB_STATUS = { active: 'Active', hold: 'On hold', done: 'Complete' };
const NOTE_PAGES = [
  ['restart', 'Resume here'],
  ['scope', 'Scope & outcome'],
  ['decisions', 'Decisions'],
  ['working', 'Working notes'],
  ['references', 'References'],
];
const COLORS = {
  forest: { label: 'Forest', hex: '#2f6b4f' },
  blue: { label: 'Blue', hex: '#2f62a3' },
  plum: { label: 'Plum', hex: '#7d4f8a' },
  amber: { label: 'Amber', hex: '#a66a12' },
  teal: { label: 'Teal', hex: '#1f7a80' },
  rose: { label: 'Rose', hex: '#a8455f' },
  slate: { label: 'Slate', hex: '#56657a' },
  olive: { label: 'Olive', hex: '#6b7a2a' },
};
const DEFAULT_CAPACITY = 10 * 60;

function uid() {
  return globalThis.crypto?.randomUUID?.() || `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
}

function newBook(name = 'My planning book') {
  return { format: FORMAT, version: VERSION, id: uid(), name, jobs: [], phases: [], items: [], weeks: {}, baselineDate: '' };
}

function newJob(fields = {}) {
  return {
    id: uid(), title: '', code: '', outcome: '', color: 'forest', status: 'active', archived: false,
    notes: Object.fromEntries(NOTE_PAGES.map(([k]) => [k, ''])), ...fields,
  };
}

function newPhase(jobId, title, order) { return { id: uid(), jobId, title, order }; }

function newItem(fields = {}) {
  return {
    id: uid(), jobId: '', phaseId: '', title: '', kind: 'task', status: 'todo',
    start: '', finish: '', effort: 0, plannedDay: '', owner: '', blocker: '', deps: [],
    baseline: null, doneOn: '', notes: '', archived: false, ...fields,
  };
}

/** Picks the first unused colour so new jobs are distinguishable by default. */
function nextColor(book) {
  const used = new Set(book.jobs.filter(j => !j.archived).map(j => j.color));
  return Object.keys(COLORS).find(c => !used.has(c)) || 'forest';
}

function fail(message) { throw new Error(message); }
function text(v, label, max = 100000) { if (typeof v !== 'string' || v.length > max) fail(`${label} must be text (max ${max.toLocaleString()} characters).`); }
function date(v, label) { if (v !== '' && !isIsoDate(v)) fail(`${label} must be a real date.`); }
function whole(v, label, max) { if (!Number.isInteger(v) || v < 0 || v > max) fail(`${label} must be a whole number from 0 to ${max.toLocaleString()}.`); }

/** Throws a readable error for the first problem found; returns the book otherwise. */
function validate(book) {
  if (!book || book.format !== FORMAT) fail('This file is not a Tas-Time planning book.');
  if (book.version !== VERSION) fail(`Unsupported planning-book version ${book.version}.`);
  text(book.name, 'Book name', 200);
  for (const k of ['jobs', 'phases', 'items']) if (!Array.isArray(book[k]) || book[k].length > 20000) fail(`The ${k} list is invalid.`);
  const ids = new Set();
  for (const row of [...book.jobs, ...book.phases, ...book.items]) {
    if (!row || typeof row !== 'object') fail('A record is malformed.');
    text(row.id, 'Identifier', 200);
    if (!row.id || ids.has(row.id)) fail('Record identifiers must be unique.');
    ids.add(row.id);
    text(row.title, 'Title', 500);
  }
  const jobs = new Map(book.jobs.map(j => [j.id, j]));
  const phases = new Map(book.phases.map(p => [p.id, p]));
  const items = new Map(book.items.map(t => [t.id, t]));
  for (const j of book.jobs) {
    text(j.code, 'Job code', 40); text(j.outcome, 'Outcome');
    if (!JOB_STATUS[j.status]) fail('Invalid job status.');
    if (!COLORS[j.color]) fail('Invalid job colour.');
    if (typeof j.archived !== 'boolean') fail('Invalid job archive flag.');
    if (!j.notes || typeof j.notes !== 'object') fail('Invalid job notebook.');
    for (const [k] of NOTE_PAGES) text(j.notes[k], 'Notebook page');
  }
  for (const p of book.phases) {
    if (!jobs.has(p.jobId)) fail('A phase belongs to a missing job.');
    whole(p.order, 'Phase order', 1e6);
  }
  for (const t of book.items) {
    if (!jobs.has(t.jobId)) fail(`"${t.title}" belongs to a missing job.`);
    if (t.phaseId && phases.get(t.phaseId)?.jobId !== t.jobId) fail(`"${t.title}" refers to a phase from another job.`);
    if (!['task', 'milestone'].includes(t.kind)) fail('Invalid item kind.');
    if (!STATUS[t.status]) fail('Invalid item status.');
    if (typeof t.archived !== 'boolean') fail('Invalid item archive flag.');
    for (const k of ['owner', 'blocker', 'notes']) text(t[k], k);
    date(t.start, 'Start'); date(t.finish, 'Finish'); date(t.plannedDay, 'Planned day'); date(t.doneOn, 'Done date');
    if (t.start && t.finish && t.finish < t.start) fail(`"${t.title}" finishes before it starts.`);
    if (t.kind === 'milestone' && t.start !== t.finish) fail(`Milestone "${t.title}" needs a single date.`);
    whole(t.effort, 'Effort (minutes)', 1e6);
    if (t.baseline !== null) {
      if (typeof t.baseline !== 'object') fail('Invalid baseline.');
      date(t.baseline.start, 'Baseline start'); date(t.baseline.finish, 'Baseline finish');
    }
    if (!Array.isArray(t.deps) || new Set(t.deps).size !== t.deps.length) fail('Invalid dependency list.');
    for (const d of t.deps) if (!items.has(d) || d === t.id) fail(`"${t.title}" depends on a missing item.`);
  }
  if (findCycle(book.items)) fail('These dependencies form a loop. Remove one of the links.');
  if (!book.weeks || typeof book.weeks !== 'object' || Array.isArray(book.weeks)) fail('Invalid weekly plans.');
  for (const [key, w] of Object.entries(book.weeks)) {
    if (!isIsoDate(key) || mondayOf(key) !== key) fail('Weekly plans must start on a Monday.');
    whole(w.capacity, 'Weekly capacity', 7 * 24 * 60); text(w.notes, 'Week notes');
  }
  date(book.baselineDate, 'Baseline date');
  return book;
}

/** Iterative topological check (Kahn) so large imports cannot overflow the stack. */
function findCycle(items) {
  const incoming = new Map(items.map(t => [t.id, t.deps.length]));
  const children = new Map(items.map(t => [t.id, []]));
  for (const t of items) for (const d of t.deps) children.get(d)?.push(t.id);
  const queue = items.filter(t => !t.deps.length).map(t => t.id);
  let seen = 0;
  while (queue.length) {
    const id = queue.pop(); seen++;
    for (const c of children.get(id)) { incoming.set(c, incoming.get(c) - 1); if (!incoming.get(c)) queue.push(c); }
  }
  return seen !== items.length;
}

const V2_STATUS = { 'Not started': 'todo', 'In progress': 'doing', Done: 'done' };
const V2_JOB_STATUS = { Active: 'active', 'On hold': 'hold', Complete: 'done' };

/** Upgrades version 1 and 2 books to the current schema without dropping data. */
function migrate(raw) {
  if (!raw || raw.format !== FORMAT) fail('This file is not a Tas-Time planning book.');
  if (raw.version === VERSION) return raw;
  if (raw.version !== 1 && raw.version !== 2) fail(`Unsupported planning-book version ${raw.version}.`);
  const book = newBook(String(raw.name || 'Imported planning book'));
  book.baselineDate = raw.baselineDate || '';
  book.weeks = structuredClone(raw.weeks || {});
  for (const j of raw.jobs || []) {
    const notes = { ...newJob().notes, ...(j.notes || {}) };
    const color = COLORS[j.color] ? j.color : 'forest';
    book.jobs.push({ id: j.id, title: j.title, code: String(j.code || '').slice(0, 40), outcome: j.outcome || '', color,
      status: V2_JOB_STATUS[j.status] || 'active', archived: !!j.archived, notes });
  }
  book.phases = (raw.phases || []).map(p => ({ id: p.id, jobId: p.jobId, title: p.title, order: p.order }));
  for (const t of raw.items || []) {
    const hasBaseline = t.baselineStart || t.baselineFinish;
    book.items.push(newItem({
      id: t.id, jobId: t.jobId, phaseId: t.phaseId || '', title: t.title, kind: t.kind === 'Milestone' ? 'milestone' : 'task',
      status: V2_STATUS[t.status] || 'todo', start: t.start || '', finish: t.finish || '', effort: t.remaining || 0,
      plannedDay: t.plannedDay || '', owner: t.owner || '', blocker: t.blocker || '', deps: [...(t.predecessors || [])],
      baseline: hasBaseline ? { start: t.baselineStart || '', finish: t.baselineFinish || '' } : null,
      doneOn: t.acceptedOn || '', notes: t.notes || '', archived: !!t.archived,
    }));
  }
  return book;
}

/** Parses file text into a validated current-version book. */
function decodeBook(textValue) {
  if (textValue.length > MAX_FILE_BYTES) fail('This file is larger than the 15 MB limit.');
  let raw;
  try { raw = JSON.parse(textValue); } catch { fail('This file is not valid JSON.'); }
  const upgraded = raw?.version !== VERSION;
  return { book: validate(migrate(raw)), upgradedFrom: upgraded ? raw.version : null };
}

function encodeBook(book) { return JSON.stringify(validate(book), null, 2); }

// ── core/store.js ──
// Book state with undo/redo. Every change goes through commit(), which clones,
// applies the mutation, validates, and only then publishes the new book.

const HISTORY_LIMIT = 200;
const COALESCE_MS = 1500;

function createStore(initial) {
  let book = validate(initial);
  let past = [];
  let future = [];
  let revision = 0;
  let savedRevision = 0;
  let lastKey = '';
  let lastAt = 0;
  const listeners = new Set();

  const emit = reason => { for (const fn of listeners) fn(reason); };

  return {
    get book() { return book; },
    get revision() { return revision; },
    get dirty() { return revision !== savedRevision; },
    get canUndo() { return past.length > 0; },
    get canRedo() { return future.length > 0; },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },

    /**
     * Applies fn to a draft. Typing into one field produces one undo step:
     * commits with the same key within COALESCE_MS replace the last snapshot.
     * Returns fn's result. Throws (leaving state untouched) when the change is invalid.
     */
    commit(label, fn, { key = '', quiet = false } = {}) {
      const draft = structuredClone(book);
      const result = fn(draft);
      validate(draft);
      const now = Date.now();
      const coalesce = key && key === lastKey && now - lastAt < COALESCE_MS;
      if (!coalesce) {
        past.push({ book, label });
        if (past.length > HISTORY_LIMIT) past.shift();
      }
      future = [];
      lastKey = key; lastAt = now;
      book = draft; revision++;
      emit(quiet ? 'quiet' : 'change');
      return result;
    },

    undo() {
      const step = past.pop();
      if (!step) return '';
      future.push({ book, label: step.label });
      book = step.book; revision++; lastKey = '';
      emit('change');
      return step.label;
    },

    redo() {
      const step = future.pop();
      if (!step) return '';
      past.push({ book, label: step.label });
      book = step.book; revision++; lastKey = '';
      emit('change');
      return step.label;
    },

    /** Replaces the whole book (open, new, example). Clears history. */
    replace(next, { dirty = false } = {}) {
      book = validate(next); past = []; future = []; lastKey = '';
      revision++; savedRevision = dirty ? -1 : revision;
      emit('replace');
    },

    markSaved(atRevision) { savedRevision = atRevision; emit('saved'); },
  };
}

const SVG_NS = 'http://www.w3.org/2000/svg';
const SVG_TAGS = new Set(['svg', 'path', 'line', 'polyline', 'rect', 'circle', 'g', 'polygon', 'defs', 'marker']);

function h(tag, props, ...children) {
  const el = SVG_TAGS.has(tag) ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);
  if (props) {
    for (const [key, value] of Object.entries(props)) {
      if (value === null || value === undefined || value === false) continue;
      if (key === 'class') el.setAttribute('class', Array.isArray(value) ? value.filter(Boolean).join(' ') : value);
      else if (key === 'style' && typeof value === 'object') {
        // setProperty is required for custom properties (--job); plain assignment drops them silently.
        for (const [prop, v] of Object.entries(value)) {
          if (v === null || v === undefined) continue;
          if (prop.startsWith('--')) el.style.setProperty(prop, v); else el.style[prop] = v;
        }
      }
      else if (key.startsWith('on') && typeof value === 'function') el.addEventListener(key.slice(2).toLowerCase(), value);
      else if (key === 'value' && 'value' in el && !SVG_TAGS.has(tag)) el.value = value;
      else if (key === 'checked' || key === 'selected' || key === 'indeterminate') el[key] = !!value;
      else el.setAttribute(key, value === true ? '' : String(value));
    }
  }
  append(el, children);
  return el;
}

function append(el, children) {
  for (const child of children) {
    if (child === null || child === undefined || child === false || child === '') continue;
    if (Array.isArray(child)) append(el, child);
    else el.append(child instanceof Node ? child : document.createTextNode(String(child)));

/** Replaces el's children, skipping null/false and flattening arrays (unlike replaceChildren). */
function fill(el, ...children) {
  el.replaceChildren();
  append(el, children);

// ── core/parse.js ──
// Human input: effort durations and the one-line quick-add syntax.

/** "1h30", "1h 30m", "90m", "1.5h", "1.5" (hours), "45" (minutes if ≥ 10). Returns minutes or null. */
function parseEffort(input) {
  const s = String(input).trim().toLowerCase().replace(/\s+/g, '');
  if (s === '') return 0;
  let m = s.match(/^(\d+(?:\.\d+)?)h(?:(\d+)m?)?$/);
  if (m) return Math.round(Number(m[1]) * 60 + Number(m[2] || 0));
  m = s.match(/^(\d+)(?:m|min|mins)$/);
  if (m) return Number(m[1]);
  m = s.match(/^(\d+(?:\.\d+)?)d$/);
  if (m) return Math.round(Number(m[1]) * 8 * 60);
  m = s.match(/^(\d+(?:\.\d+)?)$/);
  if (m) {
    const n = Number(m[1]);
    // Bare small numbers read as hours ("2" = 2h); larger whole numbers as minutes ("45").
    return n < 10 ? Math.round(n * 60) : Math.round(n);
  }
  return null;
}

/** 0 → "", 45 → "45m", 90 → "1h 30m", 120 → "2h". */
function fmtEffort(min) {
  if (!min) return '';
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
}

/** Hours with one decimal, for totals: 135 → "2.3h". */
function fmtHours(min) {
  const h = min / 60;
  return `${Number.isInteger(h) ? h : h.toFixed(1)}h`;
}

const EFFORT_TOKEN = /^\d+(?:\.\d+)?h(?:\d+m?)?$|^\d+(?:m|min|mins|d)$/i;

/**
 * Quick add: "Draft literature review #phd 2h @tue !fri"
 *   #code   job (matches code or title start)   2h / 30m / 1h30   effort
 *   @day    plan to work on it that day          !day              due (finish) date
 *   *       leading star marks a milestone
 */
function parseQuickAdd(input, jobs, today = todayIso()) {
  const tokens = input.trim().split(/\s+/).filter(Boolean);
  const out = { title: '', jobId: '', jobHint: '', effort: null, plannedDay: '', finish: '', kind: 'task', errors: [] };
  const words = [];
  for (const tok of tokens) {
    if (tok.length > 1 && tok[0] === '#') {
      out.jobHint = tok.slice(1);
      const job = matchJob(jobs, out.jobHint);
      if (job) out.jobId = job.id; else out.errors.push(`No job matches “${tok}”`);
    } else if (tok.length > 1 && (tok[0] === '@' || tok[0] === '!')) {
      const day = parseDayWord(tok.slice(1), today);
      if (!day) { out.errors.push(`Unrecognised day “${tok}”`); continue; }
      if (tok[0] === '@') out.plannedDay = day; else out.finish = day;
    } else if (EFFORT_TOKEN.test(tok)) {
      out.effort = parseEffort(tok);
    } else words.push(tok);
  }
  if (words[0] === '*') { out.kind = 'milestone'; words.shift(); } else if (words[0]?.startsWith('*')) { out.kind = 'milestone'; words[0] = words[0].slice(1); }
  out.title = words.join(' ');
  return out;
}

function matchJob(jobs, hint) {
  const h = hint.toLowerCase();
  const live = jobs.filter(j => !j.archived);
  return live.find(j => j.code.toLowerCase() === h)
    || live.find(j => j.code.toLowerCase().startsWith(h))
    || live.find(j => j.title.toLowerCase().startsWith(h))
    || live.find(j => j.title.toLowerCase().split(/\s+/).some(w => w.startsWith(h)));
}

// ── core/query.js ──
// Read-only derivations used by the views. None of these mutate the book.

function jobOf(book, id) { return book.jobs.find(j => j.id === id); }
function itemOf(book, id) { return book.items.find(t => t.id === id); }
function liveJobs(book) { return book.jobs.filter(j => !j.archived); }
function isHidden(book, t) { return t.archived || !!jobOf(book, t.jobId)?.archived; }
function liveItems(book) { return book.items.filter(t => !isHidden(book, t)); }

function phasesOf(book, jobId) {
  return book.phases.filter(p => p.jobId === jobId).sort((a, b) => a.order - b.order);
}

function phaseTitle(book, id) { return book.phases.find(p => p.id === id)?.title || ''; }

/** Reasons an item cannot progress: a recorded constraint or unfinished prerequisites. */
function blockers(book, t) {
  if (t.status === 'done') return [];
  const out = [];
  if (t.blocker.trim()) out.push(t.blocker.trim());
  for (const id of t.deps) {
    const d = itemOf(book, id);
    if (d && d.status !== 'done') out.push(`Waiting for “${d.title}”`);
  }
  return out;
}

/** Prerequisites that are not finished yet. */
function waitingOn(book, t) {
  return t.status === 'done' ? [] : t.deps.map(id => itemOf(book, id)).filter(d => d && d.status !== 'done');
}

/**
 * Blocked means "should be moving but can't": a written constraint, or unfinished
 * prerequisites once the task is due to start, planned for today or earlier, or in progress.
 * A future task whose prerequisite is still open is just waiting its turn.
 */
function isBlocked(book, t, today) {
  if (t.status === 'done') return false;
  if (t.blocker.trim()) return true;
  if (!waitingOn(book, t).length) return false;
  return t.status === 'doing' || (!!t.start && t.start <= today) || (!!t.plannedDay && t.plannedDay <= today);
}
function isLate(t, today) { return t.status !== 'done' && !!t.finish && t.finish < today; }

/** Days the forecast finish has moved since the baseline (positive = later). */
function slip(t) {
  return t.baseline?.finish && t.finish ? diffDays(t.baseline.finish, t.finish) : null;
}

/** Prerequisites forecast to finish after this item is forecast to start. */
function dateConflicts(book, t) {
  if (!t.start || t.status === 'done') return [];
  return t.deps.map(id => itemOf(book, id)).filter(d => d?.finish && d.finish > t.start);
}

function boardColumn(book, t, today) {
  if (t.status === 'done') return 'done';
  return isBlocked(book, t, today) ? 'blocked' : t.status;
}

function matchesFocus(t, focus) { return !focus || t.jobId === focus; }

function openEffort(list) { return list.reduce((n, t) => n + (t.status === 'done' ? 0 : t.effort), 0); }

function weekLoad(book, monday, focus = '') {
  const days = weekDays(monday);
  const end = days[6];
  const items = liveItems(book).filter(t => t.plannedDay >= monday && t.plannedDay <= end);
  const byDay = Object.fromEntries(days.map(d => [d, []]));
  for (const t of items) byDay[t.plannedDay].push(t);
  const shown = items.filter(t => matchesFocus(t, focus));
  return {
    days, byDay, items,
    shown,
    planned: openEffort(items),
    done: items.filter(t => t.status === 'done').length,
    unestimated: items.filter(t => t.status !== 'done' && t.kind === 'task' && !t.effort).length,
  };
}

/** Open, unblocked work that has no planned day yet (or was planned before this week and not finished). */
function readyToPlan(book, monday, focus = '') {
  return liveItems(book)
    .filter(t => t.status !== 'done' && t.kind === 'task' && matchesFocus(t, focus))
    .filter(t => !t.plannedDay || t.plannedDay < monday)
    .sort(byUrgency);
}

function byUrgency(a, b) {
  return (a.finish || '9999').localeCompare(b.finish || '9999') || (a.start || '9999').localeCompare(b.start || '9999') || a.title.localeCompare(b.title);
}

function todayList(book, today, focus = '') {
  const live = liveItems(book).filter(t => matchesFocus(t, focus));
  const planned = live.filter(t => t.plannedDay === today);
  const carried = live.filter(t => t.status !== 'done' && t.plannedDay && t.plannedDay < today).sort(byUrgency);
  const overdue = live.filter(t => isLate(t, today) && t.plannedDay !== today && !carried.includes(t)).sort(byUrgency);
  return { planned, carried, overdue };
}

function upcomingMilestones(book, today, days = 21, focus = '') {
  const end = addDays(today, days);
  return liveItems(book)
    .filter(t => t.kind === 'milestone' && t.status !== 'done' && t.finish && t.finish <= end && matchesFocus(t, focus))
    .sort(byUrgency);
}

function jobSummary(book, job, today) {
  const items = book.items.filter(t => t.jobId === job.id && !t.archived);
  const open = items.filter(t => t.status !== 'done');
  const phases = phasesOf(book, job.id);
  const current = phases.find(p => open.some(t => t.phaseId === p.id));
  const nextMilestone = open.filter(t => t.kind === 'milestone').sort(byUrgency)[0];
  const finish = items.map(t => t.finish).filter(Boolean).sort().at(-1) || '';
  return {
    total: items.length, done: items.length - open.length, open: open.length, effort: openEffort(items),
    late: open.filter(t => isLate(t, today)).length, blocked: open.filter(t => isBlocked(book, t, today)).length,
    currentPhase: current?.title || '', nextMilestone, finish,
  };
}

/** Rows for the Plan view: job headers, phase headers and items in programme order. */
function planRows(book, { focus = '', showDone = true, showArchived = false } = {}) {
  const rows = [];
  const jobs = book.jobs.filter(j => (showArchived || !j.archived) && (!focus || j.id === focus));
  for (const job of jobs) {
    rows.push({ type: 'job', job });
    const items = book.items.filter(t => t.jobId === job.id && (showArchived || !t.archived) && (showDone || t.status !== 'done'));
    const groups = [...phasesOf(book, job.id).map(p => [p, items.filter(t => t.phaseId === p.id)]), [null, items.filter(t => !t.phaseId)]];
    for (const [phase, list] of groups) {
      if (!phase && !list.length) continue;
      rows.push({ type: 'phase', phase, job });
      for (const item of [...list].sort(bySchedule)) rows.push({ type: 'item', item, job });
    }
  }
  return rows;
}

function bySchedule(a, b) {
  return (a.start || a.finish || '9999').localeCompare(b.start || b.finish || '9999') || (a.finish || '9999').localeCompare(b.finish || '9999') || a.title.localeCompare(b.title);
}

/** Every item that (transitively) depends on id, used to refuse dependency loops in pickers. */
function dependents(book, id) {
  const out = new Set();
  const stack = [id];
  while (stack.length) {
    const cur = stack.pop();
    for (const t of book.items) if (t.deps.includes(cur) && !out.has(t.id)) { out.add(t.id); stack.push(t.id); }
  }
  return out;
}

// ── core/ops.js ──
// Mutations. Each takes a draft book (already cloned by the store) and edits it in place.

function addJob(book, fields = {}, phaseTitles = []) {
  const job = newJob({ color: nextColor(book), ...fields });
  book.jobs.push(job);
  phaseTitles.forEach((title, order) => book.phases.push(newPhase(job.id, title, order)));
  return job;
}

function addItem(book, fields) {
  const item = newItem(fields);
  if (item.kind === 'milestone') item.start = item.finish;
  book.items.push(item);
  return item;
}

function patchItem(book, id, patch, today) {
  const t = itemOf(book, id);
  if (!t) throw new Error('That item no longer exists.');
  const next = { ...t, ...patch };
  if (patch.jobId && patch.jobId !== t.jobId && !('phaseId' in patch)) next.phaseId = '';
  if (next.kind === 'milestone') {
    next.finish = next.finish || next.start;
    next.start = next.finish;
  }
  if ('start' in patch && next.kind === 'task' && next.start && next.finish && next.finish < next.start) {
    // Moving the start past the finish keeps the duration rather than failing.
    next.finish = t.start && t.finish ? addDays(next.start, diffDays(t.start, t.finish)) : next.start;
  }
  if ('status' in patch) applyStatus(book, next, t.status, today);
  Object.assign(t, next);
  return t;
}

function applyStatus(book, next, previous, today) {
  if (next.status === previous) return;
  if (next.status === 'done') {
    const reasons = blockers(book, { ...next, status: 'todo' });
    if (reasons.length) throw new Error(`Can’t complete yet: ${reasons.join('; ')}.`);
    next.doneOn = today;
  } else next.doneOn = '';
}

function setStatus(book, id, status, today) { return patchItem(book, id, { status }, today); }

/** Moves a bar on the programme, keeping its duration. */
function shiftItem(book, id, days) {
  const t = itemOf(book, id);
  if (!days) return;
  if (t.start) t.start = addDays(t.start, days);
  if (t.finish) t.finish = addDays(t.finish, days);
}

function deleteItem(book, id) {
  book.items = book.items.filter(t => t.id !== id);
  for (const t of book.items) t.deps = t.deps.filter(d => d !== id);
}

function duplicateItem(book, id) {
  const t = itemOf(book, id);
  const copy = { ...structuredClone(t), id: uid(), title: `${t.title} (copy)`, status: 'todo', doneOn: '', baseline: null };
  book.items.splice(book.items.indexOf(t) + 1, 0, copy);
  return copy;
}

function patchJob(book, id, patch) {
  const j = jobOf(book, id);
  if (!j) throw new Error('That job no longer exists.');
  Object.assign(j, patch);
  return j;
}

function setNote(book, jobId, page, value) { jobOf(book, jobId).notes[page] = value; }

function addPhase(book, jobId, title) {
  const order = phasesOf(book, jobId).reduce((n, p) => Math.max(n, p.order + 1), 0);
  const p = newPhase(jobId, title, order);
  book.phases.push(p);
  return p;
}

function renamePhase(book, id, title) { book.phases.find(p => p.id === id).title = title; }

function movePhase(book, id, delta) {
  const p = book.phases.find(x => x.id === id);
  const list = phasesOf(book, p.jobId);
  const i = list.indexOf(p);
  const j = i + delta;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  list.forEach((x, order) => { x.order = order; });
}

/** Removes a phase; its items stay in the job, unphased. */
function deletePhase(book, id) {
  for (const t of book.items) if (t.phaseId === id) t.phaseId = '';
  book.phases = book.phases.filter(p => p.id !== id);
}

/** Completely removes a job with its phases and items (undoable from the store). */
function deleteJob(book, id) {
  const gone = new Set(book.items.filter(t => t.jobId === id).map(t => t.id));
  book.items = book.items.filter(t => !gone.has(t.id));
  for (const t of book.items) t.deps = t.deps.filter(d => !gone.has(d));
  book.phases = book.phases.filter(p => p.jobId !== id);
  book.jobs = book.jobs.filter(j => j.id !== id);
}

function captureBaseline(book, today) {
  book.baselineDate = today;
  for (const t of book.items) if (!t.archived) t.baseline = t.start || t.finish ? { start: t.start, finish: t.finish } : null;
}

function setCapacity(book, monday, minutes) {
  book.weeks[monday] = { notes: '', ...book.weeks[monday], capacity: minutes };
}

function setWeekNotes(book, monday, notes, defaultCapacity) {
  book.weeks[monday] = { capacity: defaultCapacity, ...book.weeks[monday], notes };
}

function addDep(book, id, depId) {
  const t = itemOf(book, id);
  if (!t.deps.includes(depId)) t.deps.push(depId);
}

function removeDep(book, id, depId) {
  const t = itemOf(book, id);
  t.deps = t.deps.filter(d => d !== depId);
}

// ── ui/components.js ──
// Small building blocks shared by several views.

function jobColor(job) { return COLORS[job?.color]?.hex || COLORS.forest.hex; }

function jobTag(job, { full = false } = {}) {
  if (!job) return null;
  return h('span', { class: 'job-tag', style: { '--job': jobColor(job) }, title: job.title },
    h('span', { class: 'dot' }), full || !job.code ? job.title : job.code);
}

function chip(text, kind = '', title = '') { return h('span', { class: ['chip', kind], title: title || null }, text); }

/** Due-date chip that turns red once late and amber within two days. */
function dueChip(t) {
  if (!t.finish || t.status === 'done') return null;
  const late = isLate(t, today());
  const soon = !late && t.finish <= addDays(today(), 2);
  const label = t.kind === 'milestone' ? `◆ ${fmtDate(t.finish)}` : `Due ${relDay(t.finish)}`;
  return chip(label, late ? 'danger' : soon ? 'warn' : '', fmtDate(t.finish));
}

/** "Blocked: reason" when stuck now; a quiet "After X" when merely waiting on a prerequisite. */
function readiness(t) {
  const book = store.book;
  if (t.status === 'done') return null;
  if (isBlocked(book, t, today())) {
    const reasons = blockers(book, t);
    return chip(`Blocked · ${reasons[0]}`, 'warn', reasons.join('\n'));
  }
  const waiting = waitingOn(book, t);
  return waiting.length ? chip(`After “${waiting[0].title}”${waiting.length > 1 ? ` +${waiting.length - 1}` : ''}`, 'muted', waiting.map(w => w.title).join('\n')) : null;
}

/** Round completion checkbox. Disabled with an explanation while blocked. */
function doneToggle(t) {
  const book = store.book;
  const reasons = t.status === 'done' ? [] : blockers(book, t);
  const done = t.status === 'done';
  return h('button', {
    class: ['tick', done && 'on', t.kind === 'milestone' && 'tick-ms'],
    'aria-pressed': String(done),
    'aria-label': `${done ? 'Mark not done' : 'Mark done'}: ${t.title}`,
    title: reasons.length ? `Blocked: ${reasons.join('; ')}` : done ? 'Mark as not done' : 'Mark done',
    disabled: reasons.length ? true : null,
    onclick: event => {
      event.stopPropagation();
      act(done ? 'Reopen' : 'Complete', d => setStatus(d, t.id, done ? 'todo' : 'done', today()));
    },
  }, icon('check', 14));
}

/** A list row for an item: toggle, title, metadata, optional trailing actions. */
function itemRow(t, { actions = null, showJob = true, showPhase = false, dense = false } = {}) {
  const book = store.book;
  const job = jobOf(book, t.jobId);
  const phase = showPhase ? phaseTitle(book, t.phaseId) : '';
  return h('div', { class: ['row-item', t.status === 'done' && 'is-done', dense && 'dense'], 'data-item': t.id, style: { '--job': jobColor(job) } },
    doneToggle(t),
    h('div', { class: 'row-main' },
      h('button', { class: 'row-title', onclick: () => openDrawer('item', t.id) }, t.title),
      h('div', { class: 'row-meta' },
        showJob ? jobTag(job) : null,
        phase ? h('span', { class: 'muted' }, phase) : null,
        t.status === 'doing' ? chip('Doing', 'accent') : null,
        dueChip(t),
        readiness(t),
        t.effort && t.status !== 'done' ? h('span', { class: 'effort' }, fmtEffort(t.effort)) : null,
      )),
    actions ? h('div', { class: 'row-actions' }, actions) : null);
}

function segmented(options, value, onChange, label) {
  return h('div', { class: 'segmented', role: 'radiogroup', 'aria-label': label },
    options.map(([key, text]) => h('button', {
      role: 'radio', 'aria-checked': String(key === value), class: key === value ? 'on' : null,
      onclick: () => onChange(key),
    }, text)));
}

/** Planned vs capacity bar. */
function meter(used, capacity, { label = true } = {}) {
  const pct = capacity ? Math.min(100, (used / capacity) * 100) : used ? 100 : 0;
  const over = used > capacity;
  return h('div', { class: ['meter', over && 'over'] },
    h('div', { class: 'meter-track' }, h('span', { style: { width: `${pct}%` } })),
    label ? h('div', { class: 'meter-label' },
      h('strong', null, fmtHours(used)), ` planned of ${fmtHours(capacity)}`,
      h('span', { class: over ? 'danger' : 'muted' }, over ? ` · ${fmtHours(used - capacity)} over` : ` · ${fmtHours(capacity - used)} free`)) : null);
}

function emptyState(title, body, ...actions) {
  return h('div', { class: 'empty' }, h('h3', null, title), body ? h('p', null, body) : null, actions.length ? h('div', { class: 'empty-actions' }, actions) : null);
}

function btn(label, onclick, { kind = '', iconName = '', title = '', disabled = false, attrs = {} } = {}) {
  return h('button', { class: ['btn', kind], onclick, title: title || null, disabled: disabled || null, ...attrs }, iconName ? icon(iconName, 16) : null, label ? h('span', null, label) : null);
}

function iconBtn(name, label, onclick, attrs = {}) {
  return h('button', { class: 'icon-btn', 'aria-label': label, title: label, onclick, ...attrs }, icon(name, 18));
}
