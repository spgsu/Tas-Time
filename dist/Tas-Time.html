<p>The science fair laid out this way: the seeds need a full week to grow, so planting on 7 November is the date everything else depends on. The last two days are a deliberate buffer.</p>
<h3 id="g-freeze-a-baseline">Freeze a baseline</h3>
<p>When the plan looks right, click <strong>Set baseline</strong> at the top of the Plan. Tas-Time takes a snapshot of every date. From now on, each bar shows a thin grey line where it was <em>originally</em> planned, and a label like <strong>+3d</strong> when it has slipped three days.</p>
<p>The baseline is not a punishment. It is a mirror: it shows how good your estimates were, so your next plan is better. Only reset it if the whole plan changes, for example when the teacher moves the deadline.</p>
<h2 id="g-step-5-plan-your-week-every-sunday-15-minutes">Step 5 — Plan your week (every Sunday, 15 minutes)</h2>
<p>The Plan shows <em>when</em> things should happen. The Week view answers a different question: <em>does this week actually have room for them?</em> Most plans fail here, because people plan as if they had unlimited time.</p>
<h3 id="g-count-your-real-hours">Count your real hours</h3>
<p>Look at your week and find the blocks of time you could realistically give to planned work, after school, homework, practice, your job, meals, family and rest. Be honest; rest is not optional.</p>
<div class="table-wrap"><table><thead><tr><th>Day</th><th>Fixed stuff</th><th>Free for the project</th></tr></thead><tbody><tr><td>Mon</td><td>School, homework</td><td>45m</td></tr><tr><td>Tue</td><td>School, practice until 6:30</td><td>0</td></tr><tr><td>Wed</td><td>School, homework</td><td>1h</td></tr><tr><td>Thu</td><td>School, practice until 6:30</td><td>0</td></tr><tr><td>Fri</td><td>School, evening with friends</td><td>0</td></tr><tr><td>Sat</td><td>Job 9:00–14:00</td><td>1h</td></tr><tr><td>Sun</td><td>Family lunch</td><td>1h 30m</td></tr><tr><td><strong>Total</strong></td><td></td><td><strong>4h 15m</strong></td></tr></tbody></table></div>
<p>Now plan only about <strong>three quarters</strong> of that, because something always comes up: <strong>about 3 hours</strong>. That number is your <strong>capacity</strong>.</p>
<h3 id="g-fill-the-week-in-tas-time">Fill the week in Tas-Time</h3>
<ol><li>Open <strong>Week</strong>. Type your capacity in <strong>Available</strong>, e.g. <code>3h</code>.</li><li>Under the days, the <strong>Unplanned</strong> list shows open tasks that have no day yet, most urgent first.</li><li><strong>Drag</strong> a task onto the day you will do it, or click its <strong>⋯</strong> and pick a day. Match tasks to your free blocks: a 1-hour task goes on Wednesday, not Tuesday.</li><li>Watch the bar at the top. It shows hours planned against hours available. If it turns <strong>red</strong>, you have planned more than you have. Move something to next week now, not on Thursday night.</li><li>In the box under the bar, write one sentence of <strong>intent</strong>: <em>“This week: question approved and materials bought. The reading can wait.”</em></li></ol>
<p>Putting a task on a day never changes its dates on the Plan. The Plan is the forecast; the Week is your promise to yourself.</p>
<p><strong>Test weeks and busy weeks:</strong> lower your capacity, even to zero. A plan that admits a busy week is still a good plan. A plan that ignores it just fails quietly.</p>
<h2 id="g-step-6-run-your-day-2-minutes-to-start-2-minutes-to-stop">Step 6 — Run your day (2 minutes to start, 2 minutes to stop)</h2>
<p>On a planned day, open Tas-Time. It opens on <strong>Today</strong>.</p>
<h3 id="g-starting-a-session">Starting a session</h3>
<ol><li>Read <strong>Planned for today</strong>. That is your whole job for this session; ignore everything else.</li><li>Read <strong>Resume where you left off</strong> on the right. It is the note you wrote last time.</li><li>Click a task to start. If you like, set its status to <strong>Doing</strong> in the panel, so the Board shows what you are on.</li><li>Work in one block. Phone in another room. A 25-minute timer with a 5-minute break works for most people.</li></ol>
<h3 id="g-finishing-a-session">Finishing a session</h3>
<ol><li><strong>Tick the circle</strong> next to each finished task. A task that still needs work stays open: update its <strong>Effort left</strong> (e.g. from <code>2h</code> to <code>45m</code>).</li><li><strong>Write the resume note.</strong> This is the single most useful habit in this guide. Three short lines:<ul><li>Where I stopped: <em>“Method section half written, stopped at the watering schedule.”</em></li><li>What is unclear: <em>“How much salt per cup? Ask Ms Diaz.”</em></li><li>Next action: <em>“Finish the watering schedule paragraph.”</em></li></ul></li><li>Close the app. It has already saved.</li></ol>
<p>Next time you will start in seconds instead of spending 20 minutes remembering where you were.</p>
<h3 id="g-what-the-other-lists-on-today-mean">What the other lists on Today mean</h3>
<ul><li><strong>Carried over:</strong> tasks you planned for an earlier day but did not finish. Click <strong>Today</strong> on one to move it here, or <strong>Move all to today</strong>. Do not just ignore them; decide.</li><li><strong>Past forecast finish:</strong> tasks whose expected finish has passed. Either finish them now, or re-plan their dates honestly (Step 7).</li><li><strong>Milestones ahead:</strong> checkpoints coming in the next four weeks, so they never surprise you.</li></ul>
<p><strong>Adding something new during the day?</strong> Press <strong>N</strong>, type it, press Enter. Add <code>@today</code> to put it on today’s list. Capturing it takes 5 seconds and clears your head.</p>
<h2 id="g-step-7-when-things-go-wrong">Step 7 — When things go wrong</h2>
<p>Something will go wrong. That is not failure; it is what the plan is for. A plan lets you see the problem early, while you still have choices.</p>
<h3 id="g-blocked-or-just-waiting">Blocked or just waiting?</h3>
<p>Tas-Time separates two situations that feel the same but are not:</p>
<ul><li><strong>Waiting:</strong> a task’s prerequisite is not finished yet, but the task is not due to start anyway. <em>Make the graph</em> waiting for <em>Measure daily</em> in week 2 is normal. It shows quietly as <strong>After “Measure daily…”</strong>.</li><li><strong>Blocked:</strong> the task <em>should</em> be moving and cannot. Either it has a written constraint (<em>“Printer broken”</em>), or its start date has arrived and a prerequisite is still open. It goes into the <strong>Blocked</strong> column on the Board.</li></ul>
<p>Check the <strong>Board</strong> once a week. Every card in Blocked needs an action from you: chase someone, find a workaround, or re-plan.</p>
<h3 id="g-you-are-behind-now-what">You are behind. Now what?</h3>
<p><em>Example: in week 3 the seeds go mouldy. You must replant, which pushes measuring back 5 days.</em></p>
<p>Work through these options in order. The first ones cost the least.</p>
<ol><li><strong>Use your buffer.</strong> This is why you planned to finish 2 to 3 days early.</li><li><strong>Re-forecast honestly.</strong> On the Plan, drag the affected bars to their new dates. The prerequisite lines show what else has to move. The baseline shows <strong>+5d</strong> so you remember why.</li><li><strong>Find more time this week.</strong> Raise your capacity a little, for one week only. Not every week.</li><li><strong>Cut scope.</strong> Go back to your <em>good enough</em> line from Step 1. Could you measure for 5 days instead of 7? Skip the spoken practice? Write down what you cut in the job’s <strong>Decisions</strong> notes.</li><li><strong>Ask for help.</strong> A teacher, a parent, a friend. Asking early is a skill, not a weakness.</li><li><strong>Ask to move the deadline.</strong> Last, and only with a plan in hand: <em>“My seeds failed on 10 Nov; with a 3-day extension I can still test all three water types.”</em></li></ol>
<h3 id="g-what-never-helps">What never helps</h3>
<ul><li>Ignoring red items and hoping.</li><li>Planning a 9-hour week to catch up. You will not do it, and the plan will stop meaning anything.</li><li>Deleting the plan and starting from memory.</li></ul>
<h2 id="g-step-8-the-weekly-review-sunday-15-minutes">Step 8 — The weekly review (Sunday, 15 minutes)</h2>
<p>The weekly review is the habit that keeps a plan alive. Without it, a plan is accurate for about one week and then quietly becomes fiction.</p>

<p>The Plan feeds the Week, the Week feeds each day, and the review feeds what you learned back into the Plan. Skip the review and the loop breaks.</p>
<p>Do it at the same time every week, for example Sunday after dinner. Go through this list in order:</p>
<ul class="tasks"><li><span class="task-box" aria-hidden="true"></span><strong>Empty your head.</strong> Press <strong>N</strong> and add anything new you have been carrying around: homework, promises, ideas.</li><li><span class="task-box" aria-hidden="true"></span><strong>Look back at last week</strong> in the <strong>Week</strong> view (use ←). What got done? What did not, and why? One honest sentence in the week’s intent box is enough.</li><li><span class="task-box" aria-hidden="true"></span><strong>Clear the Board.</strong> Every card in <strong>Blocked</strong>: decide the next action. Every card in <strong>Doing</strong> that you have not touched for a week: is it really in progress?</li><li><span class="task-box" aria-hidden="true"></span><strong>Check the Plan.</strong> Any red bars (late)? Any red dashed lines (impossible order)? Drag them to honest new dates.</li><li><span class="task-box" aria-hidden="true"></span><strong>Update effort left</strong> on anything half done.</li><li><span class="task-box" aria-hidden="true"></span><strong>Set next week’s capacity.</strong> Look at the calendar: tests, trips, birthdays. Type the real number.</li><li><span class="task-box" aria-hidden="true"></span><strong>Fill next week.</strong> Drag tasks from <strong>Unplanned</strong> onto days until the bar is about full, not more.</li><li><span class="task-box" aria-hidden="true"></span><strong>Write next week’s intent</strong> in one sentence.</li><li><span class="task-box" aria-hidden="true"></span><strong>Back up:</strong> ⋯ → Save as… with the date in the file name.</li></ul>
<p>The first few reviews take 30 minutes. After a month they take 10.</p>
<h2 id="g-step-9-finishing-well">Step 9 — Finishing well</h2>
<p>A job is not finished when the last task is ticked. It is finished when you have closed it properly and kept what you learned. This takes 20 minutes and makes every future plan better.</p>
<h3 id="g-close-the-job">Close the job</h3>
<ol><li><strong>Tick the final milestone,</strong> <em>◆ Project handed in</em>. Tas-Time records the date it was completed.</li><li><strong>Check for leftovers.</strong> On the <strong>Plan</strong>, make sure <em>Done</em> is ticked so finished work shows, and look for anything still open. Either finish it, or delete it if it no longer matters.</li><li><strong>Mark the job Complete.</strong> Click the job name, and under <strong>Status</strong> choose <strong>Complete</strong>.</li></ol>
<p>On hold and Complete pause the job's tasks in Today and Week. Plan, Board and Notes keep them accessible. Completing with unfinished tasks asks for confirmation; those tasks are kept. Set the job back to Active to resume daily planning. Use <strong>Edit job</strong> in the filter banner, or click the job title in Plan. On phones, the <strong>⋯</strong> menu includes job selection, New job, help and appearance.</p>
<ol><li><strong>Archive it.</strong> In the job panel, click the archive icon. The job disappears from your daily views but nothing is lost: on the Plan, tick <strong>Archived</strong> to see it again, and restore it from its panel at any time.</li></ol>
<h3 id="g-hold-a-short-retrospective">Hold a short retrospective</h3>
<p>Open <strong>Notes</strong>, choose the job and the <strong>Lessons learned</strong> page. Answer four questions in a few lines each:</p>
<ul><li><strong>What went well?</strong> <em>“Planting in week 3 left time to replant when the seeds went mouldy.”</em></li><li><strong>What went badly?</strong> <em>“The report took 5 hours, not 3.”</em></li><li><strong>What surprised me?</strong> <em>“Printing was booked out four days ahead.”</em></li><li><strong>What will I do differently next time?</strong> <em>“Double my estimate for anything involving writing.”</em></li></ul>
<p>When you start your next job, its <strong>Lessons learned</strong> page shows these answers under <em>Lessons from earlier jobs</em>, so you plan with them in front of you.</p>
<h3 id="g-learn-from-your-own-numbers">Learn from your own numbers</h3>
<p>Before archiving, look at the Plan with the baseline. The <strong>+Nd</strong> labels tell you which kinds of tasks you underestimate. Most beginners find that <strong>writing</strong> and <strong>anything that depends on other people</strong> take about twice as long as planned. Use your real numbers to estimate the next job.</p>
<h3 id="g-celebrate">Celebrate</h3>
<p>Seriously. You took a six-week goal from nothing to finished, on purpose. That is the skill. The next goal will be easier, and the one after that easier still.</p>
<h2 id="g-keeping-it-going">Keeping it going</h2>
<p>Once one job works, use the same book for everything with a deadline: coursework, exam revision, a driving test, a club event. Three or four jobs at once is plenty. Each one gets its own colour, and the Week view adds up effort across all of them, so you see when the week is too full.</p>
<h3 id="g-put-plans-in-your-calendar-optional">Put plans in your calendar (optional)</h3>
<p>⋯ → <strong>Export to calendar (.ics)…</strong> saves your planned work days and milestones as a calendar file. Import it into Google Calendar or Outlook, into a separate calendar called <em>Tas-Time</em>. It is one-way: when plans change, delete that calendar and import a fresh export. The dialog’s <em>How to import</em> section has the exact steps.</p>
<h3 id="g-common-beginner-mistakes">Common beginner mistakes</h3>
<div class="table-wrap"><table><thead><tr><th>Mistake</th><th>Fix</th></tr></thead><tbody><tr><td>Tasks like “Work on project”</td><td>Start with a verb, under 2 hours, first action obvious (Step 2, Tool 3).</td></tr><tr><td>Planning every free minute</td><td>Plan three quarters of your real capacity (Step 5).</td></tr><tr><td>Skipping the weekly review</td><td>Same time every week, 15 minutes, checklist in Step 8.</td></tr><tr><td>No resume note</td><td>Two minutes at the end of every session (Step 6).</td></tr><tr><td>Hiding from red items</td><td>Red is information. Re-forecast or cut scope (Step 7).</td></tr><tr><td>Long waits planned late</td><td>Put anything that needs calendar time (growing, posting, other people) first (Step 4).</td></tr><tr><td>One giant to-do list</td><td>Split goals into jobs and phases; plan the week from them.</td></tr></tbody></table></div>
<h3 id="g-cheat-sheet">Cheat sheet</h3>
<div class="table-wrap"><table><thead><tr><th>Do this</th><th>Press or click</th></tr></thead><tbody><tr><td>Add a task from anywhere</td><td><strong>N</strong>, type, <strong>Enter</strong></td></tr><tr><td>Switch views</td><td><strong>1</strong> Today · <strong>2</strong> Week · <strong>3</strong> Plan · <strong>4</strong> Board · <strong>5</strong> Notes</td></tr><tr><td>Save / Save as</td><td><strong>Ctrl+S</strong> / <strong>Ctrl+Shift+S</strong> (Mac: ⌘S / ⇧⌘S)</td></tr><tr><td>Undo a mistake</td><td><strong>Ctrl+Z</strong> (Mac: ⌘Z), outside a text box</td></tr><tr><td>Close a panel</td><td><strong>Esc</strong></td></tr><tr><td>Previous / next week</td><td><strong>[</strong> and <strong>]</strong> on the Week view</td></tr><tr><td>Move a selected bar on the Plan</td><td><strong>← →</strong>; <strong>Shift + ← →</strong> changes its finish</td></tr><tr><td>See every shortcut</td><td><strong>?</strong></td></tr></tbody></table></div>
<h3 id="g-the-whole-method-on-one-line">The whole method on one line</h3>
<p><strong>Goal → outcome → break it down → put it in the app → schedule and baseline → plan the week → work the day → review weekly → finish and learn.</strong> Then pick the next goal.</p>

<script>
(() => {
'use strict';
// ── core/dates.js ──
// Calendar-day arithmetic on ISO dates (YYYY-MM-DD). All math is done in UTC
// day numbers so daylight-saving changes never shift a date.

const DAY_MS = 86400000;
const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;
const WEEKDAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const FULL_WEEKDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function isIsoDate(value) {
  if (typeof value !== 'string' || !ISO_RE.test(value)) return false;
  const [y, m, d] = value.split('-').map(Number);
  if (y < 1900 || y > 2200) return false;
  return new Date(Date.UTC(y, m - 1, d)).toISOString().slice(0, 10) === value;
}

function todayIso(now = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}`;
}

function dayNum(iso) {
  if (!isIsoDate(iso)) throw new Error(`Not a valid date: ${iso}`);
  const [y, m, d] = iso.split('-').map(Number);
  return Date.UTC(y, m - 1, d) / DAY_MS;
}

function fromDayNum(n) { return new Date(n * DAY_MS).toISOString().slice(0, 10); }
function addDays(iso, n) { return fromDayNum(dayNum(iso) + n); }
function diffDays(a, b) { return dayNum(b) - dayNum(a); }
function weekday(iso) { return new Date(dayNum(iso) * DAY_MS).getUTCDay(); }
function mondayOf(iso) { return addDays(iso, -((weekday(iso) + 6) % 7)); }

function weekDays(monday) { return Array.from({ length: 7 }, (_, i) => addDays(monday, i)); }

/** "Mon 20 Oct" — or "Mon 20 Oct 2027" outside the current year. */
function fmtDate(iso, today = todayIso()) {
  if (!iso) return '';
  const n = new Date(dayNum(iso) * DAY_MS);
  const base = `${DAY_NAMES[n.getUTCDay()]} ${n.getUTCDate()} ${MONTHS[n.getUTCMonth()]}`;
  return iso.slice(0, 4) === today.slice(0, 4) ? base : `${base} ${iso.slice(0, 4)}`;
}

/** "Saturday 17 October". */
function fmtLong(iso) {
  const n = new Date(dayNum(iso) * DAY_MS);
  const month = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][n.getUTCMonth()];
  return `${FULL_WEEKDAYS[n.getUTCDay()][0].toUpperCase()}${FULL_WEEKDAYS[n.getUTCDay()].slice(1)} ${n.getUTCDate()} ${month}`;
}

function fmtShort(iso) {
  if (!iso) return '';
  const n = new Date(dayNum(iso) * DAY_MS);
  return `${n.getUTCDate()} ${MONTHS[n.getUTCMonth()]}`;
}

/** Human distance from today: "today", "tomorrow", "in 3 days", "2 days ago". */
function relDay(iso, today = todayIso()) {
  const d = diffDays(today, iso);
  if (d === 0) return 'today';
  if (d === 1) return 'tomorrow';
  if (d === -1) return 'yesterday';
  return d > 0 ? `in ${d} days` : `${-d} days ago`;
}

/** Parses "today", "tomorrow", weekday names (next occurrence, today included) and ISO dates. */
function parseDayWord(word, today = todayIso()) {
  const w = word.toLowerCase();
  if (w === 'today' || w === 'tod') return today;
  if (w === 'tomorrow' || w === 'tmr' || w === 'tom') return addDays(today, 1);
  const idx = WEEKDAYS.findIndex(d => w === d || w === FULL_WEEKDAYS[WEEKDAYS.indexOf(d)]);
  if (idx >= 0) return addDays(today, (idx - weekday(today) + 7) % 7);
  if (isIsoDate(word)) return word;
  return null;
}

const MONTH_NAMES = MONTHS;

// ── core/model.js ──
// Planning-book schema: factories, validation and migration from older files.

const FORMAT = 'tas-time-planning-book';
const VERSION = 4;
const MAX_FILE_BYTES = 15_000_000;

const STATUS = { todo: 'To do', doing: 'Doing', done: 'Done' };
const JOB_STATUS = { active: 'Active', hold: 'On hold', done: 'Complete' };
const NOTE_PAGES = [
  ['restart', 'Resume here'],
  ['scope', 'Scope & outcome'],
  ['decisions', 'Decisions'],
  ['working', 'Working notes'],
  ['references', 'References'],
  ['lessons', 'Lessons learned'],
];
const COLORS = {
  forest: { label: 'Forest', hex: '#2f6b4f' },
  blue: { label: 'Blue', hex: '#2f62a3' },
  plum: { label: 'Plum', hex: '#7d4f8a' },
  amber: { label: 'Amber', hex: '#a66a12' },
  teal: { label: 'Teal', hex: '#1f7a80' },
  rose: { label: 'Rose', hex: '#a8455f' },
  slate: { label: 'Slate', hex: '#56657a' },
  olive: { label: 'Olive', hex: '#6b7a2a' },
};
const DEFAULT_CAPACITY = 10 * 60;

function uid() {
  return globalThis.crypto?.randomUUID?.() || `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
}

function newBook(name = 'My planning book') {
  const self = { id: uid(), name: 'Me', capacity: DEFAULT_CAPACITY };
  return { format: FORMAT, version: VERSION, id: uid(), name, people: [self], selfId: self.id, jobs: [], phases: [], items: [], weeks: {}, baselineDate: '' };
}

function newJob(fields = {}) {
  return {
    id: uid(), title: '', code: '', outcome: '', color: 'forest', status: 'active', archived: false,
    notes: Object.fromEntries(NOTE_PAGES.map(([k]) => [k, ''])), ...fields,
  };
}

function newPhase(jobId, title, order) { return { id: uid(), jobId, title, order }; }

function newItem(fields = {}) {
  return {
    id: uid(), jobId: '', phaseId: '', title: '', kind: 'task', status: 'todo',
    start: '', finish: '', effort: 0, plannedDay: '', assigneeId: '', owner: '', blocker: '', deps: [],
    baseline: null, doneOn: '', notes: '', archived: false, ...fields,
  };
}

/** Picks the first unused colour so new jobs are distinguishable by default. */
function nextColor(book) {
  const used = new Set(book.jobs.filter(j => !j.archived).map(j => j.color));
  return Object.keys(COLORS).find(c => !used.has(c)) || 'forest';
}

function fail(message) { throw new Error(message); }
function text(v, label, max = 100000) { if (typeof v !== 'string' || v.length > max) fail(`${label} must be text (max ${max.toLocaleString()} characters).`); }
function date(v, label) { if (v !== '' && !isIsoDate(v)) fail(`${label} must be a real date.`); }
function whole(v, label, max) { if (!Number.isInteger(v) || v < 0 || v > max) fail(`${label} must be a whole number from 0 to ${max.toLocaleString()}.`); }

/** Throws a readable error for the first problem found; returns the book otherwise. */
function validate(book) {
  if (!book || book.format !== FORMAT) fail('This file is not a Tas-Time planning book.');
  if (book.version !== VERSION) fail(`Unsupported planning-book version ${book.version}.`);
  text(book.name, 'Book name', 200);
  if (!Array.isArray(book.people) || !book.people.length || book.people.length > 2000) fail('The people list is invalid.');
  const people = new Map(); const names = new Set();
  for (const p of book.people) {
    if (!p || typeof p !== 'object') fail('A person is malformed.');
    text(p.id, 'Person identifier', 200); text(p.name, 'Person name', 200);
    const name = p.name.trim().toLowerCase();
    if (!p.id || people.has(p.id) || !name || names.has(name)) fail('People need unique identifiers and names.');
    whole(p.capacity, 'Default weekly capacity', 7 * 24 * 60);
    people.set(p.id, p); names.add(name);
  }
  if (!people.has(book.selfId)) fail('Choose a person for My work.');
  for (const k of ['jobs', 'phases', 'items']) if (!Array.isArray(book[k]) || book[k].length > 20000) fail(`The ${k} list is invalid.`);
  const ids = new Set();
  for (const row of [...book.jobs, ...book.phases, ...book.items]) {
    if (!row || typeof row !== 'object') fail('A record is malformed.');
    text(row.id, 'Identifier', 200);
    if (!row.id || ids.has(row.id)) fail('Record identifiers must be unique.');
    ids.add(row.id);
    text(row.title, 'Title', 500);
  }
  const jobs = new Map(book.jobs.map(j => [j.id, j]));
  const phases = new Map(book.phases.map(p => [p.id, p]));
  const items = new Map(book.items.map(t => [t.id, t]));
  for (const j of book.jobs) {
    text(j.code, 'Job code', 40); text(j.outcome, 'Outcome');
    if (!JOB_STATUS[j.status]) fail('Invalid job status.');
    if (!COLORS[j.color]) fail('Invalid job colour.');
    if (typeof j.archived !== 'boolean') fail('Invalid job archive flag.');
    if (!j.notes || typeof j.notes !== 'object') fail('Invalid job notebook.');
    for (const [k] of NOTE_PAGES) text(j.notes[k], 'Notebook page');
  }
  for (const p of book.phases) {
    if (!jobs.has(p.jobId)) fail('A phase belongs to a missing job.');
    whole(p.order, 'Phase order', 1e6);
  }
  for (const t of book.items) {
    if (!jobs.has(t.jobId)) fail(`"${t.title}" belongs to a missing job.`);
    if (typeof t.assigneeId !== 'string' || (t.assigneeId && !people.has(t.assigneeId))) fail(`"${t.title}" has a missing assignee.`);
    if (t.phaseId && phases.get(t.phaseId)?.jobId !== t.jobId) fail(`"${t.title}" refers to a phase from another job.`);
    if (!['task', 'milestone'].includes(t.kind)) fail('Invalid item kind.');
    if (!STATUS[t.status]) fail('Invalid item status.');
    if (typeof t.archived !== 'boolean') fail('Invalid item archive flag.');
    for (const k of ['owner', 'blocker', 'notes']) text(t[k], k);
    date(t.start, 'Start'); date(t.finish, 'Finish'); date(t.plannedDay, 'Planned day'); date(t.doneOn, 'Done date');
    if (t.start && t.finish && t.finish < t.start) fail(`"${t.title}" finishes before it starts.`);
    if (t.kind === 'milestone' && t.start !== t.finish) fail(`Milestone "${t.title}" needs a single date.`);
    whole(t.effort, 'Effort (minutes)', 1e6);
    if (t.baseline !== null) {
      if (typeof t.baseline !== 'object') fail('Invalid baseline.');
      date(t.baseline.start, 'Baseline start'); date(t.baseline.finish, 'Baseline finish');
    }
    if (!Array.isArray(t.deps) || new Set(t.deps).size !== t.deps.length) fail('Invalid dependency list.');
    for (const d of t.deps) if (!items.has(d) || d === t.id) fail(`"${t.title}" depends on a missing item.`);
  }
  if (findCycle(book.items)) fail('These dependencies form a loop. Remove one of the links.');
  if (!book.weeks || typeof book.weeks !== 'object' || Array.isArray(book.weeks)) fail('Invalid weekly plans.');
  for (const [key, w] of Object.entries(book.weeks)) {
    if (!isIsoDate(key) || mondayOf(key) !== key) fail('Weekly plans must start on a Monday.');
    whole(w.capacity, 'Weekly capacity', 7 * 24 * 60); text(w.notes, 'Week notes');
    if (w.people !== undefined) {
      if (!w.people || typeof w.people !== 'object' || Array.isArray(w.people)) fail('Invalid weekly person capacities.');
      for (const [id, minutes] of Object.entries(w.people)) {
        if (!people.has(id)) fail('A weekly capacity refers to a missing person.');
        whole(minutes, 'Person weekly capacity', 7 * 24 * 60);
      }
    }
  }
  date(book.baselineDate, 'Baseline date');
  return book;
}

/** Iterative topological check (Kahn) so large imports cannot overflow the stack. */
function findCycle(items) {
  const incoming = new Map(items.map(t => [t.id, t.deps.length]));
  const children = new Map(items.map(t => [t.id, []]));
  for (const t of items) for (const d of t.deps) children.get(d)?.push(t.id);
  const queue = items.filter(t => !t.deps.length).map(t => t.id);
  let seen = 0;
  while (queue.length) {
    const id = queue.pop(); seen++;
    for (const c of children.get(id)) { incoming.set(c, incoming.get(c) - 1); if (!incoming.get(c)) queue.push(c); }
  }
  return seen !== items.length;
}

/** Notebook pages added after a book was saved start empty instead of failing validation. */
function addMissingNotePages(book) {
  for (const j of Array.isArray(book.jobs) ? book.jobs : []) {
    if (j && j.notes && typeof j.notes === 'object') for (const [k] of NOTE_PAGES) if (j.notes[k] === undefined) j.notes[k] = '';
  }
  return book;
}

const V2_STATUS = { 'Not started': 'todo', 'In progress': 'doing', Done: 'done' };
const V2_JOB_STATUS = { Active: 'active', 'On hold': 'hold', Complete: 'done' };

/** Upgrades version 1 and 2 books to the current schema without dropping data. */
function migrate(raw) {
  if (!raw || raw.format !== FORMAT) fail('This file is not a Tas-Time planning book.');
  if (raw.version === VERSION) return addMissingNotePages(raw);
  if (raw.version === 3) {
    const b = newBook();
    return addMissingNotePages({ ...raw, version: VERSION, people: b.people, selfId: b.selfId,
      weeks: Object.fromEntries(Object.entries(raw.weeks || {}).map(([day, week]) => [day, { ...week, people: { [b.selfId]: week.capacity } }])),
      items: raw.items.map(t => ({ ...t, assigneeId: b.selfId })) });
  }
  if (raw.version !== 1 && raw.version !== 2) fail(`Unsupported planning-book version ${raw.version}.`);
  const book = newBook(String(raw.name || 'Imported planning book'));
  book.baselineDate = raw.baselineDate || '';
  book.weeks = structuredClone(raw.weeks || {});
  for (const week of Object.values(book.weeks)) week.people = { [book.selfId]: week.capacity };
  for (const j of raw.jobs || []) {
    const notes = { ...newJob().notes, ...(j.notes || {}) };
    const color = COLORS[j.color] ? j.color : 'forest';
    book.jobs.push({ id: j.id, title: j.title, code: String(j.code || '').slice(0, 40), outcome: j.outcome || '', color,
      status: V2_JOB_STATUS[j.status] || 'active', archived: !!j.archived, notes });
  }
  book.phases = (raw.phases || []).map(p => ({ id: p.id, jobId: p.jobId, title: p.title, order: p.order }));
  for (const t of raw.items || []) {
    const hasBaseline = t.baselineStart || t.baselineFinish;
    book.items.push(newItem({
      id: t.id, jobId: t.jobId, phaseId: t.phaseId || '', title: t.title, kind: t.kind === 'Milestone' ? 'milestone' : 'task',
      assigneeId: book.selfId,
      status: V2_STATUS[t.status] || 'todo', start: t.start || '', finish: t.finish || '', effort: t.remaining || 0,
      plannedDay: t.plannedDay || '', owner: t.owner || '', blocker: t.blocker || '', deps: [...(t.predecessors || [])],
      baseline: hasBaseline ? { start: t.baselineStart || '', finish: t.baselineFinish || '' } : null,
      doneOn: t.acceptedOn || '', notes: t.notes || '', archived: !!t.archived,
    }));
  }
  return book;
}

/** Parses file text into a validated current-version book. */
function decodeBook(textValue) {
  if (textValue.length > MAX_FILE_BYTES) fail('This file is larger than the 15 MB limit.');
  let raw;
  try { raw = JSON.parse(textValue); } catch { fail('This file is not valid JSON.'); }
  const upgraded = raw?.version !== VERSION;
  return { book: validate(migrate(raw)), upgradedFrom: upgraded ? raw.version : null };
}

function encodeBook(book) { return JSON.stringify(validate(book), null, 2); }

// ── core/store.js ──
// Book state with undo/redo. Every change goes through commit(), which clones,
// applies the mutation, validates, and only then publishes the new book.

const HISTORY_LIMIT = 200;
const COALESCE_MS = 1500;

function createStore(initial) {
  let book = validate(initial);
  let past = [];
  let future = [];
  let revision = 0;
  let savedRevision = 0;
  let lastKey = '';
  let lastAt = 0;
  const listeners = new Set();

  const emit = reason => { for (const fn of listeners) fn(reason); };

  return {
    get book() { return book; },
    get revision() { return revision; },
    get dirty() { return revision !== savedRevision; },
    get canUndo() { return past.length > 0; },
    get canRedo() { return future.length > 0; },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },

    /**
     * Applies fn to a draft. Typing into one field produces one undo step:
     * commits with the same key within COALESCE_MS replace the last snapshot.
     * Returns fn's result. Throws (leaving state untouched) when the change is invalid.
     */
    commit(label, fn, { key = '', quiet = false } = {}) {
      const draft = structuredClone(book);
      const result = fn(draft);
      validate(draft);
      const now = Date.now();
      const coalesce = key && key === lastKey && now - lastAt < COALESCE_MS;
      if (!coalesce) {
        past.push({ book, label });
        if (past.length > HISTORY_LIMIT) past.shift();
      }
      future = [];
      lastKey = key; lastAt = now;
      book = draft; revision++;
      emit(quiet ? 'quiet' : 'change');
      return result;
    },

    undo() {
      const step = past.pop();
      if (!step) return '';
      future.push({ book, label: step.label });
      book = step.book; revision++; lastKey = '';
      emit('change');
      return step.label;
    },

    redo() {
      const step = future.pop();
      if (!step) return '';
      past.push({ book, label: step.label });
      book = step.book; revision++; lastKey = '';
      emit('change');
      return step.label;
    },

    /** Replaces the whole book (open, new, example). Clears history. */
    replace(next, { dirty = false } = {}) {
      book = validate(next); past = []; future = []; lastKey = '';
      revision++; savedRevision = dirty ? -1 : revision;
      emit('replace');
    },

    markSaved(atRevision) { savedRevision = atRevision; emit('saved'); },
  };
}

// ── ui/state.js ──
// Shared UI state. The book itself lives in the store; this is view state only.

const VIEWS = [
  { id: 'today', label: 'Today', key: '1', icon: 'today' },
  { id: 'week', label: 'Week', key: '2', icon: 'week' },
  { id: 'plan', label: 'Plan', key: '3', icon: 'plan' },
  { id: 'board', label: 'Board', key: '4', icon: 'board' },
  { id: 'notes', label: 'Notes', key: '5', icon: 'notes' },
  { id: 'assignments', label: 'Assignments', key: '6', icon: 'people' },
];

const store = createStore(newBook());

function defaultUi() { return {
  view: 'today',
  focus: '',            // job id the views are narrowed to
  week: mondayOf(todayIso()),
  drawer: null,         // { type: 'item' | 'job', id }
  notesJob: '',
  notesPage: 'restart',
  planRange: '6w',      // '6w' | '3m' | 'all'
  planShowDone: true,
  planShowArchived: false,
  boardAllDone: false,

/** Explicit units avoid confusing hours with minutes. Returns minutes or null. */
function parseEffort(input) {
  const s = String(input).trim().toLowerCase().replace(/\s+/g, '');
  if (s === '') return 0;
  let m = s.match(/^(\d+(?:\.\d+)?)h(?:(\d+)m?)?$/);
  if (m) return Math.round(Number(m[1]) * 60 + Number(m[2] || 0));
  m = s.match(/^(\d+)(?:m|min|mins)$/);
  if (m) return Number(m[1]);
  m = s.match(/^(\d+(?:\.\d+)?)d$/);
  if (m) return Math.round(Number(m[1]) * 8 * 60);
  return null;
}

/** 0 → "", 45 → "45m", 90 → "1h 30m", 120 → "2h". */
function fmtEffort(min) {
  if (!min) return '';
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
}

/** Hours with one decimal, for totals: 135 → "2.3h". */
function fmtHours(min) {
  const h = min / 60;
  return `${Number.isInteger(h) ? h : h.toFixed(1)}h`;

const EFFORT_TOKEN = /^\d+(?:\.\d+)?h(?:\d+m?)?$|^\d+(?:m|min|mins|d)$/i;

 * Quick add: "Draft literature review #phd 2h @tue !fri"
 *   #code   job (matches code or title start)   2h / 30m / 1h30   effort
 *   @day    plan to work on it that day          !day              forecast finish
 *   *       leading star marks a milestone
 */
function parseQuickAdd(input, jobs, today = todayIso()) {
  const tokens = input.trim().split(/\s+/).filter(Boolean);
  const out = { title: '', jobId: '', jobHint: '', effort: null, plannedDay: '', finish: '', kind: 'task', errors: [] };
  const words = [];
  for (const tok of tokens) {
    if (tok.length > 1 && tok[0] === '#') {
      out.jobHint = tok.slice(1);
      const job = matchJob(jobs, out.jobHint);
      if (job) out.jobId = job.id; else out.errors.push(`No unique job matches “${tok}”. Choose a job or use its full code`);
    } else if (tok.length > 1 && (tok[0] === '@' || tok[0] === '!')) {
      const day = parseDayWord(tok.slice(1), today);
      if (!day) { out.errors.push(`Unrecognised day “${tok}”`); continue; }
      if (tok[0] === '@') out.plannedDay = day; else out.finish = day;
    } else if (EFFORT_TOKEN.test(tok)) {
      out.effort = parseEffort(tok);

}

function matchJob(jobs, hint) {
  const h = hint.toLowerCase();
  const live = jobs.filter(j => !j.archived);
  const exact = live.filter(j => j.code.toLowerCase() === h || j.title.toLowerCase() === h);
  if (exact.length) return exact.length === 1 ? exact[0] : undefined;
  const matches = live.filter(j => j.code.toLowerCase().startsWith(h) || j.title.toLowerCase().split(/\s+/).some(w => w.startsWith(h)));
  return matches.length === 1 ? matches[0] : undefined;
}

    if (day > bestDay) { bestDay = day; best = t.jobId; }
  }
  return jobOf(book, best) || liveJobs(book).find(j => j.status === 'active' && j.notes.restart.trim()) || null;
}

function upcomingMilestones(book, today, days = 21, focus = '', personId = 'all') {
  const end = addDays(today, days);
  return activeItems(book)
    .filter(t => t.kind === 'milestone' && t.status !== 'done' && t.finish && t.finish <= end && matchesFocus(t, focus) && matchesPerson(t, personId))
    .sort(byUrgency);
}

function jobSummary(book, job, today) {
  const items = book.items.filter(t => t.jobId === job.id && !t.archived);
  const open = items.filter(t => t.status !== 'done');
  const phases = phasesOf(book, job.id);
  const current = phases.find(p => open.some(t => t.phaseId === p.id));
  const nextMilestone = open.filter(t => t.kind === 'milestone').sort(byUrgency)[0];
  const finish = items.map(t => t.finish).filter(Boolean).sort().at(-1) || '';
  return {
    total: items.length, done: items.length - open.length, open: open.length, effort: openEffort(items),
    late: open.filter(t => isLate(t, today)).length, blocked: open.filter(t => isBlocked(book, t, today)).length,
    currentPhase: current?.title || '', nextMilestone, finish,
  };
}

/** Rows for the Plan view: job headers, phase headers and items in programme order. */
function planRows(book, { focus = '', showDone = true, showArchived = false } = {}) {
  const rows = [];
  const jobs = book.jobs.filter(j => (showArchived || !j.archived) && (!focus || j.id === focus));
  for (const job of jobs) {
    rows.push({ type: 'job', job });
    const items = book.items.filter(t => t.jobId === job.id && (showArchived || !t.archived) && (showDone || t.status !== 'done'));
    const groups = [...phasesOf(book, job.id).map(p => [p, items.filter(t => t.phaseId === p.id)]), [null, items.filter(t => !t.phaseId)]];
    for (const [phase, list] of groups) {
      if (!phase && !list.length) continue;
      rows.push({ type: 'phase', phase, job });
      for (const item of [...list].sort(bySchedule)) rows.push({ type: 'item', item, job });
    }
  }
  return rows;
}

function bySchedule(a, b) {
  return (a.start || a.finish || '9999').localeCompare(b.start || b.finish || '9999') || (a.finish || '9999').localeCompare(b.finish || '9999') || a.title.localeCompare(b.title);
}

/** Every item that (transitively) depends on id, used to refuse dependency loops in pickers. */
function dependents(book, id) {
  const out = new Set();
  const stack = [id];
  while (stack.length) {
    const cur = stack.pop();
    for (const t of book.items) if (t.deps.includes(cur) && !out.has(t.id)) { out.add(t.id); stack.push(t.id); }
  }
  return out;
}

// ── core/ops.js ──
// Mutations. Each takes a draft book (already cloned by the store) and edits it in place.

function addJob(book, fields = {}, phaseTitles = []) {
  const job = newJob({ color: nextColor(book), ...fields });
  book.jobs.push(job);
  phaseTitles.forEach((title, order) => book.phases.push(newPhase(job.id, title, order)));
  return job;
}

function addItem(book, fields) {
  const item = newItem({ assigneeId: book.selfId, ...fields });
  if (item.kind === 'milestone') item.start = item.finish;
  book.items.push(item);
  return item;
}

function patchItem(book, id, patch, today) {
  const t = itemOf(book, id);
  if (!t) throw new Error('That item no longer exists.');
  const next = { ...t, ...patch };
  if (patch.jobId && patch.jobId !== t.jobId && !('phaseId' in patch)) next.phaseId = '';
  if (next.kind === 'milestone') {
    if (!('finish' in patch)) next.finish = next.finish || next.start;
    next.start = next.finish;
  }
  if ('start' in patch && next.kind === 'task' && next.start && next.finish && next.finish < next.start) {
    // Moving the start past the finish keeps the duration rather than failing.
    next.finish = t.start && t.finish ? addDays(next.start, diffDays(t.start, t.finish)) : next.start;
  }
  if ('status' in patch) applyStatus(book, next, t.status, today);
  Object.assign(t, next);
  return t;
}

function applyStatus(book, next, previous, today) {
  if (next.status === previous) return;
  if (next.status === 'done') {
    const reasons = blockers(book, { ...next, status: 'todo' });
    if (reasons.length) throw new Error(`Can’t complete yet: ${reasons.join('; ')}.`);
    next.doneOn = today;
  } else next.doneOn = '';
}

function setStatus(book, id, status, today) { return patchItem(book, id, { status }, today); }

/** Moves a bar on the programme, keeping its duration. */
function shiftItem(book, id, days) {
  const t = itemOf(book, id);
  if (!days) return;
  if (t.start) t.start = addDays(t.start, days);
  if (t.finish) t.finish = addDays(t.finish, days);
}

function deleteItem(book, id) {
  book.items = book.items.filter(t => t.id !== id);
  for (const t of book.items) t.deps = t.deps.filter(d => d !== id);
}

function duplicateItem(book, id) {
  const t = itemOf(book, id);
  const copy = { ...structuredClone(t), id: uid(), title: `${t.title} (copy)`, status: 'todo', doneOn: '', baseline: null };
  book.items.splice(book.items.indexOf(t) + 1, 0, copy);
  return copy;
}

function patchJob(book, id, patch) {
  const j = jobOf(book, id);
  if (!j) throw new Error('That job no longer exists.');
  Object.assign(j, patch);
  return j;
}

function setNote(book, jobId, page, value) { jobOf(book, jobId).notes[page] = value; }

function addPhase(book, jobId, title) {
  const order = phasesOf(book, jobId).reduce((n, p) => Math.max(n, p.order + 1), 0);
  const p = newPhase(jobId, title, order);
  book.phases.push(p);
  return p;
}

function renamePhase(book, id, title) { book.phases.find(p => p.id === id).title = title; }

function movePhase(book, id, delta) {
  const p = book.phases.find(x => x.id === id);
  const list = phasesOf(book, p.jobId);
  const i = list.indexOf(p);
  const j = i + delta;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  list.forEach((x, order) => { x.order = order; });
}

/** Removes a phase; its items stay in the job, unphased. */
function deletePhase(book, id) {
  for (const t of book.items) if (t.phaseId === id) t.phaseId = '';
  book.phases = book.phases.filter(p => p.id !== id);
}

/** Completely removes a job with its phases and items (undoable from the store). */
function deleteJob(book, id) {
  const gone = new Set(book.items.filter(t => t.jobId === id).map(t => t.id));
  book.items = book.items.filter(t => !gone.has(t.id));
  for (const t of book.items) t.deps = t.deps.filter(d => !gone.has(d));
  book.phases = book.phases.filter(p => p.jobId !== id);
  book.jobs = book.jobs.filter(j => j.id !== id);
}

function captureBaseline(book, today) {
  book.baselineDate = today;
  for (const t of book.items) if (!t.archived) t.baseline = t.start || t.finish ? { start: t.start, finish: t.finish } : null;
}

function setCapacity(book, monday, minutes, personId = book.selfId) {
  if (!book.people.some(p => p.id === personId)) throw new Error('Choose a person before setting capacity.');
  const week = { notes: '', capacity: book.people.find(p => p.id === book.selfId).capacity, ...book.weeks[monday] };
  week.people = { ...week.people, [personId]: minutes };
  if (personId === book.selfId) week.capacity = minutes;
  book.weeks[monday] = week;
}

function addPerson(book, name) {
  const person = { id: uid(), name: name.trim(), capacity: DEFAULT_CAPACITY };
  book.people.push(person);
  return person;
}

function patchPerson(book, id, patch) {
  const person = book.people.find(p => p.id === id);
  if (!person) throw new Error('That person no longer exists.');
  Object.assign(person, patch);
}

function setWeekNotes(book, monday, notes, defaultCapacity) {
  book.weeks[monday] = { capacity: defaultCapacity, ...book.weeks[monday], notes };
}

function addDep(book, id, depId) {
  const t = itemOf(book, id);
  if (!t.deps.includes(depId)) t.deps.push(depId);
}

function removeDep(book, id, depId) {
  const t = itemOf(book, id);
  t.deps = t.deps.filter(d => d !== depId);
}

// ── ui/components.js ──
// Small building blocks shared by several views.

function jobColor(job) { return COLORS[job?.color]?.hex || COLORS.forest.hex; }

function jobTag(job, { full = false } = {}) {
  if (!job) return null;
  return h('span', { class: 'job-tag', style: { '--job': jobColor(job) }, title: job.title },
    h('span', { class: 'dot' }), full || !job.code ? job.title : job.code);
}

function chip(text, kind = '', title = '') { return h('span', { class: ['chip', kind], title: title || null }, text); }

/** Forecast-finish chip that turns red once late and amber within two days. */
function dueChip(t) {
  if (!t.finish || t.status === 'done') return null;
  const late = isLate(t, today());
  const soon = !late && t.finish <= addDays(today(), 2);
  const label = t.kind === 'milestone' ? `◆ ${fmtDate(t.finish)}` : `Forecast finish ${relDay(t.finish)}`;
  return chip(label, late ? 'danger' : soon ? 'warn' : '', fmtDate(t.finish));
}

/** "Blocked: reason" when stuck now; a quiet "After X" when merely waiting on a prerequisite. */
function readiness(t) {
  const book = store.book;
  if (t.status === 'done') return null;
  if (isBlocked(book, t, today())) {
    const reasons = blockers(book, t);
    return chip(`Blocked · ${reasons[0]}`, 'warn', reasons.join('\n'));
  }
  const waiting = waitingOn(book, t);
  return waiting.length ? chip(`After “${waiting[0].title}”${waiting.length > 1 ? ` +${waiting.length - 1}` : ''}`, 'muted', waiting.map(w => w.title).join('\n')) : null;
}

/** Round completion checkbox. Disabled with an explanation while blocked. */
function doneToggle(t) {
  const book = store.book;
  const reasons = t.status === 'done' ? [] : blockers(book, t);
  const done = t.status === 'done';
  return h('button', {
    class: ['tick', done && 'on', t.kind === 'milestone' && 'tick-ms'],
    'aria-pressed': String(done),
    'aria-label': `${done ? 'Mark not done' : 'Mark done'}: ${t.title}`,
    title: reasons.length ? `Blocked: ${reasons.join('; ')}` : done ? 'Mark as not done' : 'Mark done',
    disabled: reasons.length ? true : null,
    onclick: event => {
      event.stopPropagation();
      act(done ? 'Reopen' : 'Complete', d => setStatus(d, t.id, done ? 'todo' : 'done', today()));
    },
  }, icon('check', 14));
}

/** A list row for an item: toggle, title, metadata, optional trailing actions. */
function itemRow(t, { actions = null, showJob = true, showPhase = false, dense = false } = {}) {
  const book = store.book;
  const job = jobOf(book, t.jobId);
  const phase = showPhase ? phaseTitle(book, t.phaseId) : '';
  return h('div', { class: ['row-item', t.status === 'done' && 'is-done', dense && 'dense'], 'data-item': t.id, style: { '--job': jobColor(job) } },
    doneToggle(t),
    h('div', { class: 'row-main' },
      h('button', { class: 'row-title', onclick: () => openDrawer('item', t.id) }, t.title),
      h('div', { class: 'row-meta' },
        showJob ? jobTag(job) : null,
        chip(personName(book, t.assigneeId), 'muted', 'Assignee'),
        phase ? h('span', { class: 'muted' }, phase) : null,
        t.status === 'doing' ? chip('Doing', 'accent') : null,
        dueChip(t),
        readiness(t),
        t.effort && t.status !== 'done' ? h('span', { class: 'effort' }, fmtEffort(t.effort)) : null,
      )),
    actions ? h('div', { class: 'row-actions' }, actions) : null);
}

function segmented(options, value, onChange, label) {
  return h('div', { class: 'segmented', role: 'radiogroup', 'aria-label': label },
    options.map(([key, text]) => h('button', {
      role: 'radio', 'aria-checked': String(key === value), class: key === value ? 'on' : null,
      onclick: () => onChange(key),
    }, text)));
}

/** Planned vs capacity bar. */
function meter(used, capacity, { label = true } = {}) {
  const pct = capacity ? Math.min(100, (used / capacity) * 100) : used ? 100 : 0;
  const over = used > capacity;
  return h('div', { class: ['meter', over && 'over'] },
    h('div', { class: 'meter-track' }, h('span', { style: { width: `${pct}%` } })),
    label ? h('div', { class: 'meter-label' },
      h('strong', null, fmtHours(used)), ` planned of ${fmtHours(capacity)}`,
      h('span', { class: over ? 'danger' : 'muted' }, over ? ` · ${fmtHours(used - capacity)} over` : ` · ${fmtHours(capacity - used)} free`)) : null);
}

function emptyState(title, body, ...actions) {
  return h('div', { class: 'empty' }, h('h3', null, title), body ? h('p', null, body) : null, actions.length ? h('div', { class: 'empty-actions' }, actions) : null);
}

function btn(label, onclick, { kind = '', iconName = '', title = '', disabled = false, attrs = {} } = {}) {
  return h('button', { class: ['btn', kind], onclick, title: title || null, disabled: disabled || null, ...attrs }, iconName ? icon(iconName, 16) : null, label ? h('span', null, label) : null);
}

function iconBtn(name, label, onclick, attrs = {}) {
  return h('button', { class: 'icon-btn', 'aria-label': label, title: label, onclick, ...attrs }, icon(name, 18));
}

// ── ui/commands.js ──
// User commands shared by menus, buttons and keyboard shortcuts.

const STANDARD_PHASES = ['Scope', 'Plan', 'Execute', 'Review & accept'];

function createJob(title = '') {
  const job = act('New job', d => addJob(d, { title: title || 'Untitled job' }));
  if (job) { ui.focus = job.id; ui.quickJob = job.id; ui.quickPhase = ''; openDrawer('job', job.id, 'title'); }
  return job;
}

function undo() {
  const label = store.undo();
  if (label) notify(`Undid: ${label}`, { action: { label: 'Redo', run: redo } });
}

function redo() {
  const label = store.redo();
  if (label) notify(`Redid: ${label}`);
}

/** Creates an item from quick-add text. Falls back to the focused job, then the first job. */
function quickAdd(text, defaults = {}) {
  const book = store.book;
  const q = parseQuickAdd(text, book.jobs, today());
  // Refuse rather than guess: a mistyped #job or !date would otherwise land silently in the wrong place.
  if (q.errors.length) { notify(`Not added — ${q.errors.join('; ')}. Fix it and press Enter again.`, { kind: 'warn' }); return null; }
  if (!q.title) { notify('Type a title for the task.', { kind: 'warn' }); return null; }
  let jobId = q.jobId || defaults.jobId || ui.focus || liveJobs(book)[0]?.id;
  if (!jobId) jobId = act('New job', d => addJob(d, { title: 'Inbox', code: 'INBOX' }))?.id;
  const finish = q.finish || (q.kind === 'milestone' ? q.plannedDay || today() : '');
  const item = act('Add task', d => addItem(d, {
    jobId, phaseId: book.phases.some(p => p.id === defaults.phaseId && p.jobId === jobId) ? defaults.phaseId : '', title: q.title, kind: q.kind,
    effort: q.effort ?? 0, plannedDay: q.kind === 'milestone' ? '' : q.plannedDay || defaults.plannedDay || '', finish,
    start: defaults.start || '',
    assigneeId: defaults.assigneeId ?? book.selfId,
  }));
  if (item) {
    const job = jobOf(store.book, item.jobId);
    const phase = store.book.phases.find(p => p.id === item.phaseId);
    notify(`Added task “${item.title}” to ${job.title} / ${phase?.title || 'Tasks without a phase'}${item.plannedDay ? ` · Work on ${item.plannedDay}` : ' · No work day set'}`, { action: { label: 'Open', run: () => openDrawer('item', item.id) } });
  }
  return item;
}

/** Structured creation keeps destination and work day visible in the task editor. */
function createTask(jobId = ui.focus || ui.quickJob || liveJobs(store.book)[0]?.id, phaseId = '', plannedDay = '', assigneeId = store.book.selfId) {
  if (!jobId) jobId = createJob('Inbox')?.id;
  if (!jobId) return;
  const item = act('New task', d => addItem(d, { jobId, phaseId, plannedDay, assigneeId, title: 'Untitled task' }));
  if (item) openDrawer('item', item.id, 'title');
  return item;
}

function removeItem(id) {
  const t = itemOf(store.book, id);
  if (!t) return;
  act('Delete', d => deleteItem(d, id));
  if (itemOf(store.book, id)) return;
  if (ui.drawer?.id === id) ui.drawer = null;
  rerender();
  notify(`Deleted “${t.title}”`, { action: { label: 'Undo', run: undo } });
}

function removeJob(id) {
  const j = jobOf(store.book, id);
  const count = store.book.items.filter(t => t.jobId === id).length;
  if (!confirm(`Delete “${j.title}” and its ${count} item${count === 1 ? '' : 's'}? You can undo this until you close the app. Archive keeps it instead.`)) return;
  act('Delete job', d => deleteJob(d, id));
  if (ui.focus === id) ui.focus = '';
  ui.drawer = null;
  rerender();
  notify(`Deleted job “${j.title}”`, { action: { label: 'Undo', run: undo } });
}

// ── core/example.js ──
// Synthetic example book, dated relative to today so it always looks current.

function exampleBook(today) {
  const book = newBook('Example planning book');
  const d = n => addDays(today, n);
  const phd = addJob(book, { title: 'Methodology chapter', code: 'PHD', outcome: 'A justified method choice and a supervisor-reviewed draft.', color: 'forest' },
    ['Evidence review', 'Method selection', 'Draft & review']);
  const home = addJob(book, { title: 'Kitchen refit', code: 'HOME', outcome: 'Agreed scope, three comparable quotes, contractor booked.', color: 'blue' },
    ['Scope', 'Quotes', 'Works']);
  const [p1, p2, p3] = book.phases.filter(p => p.jobId === phd.id);
  const [h1, h2, h3] = book.phases.filter(p => p.jobId === home.id);
  phd.notes.restart = 'Comparing assumptions behind methods A and B.\nNext: write up the limitations table before drafting.';
  phd.notes.scope = 'Chapter 3 only. Out of scope: pilot study results.';
  phd.notes.decisions = `${d(-6)} — Dropped method C: needs data we cannot collect in time.`;
  home.notes.restart = 'Waiting on the second quote. Chase on Monday if nothing arrives.';

  const read = addItem(book, { jobId: phd.id, phaseId: p1.id, title: 'Read core method papers', start: d(-10), finish: d(-3), effort: 0, status: 'done', doneOn: d(-3) });
  const compare = addItem(book, { jobId: phd.id, phaseId: p1.id, title: 'Compare methods A and B', start: d(-2), finish: d(3), effort: 150, status: 'doing', plannedDay: today, deps: [read.id] });
  const justify = addItem(book, { jobId: phd.id, phaseId: p2.id, title: 'Write method justification', start: d(4), finish: d(11), effort: 240, deps: [compare.id] });
  const limits = addItem(book, { jobId: phd.id, phaseId: p2.id, title: 'Limitations table', start: d(4), finish: d(7), effort: 90, plannedDay: d(1), deps: [compare.id] });
  const draft = addItem(book, { jobId: phd.id, phaseId: p3.id, title: 'Full chapter draft', start: d(12), finish: d(24), effort: 600, deps: [justify.id, limits.id] });
  addItem(book, { jobId: phd.id, phaseId: p3.id, title: 'Supervisor accepts draft', kind: 'milestone', finish: d(31), deps: [draft.id], notes: 'Acceptance: supervisor confirms the method and its limitations are addressed.' });

  addItem(book, { jobId: home.id, phaseId: h1.id, title: 'Measure and photograph kitchen', start: d(-4), finish: d(-1), effort: 60, plannedDay: d(-1) });
  const brief = addItem(book, { jobId: home.id, phaseId: h1.id, title: 'Write scope brief', start: d(0), finish: d(2), effort: 45, plannedDay: today, deps: [] });
  const quotes = addItem(book, { jobId: home.id, phaseId: h2.id, title: 'Get three quotes', start: d(3), finish: d(17), effort: 120, deps: [brief.id], blocker: '' });
  addItem(book, { jobId: home.id, phaseId: h2.id, title: 'Second contractor site visit', start: d(5), finish: d(5), effort: 60, blocker: 'Contractor to confirm a date' });
  const choose = addItem(book, { jobId: home.id, phaseId: h2.id, title: 'Contractor chosen', kind: 'milestone', finish: d(20), deps: [quotes.id] });
  addItem(book, { jobId: home.id, phaseId: h3.id, title: 'Works on site', start: d(35), finish: d(48), effort: 120, deps: [choose.id] });

  captureBaseline(book, d(-7));
  // Show some slippage against the baseline.
  justify.baseline = { start: d(2), finish: d(9) };
  book.weeks[mondayOf(today)] = { capacity: 8 * 60, notes: 'Finish the comparison. Keep Friday evening free.' };
  return book;
}

// ── ui/files.js ──
// Saving and opening planning books.
//
// Three layers, strongest first:
//  1. A linked file (File System Access API, Edge/Chrome): explicit save, then autosave.
//  2. A recovery copy in this browser's local storage, restored on next launch.
//  3. Download fallback where neither is available (cannot confirm the write).

const RECOVERY_KEY = 'tas-time:recovery:v3';
const PREF_KEY = 'tas-time:prefs';
const IDB_NAME = 'tas-time';
const PICKER_TYPES = [{ description: 'Tas-Time planning book', accept: { 'application/json': ['.json'] } }];

const file = {
  handle: null,
  name: '',
  state: 'none',        // none | linked | saving | error | reconnect
  savedAt: null,
  lastError: '',
  restoredAt: null,     // set when unsaved work was restored on launch
};

const canLinkFiles = typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function';

function prefs() {
  try { return { recovery: true, ...JSON.parse(localStorage.getItem(PREF_KEY) || '{}') }; } catch { return { recovery: true }; }
}

function setPref(key, value) {
  try { localStorage.setItem(PREF_KEY, JSON.stringify({ ...prefs(), [key]: value })); } catch { /* storage unavailable */ }
  if (key === 'recovery' && !value) clearRecovery();
}

function suggestedName() {
  return `${store.book.name.replace(/[^a-z0-9-]+/gi, '-').replace(/^-|-$/g, '') || 'planning-book'}.json`;
}

let writing = Promise.resolve();

// Incremented whenever a different book replaces the open one. A save started in an
// earlier session writes only its own snapshot and never touches the current session's state.
let session = 0;
function beginSession() { session++; autosave.cancel(); }

/** What a save writes, fixed at the moment the save starts. */
function snapshot() { return { raw: encodeBook(store.book), rev: store.revision, session }; }

class StaleSave extends Error {
  constructor() { super('A different book was opened before this save finished. Nothing was written.'); this.name = 'StaleSave'; }
}

/** Saves to the linked file, asking for a location the first time (or always with saveAs). */
async function save({ saveAs = false } = {}) {
  if (!canLinkFiles) return download();
  const snap = snapshot();
  try {
    let handle = !saveAs && file.handle;
    if (!handle) handle = await window.showSaveFilePicker({ suggestedName: file.name || suggestedName(), types: PICKER_TYPES });
    if (!(await ensurePermission(handle, true))) throw new Error('Permission to write the file was not granted.');
    if (snap.session !== session) throw new StaleSave();
    await queueWrite(handle, snap, { linkOnSuccess: true });
    if (snap.session !== session) return true; // written, but the user has moved on to another book
    if (store.dirty) autosave();
    notify(`Saved to ${handle.name}`);
    return true;
  } catch (error) {
    if (error.name === 'AbortError') return false;
    if (error.name === 'StaleSave') { notify(error.message, { kind: 'warn' }); return false; }
    if (snap.session === session) { file.state = 'error'; file.lastError = error.message; rerender('status'); }
    notify(`Save failed: ${error.message}`, { kind: 'error' });
    return false;
  }
}

/** Writes are serialised; each writes its own snapshot and only updates state for its own session. */
function queueWrite(handle, snap, { linkOnSuccess = false } = {}) {
  if (snap.session === session) { file.state = 'saving'; rerender('status'); }
  writing = writing.catch(() => {}).then(async () => {
    const writer = await handle.createWritable();
    await writer.write(snap.raw);
    await writer.close();
    if (snap.session !== session) return;
    if (linkOnSuccess) link(handle);
    // An autosave queued before Save as may still target the previous file.
    // Only a write to the current destination can mark this book as saved.
    if (handle !== file.handle) return;
    store.markSaved(snap.rev);
    file.savedAt = new Date(); file.state = 'linked'; file.lastError = '';
    writeRecovery.flush();
  });
  return writing;
}

function link(handle) {
  file.handle = handle; file.name = handle.name; file.state = 'linked';
  idbSet('lastFile', handle);
  rerender('status');
}

async function ensurePermission(handle, request) {
  if (!handle.queryPermission) return true;
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return request && (await handle.requestPermission(opts)) === 'granted';
}

/** Autosave after edits once a file is linked. Never prompts. */
const autosave = debounce(() => { flushToFile(); }, 1200);

/** Writes pending changes to the linked file now. Resolves true when the file holds them. */
async function flushToFile() {
  autosave.cancel();
  const handle = file.handle;
  if (!handle || file.state === 'reconnect') return false;
  if (!store.dirty) { await writing.catch(() => {}); return file.state === 'linked'; }
  const snap = snapshot();
  try {
    if (!(await ensurePermission(handle, false))) {
      if (snap.session === session) { file.state = 'reconnect'; rerender('status'); }
      return false;
    }
    if (snap.session !== session) return false;
    await queueWrite(handle, snap);
    if (snap.session === session) rerender('status');
    return true;
  } catch (error) {
    if (snap.session === session) { file.state = 'error'; file.lastError = error.message; rerender('status'); }
    return false;
  }
}

/** Re-grants write access after a relaunch (needs a click, so it is a button). */
async function reconnect() {
  if (!file.handle) return save();
  const mine = session;
  try {
    if (!(await ensurePermission(file.handle, true)) || mine !== session) return false;
    file.state = 'linked';
    if (store.dirty) await queueWrite(file.handle, snapshot());
    rerender('status');
    return true;
  } catch (error) { notify(error.message, { kind: 'error' }); return false; }
}

function download() {
  const url = URL.createObjectURL(new Blob([encodeBook(store.book)], { type: 'application/json' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: file.name || suggestedName() });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  notify('Download started. This browser cannot confirm the file was saved — check your Downloads folder.', { kind: 'warn', timeout: 9000 });
  return true;
}

/**
 * Before another book replaces this one: finish writing pending changes to the linked file,
 * or ask before discarding them. Never drops edits silently.
 */
async function settleBeforeReplace() {
  if (!store.dirty) { await writing.catch(() => {}); return true; }
  if (file.handle && (file.state === 'linked' || file.state === 'saving') && await flushToFile() && !store.dirty) return true;
  return confirm(file.handle
    ? `Changes to this book could not be saved to ${file.name}. Discard them and continue?`
    : 'This book has changes that are not saved to a file. Discard them and continue?');
}

async function openFile() {
  if (!(await settleBeforeReplace())) return;
  if (typeof window.showOpenFilePicker === 'function') {
    try {
      const [handle] = await window.showOpenFilePicker({ types: PICKER_TYPES, multiple: false });
      const f = await handle.getFile();
      await loadText(await f.text(), f.name, handle);
      if (file.handle === handle) await grantWrite(handle);
    } catch (error) {
      if (error.name !== 'AbortError') notify(`Could not open: ${error.message}`, { kind: 'error' });
    }
    return;
  }
  const input = Object.assign(document.createElement('input'), { type: 'file', accept: '.json,application/json' });
  input.addEventListener('change', async () => {
    const f = input.files[0];
    if (f) { try { await loadText(await f.text(), f.name, null); } catch (error) { notify(`Could not open: ${error.message}`, { kind: 'error' }); } }
  });
  input.click();
}

/**
 * The open picker grants read access only. Ask for write access while the click that opened
 * the file still counts, so autosave works at once instead of stopping at Reconnect.
 */
async function grantWrite(handle) {
  const mine = session;
  const granted = await ensurePermission(handle, true).catch(() => false);
  if (granted || mine !== session || file.handle !== handle) return;
  file.state = 'reconnect';
  rerender('status');
}

async function loadText(text, name, handle) {
  const { book, upgradedFrom } = decodeBook(text);
  beginSession();
  store.replace(book, { dirty: !!upgradedFrom });
  resetView();
  file.handle = null; file.name = name; file.state = 'none'; file.restoredAt = null;
  if (handle) {
    if (upgradedFrom) {
      // Never overwrite an older-format original silently.
      file.name = '';
      notify(`Upgraded from version ${upgradedFrom}. Use Save to choose where to keep the new version — the original file is untouched.`, { kind: 'warn', timeout: 12000 });
    } else link(handle);
  }
  writeRecovery.flush();
  rerender();
  if (!upgradedFrom) notify(`Opened ${name}`);
}

async function newBlankBook() {
  if (!(await settleBeforeReplace())) return;
  beginSession();
  store.replace(newBook());
  unlink(); resetView(); rerender();
}

async function loadExample(today) {
  if (!(await settleBeforeReplace())) return;
  beginSession();
  store.replace(exampleBook(today), { dirty: true });
  unlink(); resetView(); rerender();
  notify('Example loaded. It is synthetic — start your own with New book when ready.');
}

function unlink() { file.handle = null; file.name = ''; file.state = 'none'; file.restoredAt = null; }

function resetView() {
  restoreView(null);
}

// ── Recovery copy ──

let recoveryRevision = -1;
let recoveryFailed = false;

const writeRecovery = debounce(() => {
  if (!prefs().recovery) return;
  try {
    localStorage.setItem(RECOVERY_KEY, JSON.stringify({ at: new Date().toISOString(), fileName: file.name, dirty: store.dirty, book: store.book, view: sessionView() }));
    recoveryRevision = store.revision;
    recoveryFailed = false;
  } catch {
    recoveryRevision = -1;
    if (!recoveryFailed) notify('Recovery copy could not be saved. Save your book to a file before closing.', { kind: 'warn' });
    recoveryFailed = true;
  }
}, 400);

function clearRecovery() {
  recoveryRevision = -1;
  try { localStorage.removeItem(RECOVERY_KEY); } catch { /* ignore */ }
}

/**
 * Closing is safe only when the current edits reached a file or recovery storage.
 * A linked file that is behind (e.g. waiting on Reconnect) also warns, so it never goes stale unnoticed.
 */
function beforeUnload(event) {
  writeRecovery.flush();
  if (store.dirty && (file.handle || !prefs().recovery || recoveryRevision !== store.revision)) {
    event.preventDefault(); event.returnValue = '';
  }
}

/** On launch: restore the last session (and its file link, pending permission). */
async function restoreSession() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(RECOVERY_KEY) || 'null'); } catch { saved = null; }
  if (!saved?.book) return false;
  let book; let upgradedFrom;
  try { ({ book, upgradedFrom } = decodeBook(JSON.stringify(saved.book))); } catch { return false; }
  store.replace(book, { dirty: !!saved.dirty || !!upgradedFrom });
  restoreView(saved.view);
  file.name = saved.fileName || '';
  if (saved.dirty) file.restoredAt = new Date(saved.at);
  if (upgradedFrom) {
    file.name = ''; file.handle = null; file.state = 'none';
    notify(`Recovered a version ${upgradedFrom} book and upgraded it for assignments. Save a new copy; the original file is untouched.`, { kind: 'warn', timeout: 12000 });
    return true;
  }
  const handle = await idbGet('lastFile');
  if (handle && handle.name === saved.fileName) {
    file.handle = handle;
    file.state = (await ensurePermission(handle, false).catch(() => false)) ? 'linked' : 'reconnect';
  }
  return true;
}

// ── IndexedDB holds the file handle (handles cannot go in localStorage) ──

function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, value) {
  try {
    const db = await idb();
    db.transaction('kv', 'readwrite').objectStore('kv').put(value, key);
  } catch { /* storage blocked: linking still works for this session */ }
}

async function idbGet(key) {
  try {
    const db = await idb();
    return await new Promise(resolve => {
      const req = db.transaction('kv').objectStore('kv').get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch { return null; }
}

// ── ui/overlay.js ──
// Toasts, popover menus and the small modal used for help.

// ── Toasts ──

function initToasts() {
  const host = h('div', { class: 'toasts', role: 'status', 'aria-live': 'polite' });
  document.body.append(host);
  onNotify((message, { kind = '', action = null, timeout = kind === 'error' ? 8000 : 4500 } = {}) => {
    const el = h('div', { class: ['toast', kind] },
      kind === 'error' || kind === 'warn' ? icon('alert', 16) : icon('check', 16),
      h('span', null, message),
      action ? h('button', { class: 'toast-action', onclick: () => { action.run(); el.remove(); } }, action.label) : null,
      h('button', { class: 'toast-close', 'aria-label': 'Dismiss', onclick: () => el.remove() }, icon('x', 14)));
    host.append(el);
    while (host.children.length > 3) host.firstChild.remove();
    setTimeout(() => el.remove(), timeout);
  });
}

// ── Popover menu ──

let openMenu = null;

function closeMenu() {
  if (!openMenu) return;
  openMenu.el.remove();
  openMenu.anchor.setAttribute('aria-expanded', 'false');
  openMenu.anchor.focus({ preventScroll: true });
  openMenu = null;
}

/** items: [{ label, icon?, hint?, run, danger?, disabled? } | 'separator' | { heading }] */
function showMenu(anchor, items, { align = 'end' } = {}) {
  if (openMenu?.anchor === anchor) { closeMenu(); return; }
  closeMenu();
  const el = h('div', { class: 'menu', role: 'menu' }, items.map(it => {
    if (it === 'separator') return h('div', { class: 'menu-sep', role: 'separator' });
    if (it.heading) return h('div', { class: 'menu-heading' }, it.heading);
    return h('button', {
      role: 'menuitem', class: ['menu-item', it.danger && 'danger'], disabled: it.disabled || null,
      onclick: () => { closeMenu(); it.run(); },
    }, it.icon ? icon(it.icon, 16) : h('span', { class: 'icon-gap' }), h('span', null, it.label), it.hint ? h('kbd', null, it.hint) : null);
  }));
  document.body.append(el);
  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth;
  const left = align === 'end' ? r.right - w : r.left;
  el.style.left = `${Math.max(8, Math.min(left, innerWidth - w - 8))}px`;
  const below = r.bottom + 6;
  el.style.top = `${below + el.offsetHeight > innerHeight - 8 ? Math.max(8, r.top - el.offsetHeight - 6) : below}px`;
  anchor.setAttribute('aria-expanded', 'true');
  openMenu = { el, anchor };
  el.querySelector('button:not([disabled])')?.focus();
  el.addEventListener('keydown', event => {
    const buttons = [...el.querySelectorAll('button:not([disabled])')];
    const i = buttons.indexOf(document.activeElement);
    if (event.key === 'ArrowDown') { event.preventDefault(); buttons[(i + 1) % buttons.length].focus(); }
    if (event.key === 'ArrowUp') { event.preventDefault(); buttons[(i - 1 + buttons.length) % buttons.length].focus(); }
    if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); closeMenu(); }
    if (event.key === 'Tab') closeMenu();
  });
}

document.addEventListener('pointerdown', event => {
  if (openMenu && !openMenu.el.contains(event.target) && !openMenu.anchor.contains(event.target)) closeMenu();
});

// ── Modal ──

function showModal(title, body, { wide = false } = {}) {
  const dialog = h('dialog', { class: ['modal', wide && 'wide'], 'aria-label': title },
    h('div', { class: 'modal-head' }, h('h2', null, title),
      h('button', { class: 'icon-btn', 'aria-label': 'Close', onclick: () => dialog.close() }, icon('x', 18))),
    h('div', { class: 'modal-body' }, body));
  dialog.addEventListener('close', () => dialog.remove());
  document.body.append(dialog);
  dialog.showModal();
  return dialog;
}

// Visual style and light/dark choice. Stored per browser, like a window preference;
// it is not part of the planning book.

const STYLES = [['fluent', 'Fluent (Microsoft 365)'], ['notebook', 'Notebook']];
const SCHEMES = [['system', 'Match Windows'], ['light', 'Light'], ['dark', 'Dark']];

function applyAppearance() {
  const p = prefs();
  const root = document.documentElement;
  root.dataset.style = STYLES.some(([k]) => k === p.style) ? p.style : 'fluent';
  if (p.scheme === 'light' || p.scheme === 'dark') root.dataset.scheme = p.scheme;
  else delete root.dataset.scheme;
}

function appearanceMenu(anchor) {

  const pick = (key, value) => { setPref(key, value); applyAppearance(); };

    { heading: 'Style' },
