    'separator',
    { heading: 'Theme' },
    ...SCHEMES.map(([k, label]) => ({ label, icon: k === scheme ? 'check' : '', run: () => pick('scheme', k) })),
  ], { align: 'start' });
}

// ── core/ics.js ──
// One-way export of planned work, milestones and due dates as an iCalendar (.ics) file
// (RFC 5545). All events are all-day and marked "free" so they never block meeting time.

const ICS_KINDS = {
  planned: 'Planned work days',
  milestones: 'Milestones',
  due: 'Task forecast finish dates',
};

/** Events the export would contain, before formatting. Exposed for the dialog's live count. */
function calendarEvents(book, { focus = '', include = { planned: true, milestones: true, due: false }, done = false } = {}) {
  const out = [];
  for (const t of book.items) {
    if (isHidden(book, t) || (focus && t.jobId !== focus) || (t.status === 'done' && !done)) continue;
    const job = jobOf(book, t.jobId);
    const base = { item: t, job, phase: phaseTitle(book, t.phaseId) };
    if (include.planned && t.plannedDay && t.kind === 'task') {
      out.push({ ...base, kind: 'plan', date: t.plannedDay, summary: `${t.title}${t.effort && t.status !== 'done' ? ` (${fmtEffort(t.effort)})` : ''}` });
    }
    if (include.milestones && t.kind === 'milestone' && t.finish) {
      out.push({ ...base, kind: 'milestone', date: t.finish, summary: `◆ ${t.title}` });
    }
    if (include.due && t.kind === 'task' && t.finish) {
      out.push({ ...base, kind: 'due', date: t.finish, summary: `Forecast finish: ${t.title}` });
    }
  }
  return out.sort((a, b) => a.date.localeCompare(b.date) || a.summary.localeCompare(b.summary));
}

/** Builds the .ics text. `now` is injectable so tests are deterministic. */
function buildIcs(book, options = {}, now = new Date(), version = '') {
  const stamp = now.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  // Minutes since 1970 always grows between exports, so clients that honour SEQUENCE take the newer copy.
  const sequence = Math.floor(now.getTime() / 60000);
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    `PRODID:-//Selami Pazarbasi//Tas-Time ${version}//EN`,
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    `X-WR-CALNAME:${escapeText(`Tas-Time — ${book.name}`)}`,
  ];
  for (const e of calendarEvents(book, options)) {
    const t = e.item;
    const details = [
      `${e.job.code ? `${e.job.code} · ` : ''}${e.job.title}${e.phase ? ` / ${e.phase}` : ''}`,
      e.kind === 'plan' ? 'Planned work day.' : e.kind === 'due' ? 'Forecast finish.' : 'Milestone.',
      t.effort && t.status !== 'done' ? `Effort left: ${fmtEffort(t.effort)}` : '',
      t.status === 'done' ? 'Status: done' : '',
      t.notes.trim() ? `\n${t.notes.trim().slice(0, 2000)}` : '',
      '\nExported from Tas-Time. Edit in Tas-Time and export again; changes made here are not read back.',
    ].filter(Boolean).join('\n');
    lines.push(
      'BEGIN:VEVENT',
      `UID:${t.id}-${e.kind}@tas-time`,
      `DTSTAMP:${stamp}`,
      `SEQUENCE:${sequence}`,
      `DTSTART;VALUE=DATE:${e.date.replaceAll('-', '')}`,
      `DTEND;VALUE=DATE:${addDays(e.date, 1).replaceAll('-', '')}`,
      `SUMMARY:${escapeText(e.summary)}`,
      `DESCRIPTION:${escapeText(details)}`,
      `CATEGORIES:${escapeText(e.job.code || e.job.title)}`,
      'TRANSP:TRANSPARENT',
      'END:VEVENT',
    );
  }
  lines.push('END:VCALENDAR');
  return lines.map(fold).join('\r\n') + '\r\n';
}

/** RFC 5545 §3.3.11 TEXT escaping. */
function escapeText(value) {
  return String(value)
    .replace(/\\/g, '\\\\')
    .replace(/;/g, '\\;')
    .replace(/,/g, '\\,')
    .replace(/\r\n|\r|\n/g, '\\n');
}

const encoder = new TextEncoder();

/** RFC 5545 §3.1: lines longer than 75 octets continue on lines starting with one space. Never splits a character. */
function fold(line) {
  if (encoder.encode(line).length <= 75) return line;
  const parts = [];
  let current = '';
  let size = 0;
  let limit = 75;
  for (const ch of line) {
    const bytes = encoder.encode(ch).length;
    if (size + bytes > limit) {
      parts.push(current);
      current = '';
      size = 0;
      limit = 74; // continuation lines spend one octet on the leading space
    }
    current += ch;
    size += bytes;
  }
  parts.push(current);
  return parts.join('\r\n ');
}

// ── ui/export.js ──
// "Export to calendar" dialog: choose what to include, download an .ics file, then import it.

const choice = { planned: true, milestones: true, due: false, done: false, focusOnly: false };

function showCalendarExport() {
  const book = store.book;
  const focusJob = ui.focus ? jobOf(book, ui.focus) : null;
  const options = () => ({
    focus: focusJob && choice.focusOnly ? focusJob.id : '',
    include: { planned: choice.planned, milestones: choice.milestones, due: choice.due },
    done: choice.done,
  });

  const count = h('p', { class: 'export-count', role: 'status' });
  const exportBtn = btn('Download .ics file', () => downloadIcs(options()), { kind: 'primary', iconName: 'save' });
  const refresh = () => {
    const n = calendarEvents(book, options()).length;
    count.textContent = n ? `${n} event${n === 1 ? '' : 's'} will be exported.` : 'Nothing to export with these choices.';
    exportBtn.disabled = !n;
  };
  const box = (key, label, hint = '') => h('label', { class: 'check-row' },
    h('input', { type: 'checkbox', checked: choice[key], onchange: e => { choice[key] = e.target.checked; refresh(); } }),
    h('span', null, label, hint ? h('small', { class: 'muted' }, ` — ${hint}`) : null));

  refresh();
  showModal('Export to calendar', [
    h('p', { class: 'muted' }, 'Creates an .ics file you import into Google Calendar or Outlook. All-day events, shown as free time. One-way: edit plans here and export again.'),
    h('fieldset', { class: 'export-set' }, h('legend', null, 'Include'),
      box('planned', ICS_KINDS.planned, 'the day you intend to work on a task'),
      box('milestones', ICS_KINDS.milestones),
      box('due', ICS_KINDS.due, 'forecast finish of each task'),
      box('done', 'Completed work')),
    focusJob ? h('fieldset', { class: 'export-set' }, h('legend', null, 'Jobs'), box('focusOnly', `Only ${focusJob.title}`)) : null,
    count,
    h('div', { class: 'export-actions' }, exportBtn),
    h('details', { class: 'export-help' }, h('summary', null, 'How to import'),
      h('p', null, h('strong', null, 'Tip: '), 'import into a separate calendar called “Tas-Time”. To refresh cleanly, delete that calendar and import the new file — your own events are never touched, and finished or removed tasks disappear.'),
      h('p', null, h('strong', null, 'Google Calendar: '), 'Settings → Add calendar → Create new calendar (“Tas-Time”). Then Settings → Import & export → Import, choose the file and the Tas-Time calendar.'),
      h('p', null, h('strong', null, 'Outlook (classic): '), 'File → Open & Export → Import/Export → “Import an iCalendar (.ics) file”, then choose “Open as New” to keep it as a separate calendar.'),
      h('p', null, h('strong', null, 'New Outlook / Outlook on the web: '), 'Calendar → Add calendar → Upload from file, then pick or create the calendar to import into.')),
  ]);
}

function downloadIcs(options) {
  const book = store.book;
  const ics = buildIcs(book, options, new Date(), APP_VERSION);
  const name = `${book.name.replace(/[^a-z0-9-]+/gi, '-').replace(/^-|-$/g, '') || 'planning-book'}-calendar.ics`;
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  notify(`Calendar file downloaded: ${name}. Import it into your calendar.`);
}

// ── ui/guide.js ──
// The beginner's guide, bundled into the page at build time (docs/TUTORIAL.md) and shown
// offline in a reading window. The build places it in <template id="guide-content">.

function showGuide() {
  const source = document.getElementById('guide-content');
  if (!source) return;
  const body = source.content.cloneNode(true);
  const dialog = showModal('Beginner’s guide', [body], { wide: true });
  dialog.classList.add('guide-modal');
  // Contents entries scroll within the window instead of changing the page address.
  dialog.addEventListener('click', event => {
    const target = event.target.closest('[data-goto]');
    if (!target) return;
    event.preventDefault();
    // Scroll only the reading pane; scrollIntoView would also nudge the dialog and the page.
    const pane = dialog.querySelector('.guide');
    const heading = dialog.querySelector(`#${CSS.escape(target.dataset.goto)}`);
    if (pane && heading) pane.scrollTo({ top: pane.scrollTop + heading.getBoundingClientRect().top - pane.getBoundingClientRect().top - 8, behavior: 'smooth' });
  });
}

/** "Read the beginner's guide" as an in-app button, styled like a link. */
function guideButton(label = 'Read the beginner’s guide') {
  return h('button', { class: 'link guide-open', onclick: showGuide }, label);
}

function personSelect(value, onChange, { id = '', label = 'Assignee', all = true } = {}) {

// ── ui/drawer.js ──
// Side panel editor for items and jobs. Every field saves as you go — there is no
// "Keep changes" step; undo (Ctrl+Z outside a text field) reverts mistakes.

let typedSinceRender = false;

function field(label, control, { hint = '', id = '' } = {}) {
  return h('div', { class: 'field' }, h('label', { for: id || null }, label), control, hint ? h('p', { class: 'field-hint' }, hint) : null);
}

/** Text input that saves on every keystroke (coalesced into one undo step). */
function liveText(id, value, onValue, attrs = {}) {
  const tag = attrs.multiline ? 'textarea' : 'input';
  const el = h(tag, {
    id, ...attrs, multiline: null,
    oninput: e => { typedSinceRender = true; if (tag === 'textarea') autosize(e.target); onValue(e.target.value); },
  });
  el.value = value;
  if (tag === 'textarea') requestAnimationFrame(() => autosize(el));
  return el;
}

function renderDrawer() {
  typedSinceRender = false;
  const d = ui.drawer;
  if (!d) return null;
  const record = d.type === 'item' ? itemOf(store.book, d.id) : jobOf(store.book, d.id);
  if (!record) { ui.drawer = null; return null; }
  const panel = h('aside', { class: 'drawer', id: 'drawer', 'data-record': d.id, 'aria-label': d.type === 'item' ? 'Edit task' : 'Edit job', tabindex: '-1' },
    d.type === 'item' ? itemEditor(record) : jobEditor(record));
  // Text edits commit quietly (without rebuilding the page); refresh once focus leaves the field.
  panel.addEventListener('focusout', () => {
    if (typedSinceRender) {
      typedSinceRender = false;
      setTimeout(() => { if (panel.isConnected) rerender(); }, 0);
    }
  });
  if (d.focusField) {
    const target = d.focusField;
    d.focusField = '';
    requestAnimationFrame(() => {
      const el = document.getElementById(`d-${target}`);
      el?.focus();
      if (target === 'title') el?.select();
      el?.scrollIntoView({ block: 'center' });
    });
  }
  return panel;
}

  const day = today();

  const { planned, carried, overdue } = todayList(book, day, ui.focus, personId);
  const open = planned.filter(t => t.status !== 'done');
  const load = weekLoad(book, mondayOf(day), '', personId);
  const capacity = personCapacity(book, mondayOf(day), personId);
  const unassigned = personId === 'all' ? weekLoad(book, mondayOf(day), '', 'unassigned').planned : 0;

  const sub = open.length
    ? `${open.length} to do · ${fmtHours(openEffort(open))} of work${planned.length - open.length ? ` · ${planned.length - open.length} done` : ''}`

function suggestions(book, day) {
  const ready = readyToPlan(book, mondayOf(day), ui.focus, workPersonId()).filter(t => !t.blocker && t.deps.every(id => book.items.find(x => x.id === id)?.status === 'done')).slice(0, 5);

/** Restart notes for the jobs you are touching today (or the focused job). */
function resumeNotes(book, planned, carried, day) {
  // Today's jobs first; otherwise carried-over work; otherwise whatever you touched last.
  let ids = ui.focus ? [ui.focus] : [...new Set(planned.map(t => t.jobId))];

// ── ui/dnd.js ──
// HTML5 drag and drop for item cards. Every drop target also has a keyboard/menu alternative.
const MIME = 'application/x-tas-time-item';

function makeDraggable(el, id) {
  el.draggable = true;
  el.addEventListener('dragstart', event => {
    event.dataTransfer.setData(MIME, id);
    event.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => el.classList.add('dragging'));
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  return el;
}

function makeDropZone(el, onDrop) {
  el.addEventListener('dragover', event => {
    if (!event.dataTransfer.types.includes(MIME)) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    el.classList.add('drop-over');
  });
  el.addEventListener('dragleave', event => { if (!el.contains(event.relatedTarget)) el.classList.remove('drop-over'); });
  el.addEventListener('drop', event => {
    el.classList.remove('drop-over');
    const id = event.dataTransfer.getData(MIME);
    if (!id) return;
    event.preventDefault();
    onDrop(id);
  });
  return el;
}

const HEADER = 52;

function timeRange(rows) {
  const t = today();
  const base = addDays(mondayOf(t), -7);
  if (ui.planRange === '6w') return { start: base, days: 56, px: 26 };
  if (ui.planRange === '3m') return { start: base, days: 7 * 15, px: 12 };
  const dates = rows.filter(r => r.type === 'item').flatMap(r => [r.item.start, r.item.finish, r.item.baseline?.start, r.item.baseline?.finish]).filter(Boolean);
  if (!dates.length) return { start: base, days: 56, px: 26 };
  dates.push(t);
  dates.sort();
  const start = addDays(mondayOf(dates[0]), -7);
  const days = Math.ceil((diffDays(start, dates.at(-1)) + 14) / 7) * 7;
  const avail = (document.getElementById('main')?.clientWidth || 1200) - labelWidth() - 48;
  return { start, days, px: Math.max(4, Math.min(26, Math.floor(avail / days))) };
}

function header(range) {

    const nextMonth = `${m === 12 ? y + 1 : y}-${String(m === 12 ? 1 : m + 1).padStart(2, '0')}-01`;

    tr.append(h('span', { class: 'base', style: { left: `${x(range, bs)}px`, width: `${(diffDays(bs, t.baseline.finish) + 1) * range.px}px` }, title: `Baseline ${fmtShort(bs)} – ${fmtShort(t.baseline.finish)}` }));
  }
  if (!t.start && !t.finish) {
    tr.classList.add('unscheduled');
    tr.title = 'Click a day to schedule';
    tr.addEventListener('click', e => {
      const day = addDays(range.start, Math.floor((e.clientX - tr.getBoundingClientRect().left) / range.px));
      act('Schedule', d => patchItem(d, t.id, t.kind === 'milestone' ? { finish: day } : { start: day, finish: day }, today()));
    });
    return tr;
  }
  const start = t.start || t.finish;
  const finish = t.finish || t.start;
  const label = `${t.title}: ${fmtShort(start)}${start !== finish ? ` to ${fmtShort(finish)}` : ''}`;
  if (t.kind === 'milestone') {
    const ms = h('button', { class: ['gms', t.status === 'done' && 'done', late && 'late'], style: { left: `${x(range, finish) + range.px / 2}px` }, 'aria-label': label, title: label });
    bindDrag(ms, t, range, false);
    tr.append(ms);
  } else {
    const bar = h('button', {
      class: ['bar', t.status, late && 'late', blocked && 'blocked'],
      style: { left: `${x(range, start)}px`, width: `${(diffDays(start, finish) + 1) * range.px}px` },
      'aria-label': label, title: label,
    }, h('span', { class: 'grip', 'data-resize': '1' }));
    bindDrag(bar, t, range, true);
    tr.append(bar);
  }
  if (s) tr.append(h('span', { class: ['slip', s > 0 ? 'danger' : 'good'], style: { left: `${x(range, finish) + range.px + 6}px` }, title: 'Change since baseline' }, `${s > 0 ? '+' : ''}${s}d`));
  return tr;
}

/** Pointer drag to move (or resize from the grip) with day snapping; arrow keys for the same. */
function bindDrag(el, t, range, resizable) {
  let startX = 0; let mode = ''; let moved = 0; let origLeft = 0; let origWidth = 0;
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    mode = resizable && e.target.dataset.resize ? 'resize' : 'move';
    startX = e.clientX; moved = 0;
    origLeft = parseFloat(el.style.left); origWidth = parseFloat(el.style.width) || 0;
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', e => {
    if (!mode) return;
    moved = Math.round((e.clientX - startX) / range.px);
    if (mode === 'move') el.style.left = `${origLeft + moved * range.px}px`;
    else el.style.width = `${Math.max(range.px, origWidth + moved * range.px)}px`;
  });
  const end = () => {
    if (!mode) return;
    const m = mode; mode = '';
    el.classList.remove('dragging');
    if (Math.abs(moved) > 0) commitDrag(t, m, moved);
    else if (Math.abs(parseFloat(el.style.left) - origLeft) < 1) openDrawer('item', t.id);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', () => { mode = ''; el.classList.remove('dragging'); rerender(); });
  el.addEventListener('click', e => { if (e.detail === 0) openDrawer('item', t.id); });
  el.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const delta = e.key === 'ArrowLeft' ? -1 : 1;
    commitDrag(t, resizable && e.shiftKey ? 'resize' : 'move', delta);
    requestAnimationFrame(() => document.querySelector(`[data-item="${t.id}"] .bar, [data-item="${t.id}"] .gms`)?.focus());
  });
}

function commitDrag(t, mode, days) {
  if (mode === 'move') { act('Move', d => shiftItem(d, t.id, days)); return; }
  const cur = itemOf(store.book, t.id);
  const start = cur.start || cur.finish;
  const finish = addDays(cur.finish || cur.start, days);
  act('Change finish', d => patchItem(d, t.id, { start, finish: finish < start ? start : finish }, today()));
}

/** Today line plus prerequisite connectors, drawn in one SVG over the timeline. */
function overlay(rows, positions, range, height) {
  const lw = labelWidth();
  const w = range.days * range.px;
  const svg = h('svg', { class: 'plan-overlay', width: w, height, style: { left: `${lw}px` }, 'aria-hidden': 'true' },
    h('defs', null, h('marker', { id: 'arrow', viewBox: '0 0 8 8', refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: 'auto' }, h('path', { d: 'M0 0L8 4L0 8z', class: 'arrow-head' })),
      h('marker', { id: 'arrow-bad', viewBox: '0 0 8 8', refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: 'auto' }, h('path', { d: 'M0 0L8 4L0 8z', class: 'arrow-head bad' }))));
  const tx = x(range, today()) + range.px / 2;
  if (tx >= 0 && tx <= w) svg.append(h('line', { class: 'today-line', x1: tx, x2: tx, y1: HEADER - 6, y2: height }));
  const book = store.book;
  for (const row of rows) {
    if (row.type !== 'item') continue;
    const t = row.item;
    const y2 = positions.get(t.id);
    if (!t.start && !t.finish) continue;
    const conflicts = new Set(dateConflicts(book, t).map(d => d.id));
    for (const depId of t.deps) {
      const d = itemOf(book, depId);
      const y1 = positions.get(depId);
      if (!d || y1 === undefined || !(d.finish || d.start)) continue;
      const x1 = x(range, d.finish || d.start) + (d.kind === 'milestone' ? range.px / 2 + 6 : range.px);
      const x2 = x(range, t.start || t.finish) + (t.kind === 'milestone' ? range.px / 2 - 7 : 0);
      const bad = conflicts.has(depId);
      const mid = Math.max(x1 + 6, Math.min(x2 - 8, x1 + 10));
      const path = x2 - 8 >= x1 + 6
        ? `M${x1} ${y1} H${mid} V${y2} H${x2 - 1}`
        : `M${x1} ${y1} h6 V${(y1 + y2) / 2} H${x2 - 12} V${y2} H${x2 - 1}`;
      svg.append(h('path', { d: path, class: ['dep', bad && 'bad'], 'marker-end': `url(#${bad ? 'arrow-bad' : 'arrow'})` }));
    }
  }
  return svg;
}

// Board: status at a glance. "Blocked" is derived from constraints and prerequisites,
// so dropping a card there asks for the reason instead of setting a status.

const COLUMNS = [['todo', 'To do'], ['doing', 'Doing'], ['blocked', 'Blocked'], ['done', 'Done']];
const DONE_WINDOW = 14;

function moveTo(id, column) {
  const t = store.book.items.find(x => x.id === id);
  if (!t || boardColumn(store.book, t, today()) === column) return;
  if (column === 'blocked') { openDrawer('item', id, 'blocker'); notify('Record what this is waiting for.'); return; }
  const reasons = blockers(store.book, t);
  if (reasons.length) {
    notify(`Still blocked: ${reasons.join('; ')}. Clear it in the task first.`, { kind: 'warn', action: { label: 'Open', run: () => openDrawer('item', id, 'blocker') } });
    return;
  }
  act(`Move to ${STATUS[column]}`, d => patchItem(d, id, { status: column }, today()));
}

function renderBoard() {
  const book = store.book;
  if (!liveJobs(book).length) return welcome();
  const items = liveItems(book).filter(t => !ui.focus || t.jobId === ui.focus);
  const cutoff = addDays(today(), -DONE_WINDOW);
  const cols = COLUMNS.map(([key, label]) => {
    let list = items.filter(t => boardColumn(book, t, today()) === key).sort(byUrgency);
    let hidden = 0;
    if (key === 'done' && !ui.boardAllDone) {

      h('div', { class: 'col-cards' }, list.length ? list.map(boardCard) : h('p', { class: 'col-empty' }, key === 'blocked' ? 'Nothing is blocked.' : 'No cards')),
      hidden ? btn(`Show ${hidden} older`, () => { ui.boardAllDone = true; rerender(); }, { kind: 'ghost sm' }) : null);
    return makeDropZone(col, id => moveTo(id, key));
  });
  return h('div', { class: 'view board' },
    h('header', { class: 'page-head' }, h('div', null, h('p', { class: 'eyebrow' }, 'Status'), h('h1', null, 'Board'),
      h('p', { class: 'sub' }, 'Drag cards between columns. A task is Blocked when it has a written constraint, or its prerequisites are unfinished once it is due to start.'))),
    h('div', { class: 'cols' }, cols));
}

function boardCard(t) {
  const book = store.book;
  const job = jobOf(book, t.jobId);
  const blocked = isBlocked(book, t, today());
  const waiting = blocked ? [] : waitingOn(book, t);
  const el = h('article', { class: ['bcard', t.kind === 'milestone' && 'is-ms'], style: { '--job': jobColor(job) }, 'data-item': t.id },

  if (blocked) el.append(btn('Resolve blocker', () => openDrawer('item', t.id, t.blocker.trim() ? 'blocker' : 'deps'), { kind: 'sm' }));

/** A single selection drives the screen, printout and CSV. Paused jobs are opt-in. */
function assignmentItems(book, today, { person = 'all', job = '', status = 'open', period = 'all', week = mondayOf(today), paused = false, search = '' } = {}) {
  const needle = search.trim().toLowerCase();
  return liveItems(book).filter(t => {
    const j = jobOf(book, t.jobId);
    if (!matchesPerson(t, person) || (job && t.jobId !== job) || (!paused && j.status !== 'active')) return false;
    if (status === 'open' && t.status === 'done') return false;
    if (status === 'late' && !isLate(t, today)) return false;
    if (['todo', 'doing', 'blocked', 'done'].includes(status) && boardColumn(book, t, today) !== status) return false;
    if (period === 'week' && (!t.plannedDay || t.plannedDay < week || t.plannedDay > addDays(week, 6))) return false;
    if (period === 'unscheduled' && t.plannedDay) return false;
    return !needle || [t.title, t.notes, j.title, phaseTitle(book, t.phaseId), personName(book, t.assigneeId)].join(' ').toLowerCase().includes(needle);
  }).sort(byUrgency);
}

function assignmentGroups(book, items, group, today) {
  const groups = new Map();
  for (const t of items) {
    const label = group === 'status' ? ({ todo: 'To do', doing: 'Doing', blocked: 'Blocked', done: 'Done' }[boardColumn(book, t, today)])
      : group === 'week' ? (t.plannedDay ? `Week of ${mondayOf(t.plannedDay)}` : 'No work day')
      : group === 'person' ? personName(book, t.assigneeId) : jobOf(book, t.jobId).title;
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(t);
  }
  return [...groups.entries()].sort(([a], [b]) => a.localeCompare(b));
}

/** Neutralize spreadsheet formula prefixes as well as quoting commas/newlines. */
function assignmentCsvCell(value) {
  let s = String(value ?? '');
  if (/^[\s]*[=+@-]/.test(s) || /^[\t\r\n]/.test(s)) s = `'${s}`;
  return `"${s.replaceAll('"', '""')}"`;
}

function assignmentsCsv(book, items, today) {
  const rows = [['Assignee', 'Job', 'Job status', 'Phase', 'Task', 'Kind', 'Status', 'Work on', 'Forecast start', 'Forecast finish', 'Effort left (hours)', 'Blockers / prerequisites', 'Contacts', 'Notes']];
  for (const t of items) rows.push([personName(book, t.assigneeId), jobOf(book, t.jobId).title, jobOf(book, t.jobId).status,
    phaseTitle(book, t.phaseId), t.title, t.kind, boardColumn(book, t, today), t.plannedDay, t.start, t.finish,
    t.status === 'done' ? 0 : t.effort / 60, blockers(book, t).join('; '), t.owner, t.notes]);
  return '\uFEFF' + rows.map(row => row.map(assignmentCsvCell).join(',')).join('\r\n') + '\r\n';
}

  const focusedJob = store.book.jobs.find(j => j.id === ui.focus);
  if (focusedJob) main.prepend(h('div', { class: 'focus-banner' },
    h('strong', null, `Showing: ${focusedJob.title}`),
    btn('All jobs', () => setFocus(ui.focus), { kind: 'sm' }),
    btn('Edit job', () => openJobEditor(focusedJob.id), { kind: 'sm' }),
    focusedJob.status !== 'active' ? h('span', null, `${focusedJob.status === 'hold' ? 'On hold' : 'Complete'} · Tasks are paused in Today and Week. Reactivate in Edit job.`) : null));
  main.scrollTop = pageY;
  const drawer = renderDrawer();
  fill(document.getElementById('drawer-host'), drawer);
  if (drawer) drawer.scrollTop = drawerY;
  document.body.classList.toggle('has-drawer', !!drawer);

  for (const [id, left, top] of keep) {
    const el = document.getElementById(id);
    if (el) { el.scrollLeft = left; el.scrollTop = top; }
  }
  if (focusId && focusId !== 'quick-add') {
    const el = document.getElementById(focusId);
    if (el && el !== document.activeElement) {
      el.focus({ preventScroll: true });
      if (selection && 'setSelectionRange' in el) { try { el.setSelectionRange(...selection); } catch { /* not a text field */ } }
    }
  }
  document.title = `${store.dirty ? '• ' : ''}${store.book.name} — Tas-Time`;
}

function sidebar() {

  const jobs = liveJobs(book);
  return [
    h('div', { class: 'brand' }, appMark(30), h('div', null, h('strong', null, 'Tas-Time'),
      h('button', { class: 'book-name', title: 'Rename this planning book', onclick: renameBook }, book.name))),
    h('nav', { class: 'nav', 'aria-label': 'Views' }, VIEWS.map(v => h('button', {
      class: ['nav-item', ui.view === v.id && 'on'], 'aria-current': ui.view === v.id ? 'page' : null, onclick: () => setView(v.id),
    }, icon(v.icon, 18), h('span', null, v.label), h('kbd', null, v.key)))),
    h('div', { class: 'jobs-head' }, h('span', null, 'Jobs'), iconBtn('plus', 'New job', () => createJob(), { class: 'icon-btn sm' })),
    btn('All jobs', () => { ui.focus = ''; rerender(); }, { kind: 'sm ghost' }),

      j.status !== 'active' ? h('span', { class: 'chip' }, j.status === 'hold' ? 'On hold' : 'Complete') : null,

      h('span', { class: 'badge', title: `${s.open} open` }, String(s.open))));
    })),
    jobs.length ? null : h('p', { class: 'jobs-empty' }, 'No jobs yet.'),
    h('div', { class: 'side-foot' },
      h('button', { class: 'foot-link', id: 'guide', onclick: showGuide }, icon('book', 16), 'Beginner’s guide'),
      h('button', { class: 'foot-link', id: 'appearance', 'aria-haspopup': 'menu', onclick: e => appearanceMenu(e.currentTarget) }, icon('palette', 16), 'Appearance'),
      h('button', { class: 'foot-link', onclick: showHelp }, icon('keyboard', 16), 'Shortcuts & help')),
  ];
}

function openJobEditor(id) { openDrawer('job', id); }

function renderQuickDestination() {
  const jobs = liveJobs(store.book);
  const selected = jobs.find(j => j.id === ui.quickJob) || jobs.find(j => j.id === ui.focus) || jobs[0];
  ui.quickJob = selected?.id || '';
  const phases = phasesOf(store.book, ui.quickJob);
  if (!phases.some(p => p.id === ui.quickPhase)) ui.quickPhase = '';
  if (ui.quickAssignee !== 'unassigned' && !store.book.people.some(p => p.id === ui.quickAssignee)) ui.quickAssignee = store.book.selfId;
  fill(document.getElementById('quick-destination'),
    h('label', null, 'Job', h('select', { id: 'quick-job', 'aria-label': 'New task job', onchange: e => { ui.quickJob = e.target.value; ui.quickPhase = ''; renderQuickDestination(); document.getElementById('quick-add').dispatchEvent(new Event('input')); } },
      jobs.length ? jobs.map(j => h('option', { value: j.id, selected: j.id === ui.quickJob }, j.title)) : h('option', { value: '' }, 'New Inbox'))),
    h('label', null, 'Phase', h('select', { id: 'quick-phase', 'aria-label': 'New task phase', onchange: e => { ui.quickPhase = e.target.value; document.getElementById('quick-add').dispatchEvent(new Event('input')); } },
      h('option', { value: '' }, 'No phase (optional)'), phases.map(p => h('option', { value: p.id, selected: p.id === ui.quickPhase }, p.title)))),
    h('label', null, 'Assignee', h('select', { id: 'quick-assignee', 'aria-label': 'New task assignee', onchange: e => { ui.quickAssignee = e.target.value; document.getElementById('quick-add').dispatchEvent(new Event('input')); } },
      h('option', { value: 'unassigned', selected: ui.quickAssignee === 'unassigned' }, 'Unassigned'),
      store.book.people.map(p => h('option', { value: p.id, selected: ui.quickAssignee === p.id }, p.name)))),
    btn('Add task', () => {
      const input = document.getElementById('quick-add');
      if (input.value.trim()) {
        if (quickAdd(input.value, { jobId: ui.quickJob, phaseId: ui.quickPhase, assigneeId: ui.quickAssignee === 'unassigned' ? '' : ui.quickAssignee })) { input.value = ''; input.dispatchEvent(new Event('input')); }
      } else createTask(ui.quickJob, ui.quickPhase, '', ui.quickAssignee === 'unassigned' ? '' : ui.quickAssignee);
    }, { kind: 'sm', iconName: 'plus' }));
}

function renameBook() {
  const name = prompt('Name this planning book', store.book.name);
  if (name && name.trim()) store.commit('Rename book', d => { d.name = name.trim().slice(0, 200); });
}

function renderStatus() {
  const host = document.getElementById('file-status');
  const dirty = store.dirty;
  let label; let kind = ''; let title = ''; let onclick = () => save();
  if (file.state === 'saving') { label = 'Saving…'; kind = 'busy'; }
  else if (file.state === 'reconnect') { label = `Reconnect ${file.name}`; kind = 'warn'; title = 'The browser needs your permission again to keep saving to this file.'; onclick = reconnect; }
  else if (file.state === 'error') { label = 'Save failed — retry'; kind = 'danger'; title = file.lastError; }
  else if (file.handle && !dirty) { label = `Saved · ${file.name}`; kind = 'ok'; title = file.savedAt ? `Last saved ${file.savedAt.toLocaleTimeString()}` : 'Up to date'; }
  else if (file.handle) { label = 'Saving soon…'; kind = 'busy'; }
  else if (dirty) { label = canLinkFiles ? 'Not saved to a file' : 'Unsaved changes'; kind = 'warn'; title = 'Your work is kept in this browser as a recovery copy, but not in a file yet.'; }
  else { label = file.name || 'New book'; title = 'No changes'; }
  fill(host,
    h('button', { class: ['status', kind], title, onclick }, h('span', { class: 'status-dot' }), h('span', { class: 'status-text' }, label)),
    !file.handle ? btn('Save', () => save(), { kind: dirty ? 'primary sm' : 'sm', iconName: 'save', title: `Save (${keys('S')})` }) : null,
    iconBtn('more', 'File menu', e => showMenu(e.currentTarget, fileMenu()), { id: 'file-menu', 'aria-haspopup': 'menu' }));
  if (file.restoredAt) {
    const banner = document.getElementById('banner');
    banner.replaceChildren(h('div', { class: 'banner' }, icon('alert', 16),
      h('span', null, `Restored unsaved changes from ${file.restoredAt.toLocaleString()}.`),
      btn(file.handle ? `Save to ${file.name}` : 'Save to a file', async () => { if (await (file.handle ? reconnect() : save()) !== false) { file.restoredAt = null; rerender(); } }, { kind: 'sm primary' }),
      iconBtn('x', 'Dismiss', () => { file.restoredAt = null; banner.replaceChildren(); })));
  } else document.getElementById('banner').replaceChildren();
}

// ── Quick add ──

function initQuickAdd() {
  const input = document.getElementById('quick-add');
  const preview = document.getElementById('quick-preview');
  const update = () => {
    const v = input.value.trim();
    if (!v) { preview.hidden = true; return; }
    const q = parseQuickAdd(v, store.book.jobs, today());
    const job = store.book.jobs.find(j => j.id === (q.jobId || ui.quickJob || ui.focus)) || liveJobs(store.book)[0];
    const phase = store.book.phases.find(p => p.id === ui.quickPhase && p.jobId === job?.id);
    fill(preview,
      h('span', { class: 'qp-title' }, q.kind === 'milestone' ? '◆ ' : '', q.title || '…'),
      job ? h('span', { class: 'job-tag', style: { '--job': jobColor(job) } }, h('span', { class: 'dot' }), job.title) : h('span', { class: 'chip' }, 'New “Inbox” job'),
      q.effort ? h('span', { class: 'chip' }, fmtEffort(q.effort)) : null,
      h('span', { class: 'chip' }, phase?.title || 'No phase'),
      h('span', { class: 'chip' }, `Assignee: ${personName(store.book, ui.quickAssignee === 'unassigned' ? '' : ui.quickAssignee)}`),
      q.plannedDay ? h('span', { class: 'chip accent' }, `Work on ${fmtDate(q.plannedDay)}`) : null,
      q.finish ? h('span', { class: 'chip' }, `${q.kind === 'milestone' ? 'On' : 'Forecast finish'} ${fmtDate(q.finish)}`) : null,
      !q.plannedDay ? h('span', { class: 'chip' }, 'No work day set · use @today or choose a day in Week') : null,
      q.errors.map(e => h('span', { class: 'chip danger' }, e)),
      h('span', { class: 'qp-help' }, h('kbd', null, 'Enter'), ' add'));
    preview.hidden = false;
  };
  input.addEventListener('input', update);
  input.addEventListener('focus', update);
  input.addEventListener('blur', () => setTimeout(() => { preview.hidden = true; }, 120));
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { input.value = ''; preview.hidden = true; input.blur(); }
    if (e.key === 'Enter' && input.value.trim()) {
      const defaults = { jobId: ui.quickJob, phaseId: ui.quickPhase, assigneeId: ui.quickAssignee === 'unassigned' ? '' : ui.quickAssignee };
      if (quickAdd(input.value, defaults)) { input.value = ''; update(); }
    }
  });
}

// ── Keyboard ──

function typing(el) { return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable); }

function initKeys() {
  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    const key = e.key.toLowerCase();
    if (mod && key === 's') { e.preventDefault(); save({ saveAs: e.shiftKey }); return; }
    if (mod && key === 'o') { e.preventDefault(); openFile(); return; }
    if (document.querySelector('dialog[open]')) return;
    if (mod && !typing(e.target) && (key === 'z' || key === 'y')) {
      e.preventDefault();
      if (key === 'y' || e.shiftKey) redo(); else undo();
      return;
    }
    if (e.key === 'Escape' && ui.drawer && !e.defaultPrevented) { closeDrawer(); return; }
    if (mod || e.altKey || typing(e.target)) return;
    const view = VIEWS.find(v => v.key === e.key);
    if (view) { e.preventDefault(); setView(view.id); return; }
    if (key === 'n' || e.key === '/') { e.preventDefault(); document.getElementById('quick-add').focus(); return; }
    if (e.key === '?') { e.preventDefault(); showHelp(); return; }
    if (ui.view === 'week' && (e.key === '[' || e.key === ']')) {
      e.preventDefault();
      document.querySelector(`.week [aria-label="${e.key === '[' ? 'Previous week' : 'Next week'}"]`)?.click();
    }
  });
}

function showHelp() {
  const row = (keys, what) => h('tr', null, h('td', null, keys.map(k => h('kbd', null, k))), h('td', null, what));
  showModal('Shortcuts & help', [
    h('p', { class: 'guide-link' }, 'New to planning? ', guideButton(), ' — a step-by-step walkthrough of one real project, from first idea to finished.'),
    h('div', { class: 'help-grid' },
      h('section', null,
        h('h3', null, 'Quick add'),
        h('p', null, 'Type a task in the box at the top and press Enter. Add any of:'),
        h('table', { class: 'keys' },
          row(['#phd'], 'job, by code or name'), row(['2h', '45m', '1h30'], 'effort'),
          row(['@tue', '@today'], 'day you’ll work on it (otherwise unscheduled in every view)'), row(['!fri', '!2026-12-01'], 'forecast finish, not a fixed deadline'), row(['*'], 'at the start: a milestone')),
        h('h3', null, 'Keys'),
        h('table', { class: 'keys' },
          row(['N', '/'], 'Quick add'), row(['1–6'], 'Today, Week, Plan, Board, Notes, Assignments'), row([keys('S')], 'Save'), row([keys('Shift+S')], 'Save as'),
          row([keys('O')], 'Open'), row([keys('Z'), keys(IS_MAC ? 'Shift+Z' : 'Y')], 'Undo / redo'), row(['Esc'], 'Close panel'), row(['[', ']'], 'Previous / next week'),
          row(['← →'], 'Move a focused bar on the Plan'), row(['Shift+← →'], 'Change its finish'))),
      h('section', null,
        h('h3', null, 'How it fits together'),
        h('p', null, h('strong', null, 'Plan'), ' is the programme: jobs, phases and dated tasks with prerequisites. Dates are forecasts you control — nothing reschedules itself.'),
        h('p', null, h('strong', null, 'Week'), ' compares the effort you plan with the hours you actually have. Placing a task on a day does not change its programme dates.'),
        h('p', null, h('strong', null, 'Today'), ' shows today’s work, anything carried over, and the resume note for each job you touch.'),
        h('p', null, h('strong', null, 'Blocked'), ' is never set by hand: a task is blocked while it has a written constraint or an unfinished prerequisite.'),
        h('h3', null, 'Your data'),
        h('p', null, 'Your book is a single .json file. After the first Save it is saved automatically to that file (Edge and Chrome). A recovery copy is also kept in this browser in case the window closes; turn that off in the ⋯ menu if this computer is shared.'),
        h('p', null, 'Keep work and personal books in their own environments. Nothing is sent over the network.'))),
    h('p', { class: 'fine' }, `Tas-Time ${APP_VERSION} · © 2026 Selami Pazarbasi · MIT License`),
  ], { wide: true });
}

// ── ui/main.js ──
// Entry point.

async function start() {
  applyAppearance();
  initToasts();
  initQuickAdd();
  initKeys();
  onRender(scope => { renderShell(scope); writeRecovery(); });
  store.subscribe(reason => {
    // Quiet commits come from text fields being typed in: refresh only the chrome so the caret stays put.
    if (reason === 'quiet' || reason === 'saved') renderStatus(); else renderShell();
    if (reason !== 'saved') { writeRecovery(); autosave(); }
  });
  await restoreSession();
  renderShell();
  document.documentElement.classList.add('ready');
}

window.addEventListener('beforeunload', beforeUnload);
window.addEventListener('pagehide', () => writeRecovery.flush());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') writeRecovery.flush();
});

start();

})();
</script>
