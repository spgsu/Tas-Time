const STANDARD_PHASES = ['Scope', 'Plan', 'Execute', 'Review & accept'];

function createJob(title = '') {
  const job = act('New job', d => addJob(d, { title: title || 'Untitled job' }));
  if (job) { ui.focus = ''; openDrawer('job', job.id, 'title'); }
  return job;
}

function undo() {
  const label = store.undo();
  if (label) notify(`Undid: ${label}`, { action: { label: 'Redo', run: redo } });
}

function redo() {
  const label = store.redo();
  if (label) notify(`Redid: ${label}`);
}

/** Creates an item from quick-add text. Falls back to the focused job, then the first job. */
function quickAdd(text, defaults = {}) {
  const book = store.book;
  const q = parseQuickAdd(text, book.jobs, today());
  // Refuse rather than guess: a mistyped #job or !date would otherwise land silently in the wrong place.
  if (q.errors.length) { notify(`Not added — ${q.errors.join('; ')}. Fix it and press Enter again.`, { kind: 'warn' }); return null; }
  if (!q.title) { notify('Type a title for the task.', { kind: 'warn' }); return null; }
  let jobId = q.jobId || defaults.jobId || ui.focus || liveJobs(book)[0]?.id;
  if (!jobId) jobId = act('New job', d => addJob(d, { title: 'Inbox', code: 'INBOX' }))?.id;
  const finish = q.finish || (q.kind === 'milestone' ? q.plannedDay || today() : '');
  const item = act('Add task', d => addItem(d, {
    jobId, phaseId: defaults.phaseId && !q.jobId ? defaults.phaseId : '', title: q.title, kind: q.kind,
    effort: q.effort ?? 0, plannedDay: q.kind === 'milestone' ? '' : q.plannedDay || defaults.plannedDay || '', finish,
    start: defaults.start || '',
  }));
  if (item) {
    const job = jobOf(store.book, item.jobId);
    notify(`Added “${item.title}” to ${job.code || job.title}`, { action: { label: 'Open', run: () => openDrawer('item', item.id) } });
  }
  return item;
}

function removeItem(id) {
  const t = itemOf(store.book, id);
  if (!t) return;
  act('Delete', d => deleteItem(d, id));
  if (itemOf(store.book, id)) return;
  if (ui.drawer?.id === id) ui.drawer = null;
  rerender();
  notify(`Deleted “${t.title}”`, { action: { label: 'Undo', run: undo } });
}

function removeJob(id) {
  const j = jobOf(store.book, id);
  const count = store.book.items.filter(t => t.jobId === id).length;
  if (!confirm(`Delete “${j.title}” and its ${count} item${count === 1 ? '' : 's'}? You can undo this until you close the app. Archive keeps it instead.`)) return;
  act('Delete job', d => deleteJob(d, id));
  if (ui.focus === id) ui.focus = '';
  ui.drawer = null;
  rerender();
  notify(`Deleted job “${j.title}”`, { action: { label: 'Undo', run: undo } });
}

// ── ui/files.js ──
// Saving and opening planning books.
//
// Three layers, strongest first:
//  1. A linked file (File System Access API, Edge/Chrome): explicit save, then autosave.
//  2. A recovery copy in this browser's local storage, restored on next launch.
//  3. Download fallback where neither is available (cannot confirm the write).

const RECOVERY_KEY = 'tas-time:recovery:v3';
const PREF_KEY = 'tas-time:prefs';
const IDB_NAME = 'tas-time';
const PICKER_TYPES = [{ description: 'Tas-Time planning book', accept: { 'application/json': ['.json'] } }];

const file = {
  handle: null,
  name: '',
  state: 'none',        // none | linked | saving | error | reconnect
  savedAt: null,
  lastError: '',
  restoredAt: null,     // set when unsaved work was restored on launch
};

const canLinkFiles = typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function';

function prefs() {
  try { return { recovery: true, ...JSON.parse(localStorage.getItem(PREF_KEY) || '{}') }; } catch { return { recovery: true }; }
}

function setPref(key, value) {
  try { localStorage.setItem(PREF_KEY, JSON.stringify({ ...prefs(), [key]: value })); } catch { /* storage unavailable */ }
  if (key === 'recovery' && !value) clearRecovery();
}

function suggestedName() {
  return `${store.book.name.replace(/[^a-z0-9-]+/gi, '-').replace(/^-|-$/g, '') || 'planning-book'}.json`;
}

let writing = Promise.resolve();

// Incremented whenever a different book replaces the open one. A save started in an
// earlier session writes only its own snapshot and never touches the current session's state.
let session = 0;
function beginSession() { session++; autosave.cancel(); }

/** What a save writes, fixed at the moment the save starts. */
function snapshot() { return { raw: encodeBook(store.book), rev: store.revision, session }; }

class StaleSave extends Error {
  constructor() { super('A different book was opened before this save finished. Nothing was written.'); this.name = 'StaleSave'; }
}

/** Saves to the linked file, asking for a location the first time (or always with saveAs). */
async function save({ saveAs = false } = {}) {
  if (!canLinkFiles) return download();
  const snap = snapshot();
  try {
    let handle = !saveAs && file.handle;
    if (!handle) handle = await window.showSaveFilePicker({ suggestedName: file.name || suggestedName(), types: PICKER_TYPES });
    if (!(await ensurePermission(handle, true))) throw new Error('Permission to write the file was not granted.');
    if (snap.session !== session) throw new StaleSave();
    await queueWrite(handle, snap);
    if (snap.session !== session) return true; // written, but the user has moved on to another book
    link(handle);
    notify(`Saved to ${handle.name}`);
    return true;
  } catch (error) {
    if (error.name === 'AbortError') return false;
    if (error.name === 'StaleSave') { notify(error.message, { kind: 'warn' }); return false; }
    if (snap.session === session) { file.state = 'error'; file.lastError = error.message; rerender(); }
    notify(`Save failed: ${error.message}`, { kind: 'error' });
    return false;
  }
}

/** Writes are serialised; each writes its own snapshot and only updates state for its own session. */
function queueWrite(handle, snap) {
  if (snap.session === session) { file.state = 'saving'; rerender(); }
  writing = writing.catch(() => {}).then(async () => {
    const writer = await handle.createWritable();
    await writer.write(snap.raw);
    await writer.close();
    if (snap.session !== session) return;
    store.markSaved(snap.rev);
    file.savedAt = new Date(); file.state = 'linked'; file.lastError = '';
    writeRecovery.flush();
  });
  return writing;
}

function link(handle) {
  file.handle = handle; file.name = handle.name; file.state = 'linked';
  idbSet('lastFile', handle);
  rerender();
}

async function ensurePermission(handle, request) {
  if (!handle.queryPermission) return true;
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return request && (await handle.requestPermission(opts)) === 'granted';
}

/** Autosave after edits once a file is linked. Never prompts. */
const autosave = debounce(() => { flushToFile(); }, 1200);

/** Writes pending changes to the linked file now. Resolves true when the file holds them. */
async function flushToFile() {
  autosave.cancel();
  const handle = file.handle;
  if (!handle || file.state === 'reconnect') return false;
  if (!store.dirty) { await writing.catch(() => {}); return file.state === 'linked'; }
  const snap = snapshot();
  try {
    if (!(await ensurePermission(handle, false))) {
      if (snap.session === session) { file.state = 'reconnect'; rerender(); }
      return false;
    }
    if (snap.session !== session) return false;
    await queueWrite(handle, snap);
    if (snap.session === session) rerender();
    return true;
  } catch (error) {
    if (snap.session === session) { file.state = 'error'; file.lastError = error.message; rerender(); }
    return false;
  }
}

/** Re-grants write access after a relaunch (needs a click, so it is a button). */
async function reconnect() {
  if (!file.handle) return save();
  const mine = session;
  try {
    if (!(await ensurePermission(file.handle, true)) || mine !== session) return false;
    file.state = 'linked';
    if (store.dirty) await queueWrite(file.handle, snapshot());
    rerender();
    return true;
  } catch (error) { notify(error.message, { kind: 'error' }); return false; }
}

function download() {
  const url = URL.createObjectURL(new Blob([encodeBook(store.book)], { type: 'application/json' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: file.name || suggestedName() });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  notify('Download started. This browser cannot confirm the file was saved — check your Downloads folder.', { kind: 'warn', timeout: 9000 });
  return true;
}

/**
 * Before another book replaces this one: finish writing pending changes to the linked file,
 * or ask before discarding them. Never drops edits silently.
 */
async function settleBeforeReplace() {
  if (!store.dirty) { await writing.catch(() => {}); return true; }
  if (file.handle && (file.state === 'linked' || file.state === 'saving') && await flushToFile() && !store.dirty) return true;
  return confirm(file.handle
    ? `Changes to this book could not be saved to ${file.name}. Discard them and continue?`
    : 'This book has changes that are not saved to a file. Discard them and continue?');
}

async function openFile() {
  if (!(await settleBeforeReplace())) return;
  if (typeof window.showOpenFilePicker === 'function') {
    try {
      const [handle] = await window.showOpenFilePicker({ types: PICKER_TYPES, multiple: false });
      const f = await handle.getFile();
      await loadText(await f.text(), f.name, handle);
    } catch (error) {
      if (error.name !== 'AbortError') notify(`Could not open: ${error.message}`, { kind: 'error' });
    }
    return;
  }
  const input = Object.assign(document.createElement('input'), { type: 'file', accept: '.json,application/json' });
  input.addEventListener('change', async () => {
    const f = input.files[0];
    if (f) { try { await loadText(await f.text(), f.name, null); } catch (error) { notify(`Could not open: ${error.message}`, { kind: 'error' }); } }
  });
  input.click();
}

async function loadText(text, name, handle) {
  const { book, upgradedFrom } = decodeBook(text);
  beginSession();
  store.replace(book, { dirty: !!upgradedFrom });
  resetView();
  file.handle = null; file.name = name; file.state = 'none'; file.restoredAt = null;
  if (handle) {
    if (upgradedFrom) {
      // Never overwrite an older-format original silently.
      file.name = '';
      notify(`Upgraded from version ${upgradedFrom}. Use Save to choose where to keep the new version — the original file is untouched.`, { kind: 'warn', timeout: 12000 });
    } else link(handle);
  }
  writeRecovery.flush();
  rerender();
  if (!upgradedFrom) notify(`Opened ${name}`);
}

async function newBlankBook() {
  if (!(await settleBeforeReplace())) return;
  beginSession();
  store.replace(newBook());
  unlink(); resetView(); rerender();
}

async function loadExample(today) {
  if (!(await settleBeforeReplace())) return;
  beginSession();
  store.replace(exampleBook(today), { dirty: true });
  unlink(); resetView(); rerender();
  notify('Example loaded. It is synthetic — start your own with New book when ready.');
}

function unlink() { file.handle = null; file.name = ''; file.state = 'none'; file.restoredAt = null; }

function resetView() {
  ui.focus = ''; ui.drawer = null; ui.notesJob = ''; ui.week = mondayOf(todayIso());
}

// ── Recovery copy ──

const writeRecovery = debounce(() => {
  if (!prefs().recovery) return;
  try {
    localStorage.setItem(RECOVERY_KEY, JSON.stringify({ at: new Date().toISOString(), fileName: file.name, dirty: store.dirty, book: store.book }));
  } catch { /* quota or storage blocked: the file remains the source of truth */ }
}, 400);

function clearRecovery() { try { localStorage.removeItem(RECOVERY_KEY); } catch { /* ignore */ } }

/** On launch: restore the last session (and its file link, pending permission). */
async function restoreSession() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(RECOVERY_KEY) || 'null'); } catch { saved = null; }
  if (!saved?.book) return false;
  let book;
  try { book = decodeBook(JSON.stringify(saved.book)).book; } catch { return false; }
  store.replace(book, { dirty: !!saved.dirty });
  file.name = saved.fileName || '';
  if (saved.dirty) file.restoredAt = new Date(saved.at);
  const handle = await idbGet('lastFile');
  if (handle && handle.name === saved.fileName) {
    file.handle = handle;
    file.state = (await ensurePermission(handle, false).catch(() => false)) ? 'linked' : 'reconnect';
  }
  return true;
}

// ── IndexedDB holds the file handle (handles cannot go in localStorage) ──

function idb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, value) {
  try {
    const db = await idb();
    db.transaction('kv', 'readwrite').objectStore('kv').put(value, key);
  } catch { /* storage blocked: linking still works for this session */ }
}

async function idbGet(key) {
  try {
    const db = await idb();
    return await new Promise(resolve => {
      const req = db.transaction('kv').objectStore('kv').get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch { return null; }
}

// ── ui/overlay.js ──
// Toasts, popover menus and the small modal used for help.

// ── Toasts ──

function initToasts() {
  const host = h('div', { class: 'toasts', role: 'status', 'aria-live': 'polite' });
  document.body.append(host);
  onNotify((message, { kind = '', action = null, timeout = kind === 'error' ? 8000 : 4500 } = {}) => {
    const el = h('div', { class: ['toast', kind] },
      kind === 'error' || kind === 'warn' ? icon('alert', 16) : icon('check', 16),
      h('span', null, message),
      action ? h('button', { class: 'toast-action', onclick: () => { action.run(); el.remove(); } }, action.label) : null,
      h('button', { class: 'toast-close', 'aria-label': 'Dismiss', onclick: () => el.remove() }, icon('x', 14)));
    host.append(el);
    while (host.children.length > 3) host.firstChild.remove();
    setTimeout(() => el.remove(), timeout);
  });
}

// ── Popover menu ──

let openMenu = null;

function closeMenu() {
  if (!openMenu) return;
  openMenu.el.remove();
  openMenu.anchor.setAttribute('aria-expanded', 'false');
  openMenu.anchor.focus({ preventScroll: true });
  openMenu = null;
}

/** items: [{ label, icon?, hint?, run, danger?, disabled? } | 'separator' | { heading }] */
function showMenu(anchor, items, { align = 'end' } = {}) {
  if (openMenu?.anchor === anchor) { closeMenu(); return; }
  closeMenu();
  const el = h('div', { class: 'menu', role: 'menu' }, items.map(it => {
    if (it === 'separator') return h('div', { class: 'menu-sep', role: 'separator' });
    if (it.heading) return h('div', { class: 'menu-heading' }, it.heading);
    return h('button', {
      role: 'menuitem', class: ['menu-item', it.danger && 'danger'], disabled: it.disabled || null,
      onclick: () => { closeMenu(); it.run(); },
    }, it.icon ? icon(it.icon, 16) : h('span', { class: 'icon-gap' }), h('span', null, it.label), it.hint ? h('kbd', null, it.hint) : null);
  }));
  document.body.append(el);
  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth;
  const left = align === 'end' ? r.right - w : r.left;
  el.style.left = `${Math.max(8, Math.min(left, innerWidth - w - 8))}px`;
  const below = r.bottom + 6;
  el.style.top = `${below + el.offsetHeight > innerHeight - 8 ? Math.max(8, r.top - el.offsetHeight - 6) : below}px`;
  anchor.setAttribute('aria-expanded', 'true');
  openMenu = { el, anchor };
  el.querySelector('button:not([disabled])')?.focus();
  el.addEventListener('keydown', event => {
    const buttons = [...el.querySelectorAll('button:not([disabled])')];
    const i = buttons.indexOf(document.activeElement);
    if (event.key === 'ArrowDown') { event.preventDefault(); buttons[(i + 1) % buttons.length].focus(); }
    if (event.key === 'ArrowUp') { event.preventDefault(); buttons[(i - 1 + buttons.length) % buttons.length].focus(); }
    if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); closeMenu(); }
    if (event.key === 'Tab') closeMenu();
  });
}

document.addEventListener('pointerdown', event => {
  if (openMenu && !openMenu.el.contains(event.target) && !openMenu.anchor.contains(event.target)) closeMenu();
});

// ── Modal ──

function showModal(title, body, { wide = false } = {}) {
  const dialog = h('dialog', { class: ['modal', wide && 'wide'], 'aria-label': title },
    h('div', { class: 'modal-head' }, h('h2', null, title),
      h('button', { class: 'icon-btn', 'aria-label': 'Close', onclick: () => dialog.close() }, icon('x', 18))),
    h('div', { class: 'modal-body' }, body));
  dialog.addEventListener('close', () => dialog.remove());
  document.body.append(dialog);
  dialog.showModal();
  return dialog;
}

// Visual style and light/dark choice. Stored per browser, like a window preference;
// it is not part of the planning book.

const STYLES = [['fluent', 'Fluent (Microsoft 365)'], ['notebook', 'Notebook']];
const SCHEMES = [['system', 'Match Windows'], ['light', 'Light'], ['dark', 'Dark']];

function applyAppearance() {
  const p = prefs();
  const root = document.documentElement;
  root.dataset.style = STYLES.some(([k]) => k === p.style) ? p.style : 'fluent';
  if (p.scheme === 'light' || p.scheme === 'dark') root.dataset.scheme = p.scheme;
  else delete root.dataset.scheme;
}

function appearanceMenu(anchor) {
  const p = prefs();
  const style = document.documentElement.dataset.style;
  const scheme = p.scheme || 'system';
  const pick = (key, value) => { setPref(key, value); applyAppearance(); };
  showMenu(anchor, [
    { heading: 'Style' },
    ...STYLES.map(([k, label]) => ({ label, icon: k === style ? 'check' : '', run: () => pick('style', k) })),
    'separator',
    { heading: 'Theme' },
    ...SCHEMES.map(([k, label]) => ({ label, icon: k === scheme ? 'check' : '', run: () => pick('scheme', k) })),
  ], { align: 'start' });
}

// ── ui/drawer.js ──
// Side panel editor for items and jobs. Every field saves as you go — there is no
// "Keep changes" step; undo (Ctrl+Z outside a text field) reverts mistakes.

let typedSinceRender = false;

function field(label, control, { hint = '', id = '' } = {}) {
  return h('div', { class: 'field' }, h('label', { for: id || null }, label), control, hint ? h('p', { class: 'field-hint' }, hint) : null);
}

/** Text input that saves on every keystroke (coalesced into one undo step). */
function liveText(id, value, onValue, attrs = {}) {
  const tag = attrs.multiline ? 'textarea' : 'input';
  const el = h(tag, {
    id, ...attrs, multiline: null,
    oninput: e => { typedSinceRender = true; if (tag === 'textarea') autosize(e.target); onValue(e.target.value); },
  });
  el.value = value;
  if (tag === 'textarea') requestAnimationFrame(() => autosize(el));
  return el;
}

function renderDrawer() {
  const d = ui.drawer;
  if (!d) return null;
  const record = d.type === 'item' ? itemOf(store.book, d.id) : jobOf(store.book, d.id);
  if (!record) { ui.drawer = null; return null; }
  const panel = h('aside', { class: 'drawer', id: 'drawer', 'aria-label': d.type === 'item' ? 'Edit task' : 'Edit job', tabindex: '-1' },
    d.type === 'item' ? itemEditor(record) : jobEditor(record));
  // Text edits commit quietly (without rebuilding the page); refresh once focus leaves the field.
  panel.addEventListener('focusout', () => { if (typedSinceRender) { typedSinceRender = false; setTimeout(rerender, 0); } });
  if (d.focusField) {
    const target = d.focusField;
    d.focusField = '';
    requestAnimationFrame(() => {
      const el = document.getElementById(`d-${target}`);
      el?.focus();
      if (target === 'title') el?.select();
      el?.scrollIntoView({ block: 'center' });
    });
  }
  return panel;
}

// ── ui/dnd.js ──
// HTML5 drag and drop for item cards. Every drop target also has a keyboard/menu alternative.
const MIME = 'application/x-tas-time-item';

function makeDraggable(el, id) {
  el.draggable = true;
  el.addEventListener('dragstart', event => {
    event.dataTransfer.setData(MIME, id);
    event.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => el.classList.add('dragging'));
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  return el;
}

function makeDropZone(el, onDrop) {
  el.addEventListener('dragover', event => {
    if (!event.dataTransfer.types.includes(MIME)) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    el.classList.add('drop-over');
  });
  el.addEventListener('dragleave', event => { if (!el.contains(event.relatedTarget)) el.classList.remove('drop-over'); });
  el.addEventListener('drop', event => {
    el.classList.remove('drop-over');
    const id = event.dataTransfer.getData(MIME);
    if (!id) return;
    event.preventDefault();
    onDrop(id);
  });
  return el;
}

// ── ui/views/plan.js ──
// Plan: the programme. A frozen table on the left, a calendar-day Gantt on the right,
// both in one scroll container so rows can never drift out of alignment.

const ROW = { job: 46, phase: 32, item: 36, add: 34 };
const HEADER = 52;

const planScroll = { toToday: true };

function timeRange(rows) {
  const t = today();
  const base = addDays(mondayOf(t), -7);
  if (ui.planRange === '6w') return { start: base, days: 56, px: 26 };
  if (ui.planRange === '3m') return { start: base, days: 7 * 15, px: 12 };
  const dates = rows.filter(r => r.type === 'item').flatMap(r => [r.item.start, r.item.finish, r.item.baseline?.start, r.item.baseline?.finish]).filter(Boolean);
  if (!dates.length) return { start: base, days: 56, px: 26 };
  dates.push(t);
  dates.sort();
  const start = addDays(mondayOf(dates[0]), -7);
  const days = Math.ceil((diffDays(start, dates.at(-1)) + 14) / 7) * 7;
  const avail = (document.getElementById('main')?.clientWidth || 1200) - labelWidth() - 48;
  return { start, days, px: Math.max(4, Math.min(26, Math.floor(avail / days))) };
}

function labelWidth() { return innerWidth < 760 ? 220 : 420; }

function renderPlan() {
  const book = store.book;

    segmented([['6w', '6 weeks'], ['3m', '3 months'], ['all', 'Whole job']], ui.planRange, v => { ui.planRange = v; planScroll.toToday = true; rerender(); }, 'Timeline range'),
    h('label', { class: 'toggle' }, h('input', { type: 'checkbox', checked: ui.planShowDone, onchange: e => { ui.planShowDone = e.target.checked; rerender(); } }), 'Done'),
    h('label', { class: 'toggle' }, h('input', { type: 'checkbox', checked: ui.planShowArchived, onchange: e => { ui.planShowArchived = e.target.checked; rerender(); } }), 'Archived'),
    h('span', { class: 'spacer' }),

    btn(book.baselineDate ? `Baseline ${fmtShort(book.baselineDate)}` : 'Set baseline', baselineCommand, {
      kind: 'sm', iconName: 'flag', title: 'A baseline freezes current dates so you can see slippage later.',
    }),

  const lw = labelWidth();

  const grid = h('div', { class: 'plan-grid', style: { width: `${width}px`, '--lw': `${lw}px`, '--px': `${range.px}px`, '--offset': `${(7 - ((dayNum(range.start) + 3) % 7)) % 7}` } });
  grid.append(header(range));

  const positions = new Map();
  let y = HEADER;
  const push = (el, height) => { grid.append(el); y += height; };
  // An inline "add" row closes each phase group (and each job that has no groups yet).
  let group = null; let job = null; let jobHasGroup = false;
  const closeGroup = () => { if (group && !group.job.archived) push(addRow(group.job, group.phase), ROW.add); group = null; };
  const closeJob = () => { closeGroup(); if (job && !jobHasGroup && !job.archived) push(addRow(job, null), ROW.add); };

  return h('div', { class: 'view plan' },
    h('header', { class: 'page-head' }, h('div', null, h('p', { class: 'eyebrow' }, 'Programme'), h('h1', null, 'Plan')), toolbar),

function header(range) {

  const weeks = [];
  for (let i = (7 - ((dayNum(range.start) + 3) % 7)) % 7; i < range.days; i += 7) {
    const iso = addDays(range.start, i);
    weeks.push(h('div', { class: 'ph-week', style: { left: `${i * range.px}px`, width: `${7 * range.px}px` } }, range.px * 7 >= 30 ? String(Number(iso.slice(8))) : ''));

function itemRowPlan(t, range) {

function x(range, iso) { return diffDays(range.start, iso) * range.px; }

function track(t, range, { late, blocked, slip: s }) {
  const tr = h('div', { class: 'pt track' });
  if (t.baseline?.finish) {
    const bs = t.baseline.start || t.baseline.finish;
    tr.append(h('span', { class: 'base', style: { left: `${x(range, bs)}px`, width: `${(diffDays(bs, t.baseline.finish) + 1) * range.px}px` }, title: `Baseline ${fmtShort(bs)} – ${fmtShort(t.baseline.finish)}` }));
  }
  if (!t.start && !t.finish) {
    tr.classList.add('unscheduled');
    tr.title = 'Click a day to schedule';
    tr.addEventListener('click', e => {
      const day = addDays(range.start, Math.floor((e.clientX - tr.getBoundingClientRect().left) / range.px));
      act('Schedule', d => patchItem(d, t.id, t.kind === 'milestone' ? { finish: day } : { start: day, finish: day }, today()));
    });
    return tr;
  }
  const start = t.start || t.finish;
  const finish = t.finish || t.start;
  const label = `${t.title}: ${fmtShort(start)}${start !== finish ? ` to ${fmtShort(finish)}` : ''}`;
  if (t.kind === 'milestone') {
    const ms = h('button', { class: ['gms', t.status === 'done' && 'done', late && 'late'], style: { left: `${x(range, finish) + range.px / 2}px` }, 'aria-label': label, title: label });
    bindDrag(ms, t, range, false);
    tr.append(ms);
  } else {
    const bar = h('button', {
      class: ['bar', t.status, late && 'late', blocked && 'blocked'],

      'aria-label': label, title: label,
    }, h('span', { class: 'grip', 'data-resize': '1' }));
    bindDrag(bar, t, range, true);
    tr.append(bar);
  }

  return tr;
}

/** Pointer drag to move (or resize from the grip) with day snapping; arrow keys for the same. */
function bindDrag(el, t, range, resizable) {
  let startX = 0; let mode = ''; let moved = 0; let origLeft = 0; let origWidth = 0;
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    mode = resizable && e.target.dataset.resize ? 'resize' : 'move';
    startX = e.clientX; moved = 0;
    origLeft = parseFloat(el.style.left); origWidth = parseFloat(el.style.width) || 0;
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', e => {
    if (!mode) return;
    moved = Math.round((e.clientX - startX) / range.px);
    if (mode === 'move') el.style.left = `${origLeft + moved * range.px}px`;
    else el.style.width = `${Math.max(range.px, origWidth + moved * range.px)}px`;
  });
  const end = () => {
    if (!mode) return;
    const m = mode; mode = '';
    el.classList.remove('dragging');
    if (Math.abs(moved) > 0) commitDrag(t, m, moved);
    else if (Math.abs(parseFloat(el.style.left) - origLeft) < 1) openDrawer('item', t.id);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', () => { mode = ''; el.classList.remove('dragging'); rerender(); });
  el.addEventListener('click', e => { if (e.detail === 0) openDrawer('item', t.id); });
  el.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const delta = e.key === 'ArrowLeft' ? -1 : 1;
    commitDrag(t, resizable && e.shiftKey ? 'resize' : 'move', delta);
    requestAnimationFrame(() => document.querySelector(`[data-item="${t.id}"] .bar, [data-item="${t.id}"] .gms`)?.focus());
  });
}

function commitDrag(t, mode, days) {
  if (mode === 'move') { act('Move', d => shiftItem(d, t.id, days)); return; }
  const cur = itemOf(store.book, t.id);
  const start = cur.start || cur.finish;
  const finish = addDays(cur.finish || cur.start, days);
  act('Change finish', d => patchItem(d, t.id, { start, finish: finish < start ? start : finish }, today()));
}

/** Today line plus prerequisite connectors, drawn in one SVG over the timeline. */
function overlay(rows, positions, range, height) {
  const lw = labelWidth();
  const w = range.days * range.px;
  const svg = h('svg', { class: 'plan-overlay', width: w, height, style: { left: `${lw}px` }, 'aria-hidden': 'true' },
    h('defs', null, h('marker', { id: 'arrow', viewBox: '0 0 8 8', refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: 'auto' }, h('path', { d: 'M0 0L8 4L0 8z', class: 'arrow-head' })),
      h('marker', { id: 'arrow-bad', viewBox: '0 0 8 8', refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: 'auto' }, h('path', { d: 'M0 0L8 4L0 8z', class: 'arrow-head bad' }))));
  const tx = x(range, today()) + range.px / 2;
  if (tx >= 0 && tx <= w) svg.append(h('line', { class: 'today-line', x1: tx, x2: tx, y1: HEADER - 6, y2: height }));
  const book = store.book;
  for (const row of rows) {
    if (row.type !== 'item') continue;
    const t = row.item;
    const y2 = positions.get(t.id);
    if (!t.start && !t.finish) continue;
    const conflicts = new Set(dateConflicts(book, t).map(d => d.id));
    for (const depId of t.deps) {
      const d = itemOf(book, depId);
      const y1 = positions.get(depId);
      if (!d || y1 === undefined || !(d.finish || d.start)) continue;
      const x1 = x(range, d.finish || d.start) + (d.kind === 'milestone' ? range.px / 2 + 6 : range.px);
      const x2 = x(range, t.start || t.finish) + (t.kind === 'milestone' ? range.px / 2 - 7 : 0);
      const bad = conflicts.has(depId);
      const mid = Math.max(x1 + 6, Math.min(x2 - 8, x1 + 10));
      const path = x2 - 8 >= x1 + 6
        ? `M${x1} ${y1} H${mid} V${y2} H${x2 - 1}`
        : `M${x1} ${y1} h6 V${(y1 + y2) / 2} H${x2 - 12} V${y2} H${x2 - 1}`;
      svg.append(h('path', { d: path, class: ['dep', bad && 'bad'], 'marker-end': `url(#${bad ? 'arrow-bad' : 'arrow'})` }));
    }
  }
  return svg;
}

// ── ui/views/board.js ──
// Board: status at a glance. "Blocked" is derived from constraints and prerequisites,
// so dropping a card there asks for the reason instead of setting a status.

const COLUMNS = [['todo', 'To do'], ['doing', 'Doing'], ['blocked', 'Blocked'], ['done', 'Done']];
const DONE_WINDOW = 14;

function moveTo(id, column) {
  const t = store.book.items.find(x => x.id === id);
  if (!t || boardColumn(store.book, t, today()) === column) return;
  if (column === 'blocked') { openDrawer('item', id, 'blocker'); notify('Record what this is waiting for.'); return; }
  const reasons = blockers(store.book, t);
  if (reasons.length && column !== 'todo') {
    notify(`Still blocked: ${reasons.join('; ')}. Clear it in the task first.`, { kind: 'warn', action: { label: 'Open', run: () => openDrawer('item', id, 'blocker') } });
    return;
  }
  act(`Move to ${STATUS[column]}`, d => patchItem(d, id, { status: column }, today()));
}

function renderBoard() {
  const book = store.book;
  if (!liveJobs(book).length) return welcome();
  const items = liveItems(book).filter(t => !ui.focus || t.jobId === ui.focus);
  const cutoff = addDays(today(), -DONE_WINDOW);
  const cols = COLUMNS.map(([key, label]) => {
    let list = items.filter(t => boardColumn(book, t, today()) === key).sort(byUrgency);
    let hidden = 0;
    if (key === 'done' && !ui.boardAllDone) {
      const recent = list.filter(t => !t.doneOn || t.doneOn >= cutoff);
      hidden = list.length - recent.length; list = recent;
    }
    const col = h('section', { class: ['col', `col-${key}`], 'aria-label': label },
      h('header', null, h('h2', null, label), h('span', { class: 'count' }, String(list.length + hidden))),
      h('div', { class: 'col-cards' }, list.length ? list.map(boardCard) : h('p', { class: 'col-empty' }, key === 'blocked' ? 'Nothing is blocked.' : 'No cards')),
      hidden ? btn(`Show ${hidden} older`, () => { ui.boardAllDone = true; rerender(); }, { kind: 'ghost sm' }) : null);
    return makeDropZone(col, id => moveTo(id, key));
  });
  return h('div', { class: 'view board' },
    h('header', { class: 'page-head' }, h('div', null, h('p', { class: 'eyebrow' }, 'Status'), h('h1', null, 'Board'),
      h('p', { class: 'sub' }, 'Drag cards between columns. A task is Blocked when it has a written constraint, or its prerequisites are unfinished once it is due to start.'))),
    h('div', { class: 'cols' }, cols));
}

function boardCard(t) {
  const book = store.book;
  const job = jobOf(book, t.jobId);
  const blocked = isBlocked(book, t, today());
  const waiting = blocked ? [] : waitingOn(book, t);
  const el = h('article', { class: ['bcard', t.kind === 'milestone' && 'is-ms'], style: { '--job': jobColor(job) }, 'data-item': t.id },
    h('button', { class: 'bcard-title', onclick: () => openDrawer('item', t.id) }, t.kind === 'milestone' ? '◆ ' : '', t.title),
    h('div', { class: 'bcard-meta' }, jobTag(job), h('span', { class: 'muted' }, phaseTitle(book, t.phaseId))),
    blocked ? h('p', { class: 'bcard-why' }, blockers(book, t).join(' · ')) : null,
    waiting.length ? h('p', { class: 'bcard-after' }, `After ${waiting.map(w => `“${w.title}”`).join(', ')}`) : null,
    h('div', { class: 'bcard-foot' }, dueChip(t), t.effort && t.status !== 'done' ? h('span', { class: 'effort' }, fmtEffort(t.effort)) : null, t.owner ? h('span', { class: 'muted' }, t.owner) : null));
  return makeDraggable(el, t.id);
}

// ── ui/views/notes.js ──
// Notes: one notebook per job, in a few fixed pages. Plain text, saved as you type.

const HINTS = {
  restart: 'Where you stopped.\nWhat is unresolved.\nThe next concrete step.',
  scope: 'What is in and out of scope, acceptance criteria, assumptions…',
  decisions: 'Date — decision — reason — evidence — who agreed',
  working: 'Observations, comparisons, open questions, draft reasoning…',
  references: 'Zotero links, citation keys, document references (kept as plain text)…',
};

function renderNotes() {
  const book = store.book;
  const jobs = liveJobs(book);
  if (!jobs.length) return welcome();
  const job = jobs.find(j => j.id === ui.focus) || jobs.find(j => j.id === ui.notesJob) || jobs[0];
  const page = ui.notesPage;

  const area = h('textarea', {
    id: 'note-text', class: 'note-text', placeholder: HINTS[page], 'aria-label': `${job.title}: ${NOTE_PAGES.find(p => p[0] === page)[1]}`,
    oninput: e => { autosize(e.target); act('Edit note', d => setNote(d, job.id, page, e.target.value), { key: `note:${job.id}:${page}`, quiet: true }); },
  });
  area.value = job.notes[page];
  requestAnimationFrame(() => autosize(area));

  const insertDate = () => {
    const prefix = `${today()} — `;
    const v = area.value;
    const at = area.selectionStart ?? v.length;
    const lineStart = at === 0 || v[at - 1] === '\n';
    area.setRangeText(`${lineStart ? '' : '\n'}${prefix}`, at, at, 'end');
    area.dispatchEvent(new Event('input'));
    area.focus();
  };

  return h('div', { class: 'view notes' },
    h('header', { class: 'page-head' }, h('div', null, h('p', { class: 'eyebrow' }, 'Notebook'), h('h1', null, job.title || 'Untitled job'),
      job.outcome ? h('p', { class: 'sub' }, job.outcome) : null)),
    h('div', { class: 'notes-layout' },
      h('nav', { class: 'notes-jobs', 'aria-label': 'Jobs' }, jobs.map(j => h('button', {
        class: ['notes-job', j.id === job.id && 'on'], style: { '--job': jobColor(j) }, 'aria-current': j.id === job.id ? 'true' : null,
        onclick: () => { ui.notesJob = j.id; if (ui.focus) ui.focus = j.id; rerender(); },
      }, h('span', { class: 'dot' }), h('span', null, j.title), filled(j) ? h('span', { class: 'muted' }, `${filled(j)}/${NOTE_PAGES.length}`) : null))),
      h('div', { class: 'paper' },
        h('div', { class: 'tabs', role: 'tablist' }, NOTE_PAGES.map(([key, label]) => h('button', {
          role: 'tab', 'aria-selected': String(key === page), class: key === page ? 'on' : null,
          onclick: () => { ui.notesPage = key; rerender(); },
        }, label, job.notes[key].trim() ? h('span', { class: 'tab-dot', 'aria-label': 'has notes' }) : null))),
        page === 'decisions' ? h('div', { class: 'paper-tools' }, btn('Insert today’s date', insertDate, { kind: 'sm ghost', iconName: 'clock' })) : null,
        area)));
}

function filled(job) { return NOTE_PAGES.filter(([k]) => job.notes[k].trim()).length; }

// ── ui/shell.js ──
// App frame: sidebar, top bar (quick add + file status), main view and drawer.

const RENDER = { today: renderToday, week: renderWeek, plan: renderPlan, board: renderBoard, notes: renderNotes };

function renderShell() {
  const active = document.activeElement;
  const focusId = active?.id && active !== document.body ? active.id : '';
  const selection = focusId && 'selectionStart' in active ? [active.selectionStart, active.selectionEnd] : null;
  const keep = ['plan-scroll'].map(id => [id, document.getElementById(id)]).filter(([, el]) => el).map(([id, el]) => [id, el.scrollLeft, el.scrollTop]);
  const pageY = document.getElementById('main')?.scrollTop || 0;

  fill(document.getElementById('sidebar'), sidebar());
  renderStatus();
  const main = document.getElementById('main');
  fill(main, RENDER[ui.view]());
  main.scrollTop = pageY;
  const drawer = renderDrawer();
  fill(document.getElementById('drawer-host'), drawer);
  document.body.classList.toggle('has-drawer', !!drawer);

  for (const [id, left, top] of keep) {
    const el = document.getElementById(id);
    if (el) { el.scrollLeft = left; el.scrollTop = top; }
  }
  if (focusId && focusId !== 'quick-add') {
    const el = document.getElementById(focusId);
    if (el && el !== document.activeElement) {
      el.focus({ preventScroll: true });
      if (selection && 'setSelectionRange' in el) { try { el.setSelectionRange(...selection); } catch { /* not a text field */ } }
    }
  }
  document.title = `${store.dirty ? '• ' : ''}${store.book.name} — Tas-Time`;
}

function sidebar() {
  const book = store.book;
  const jobs = liveJobs(book);
  return [
    h('div', { class: 'brand' }, h('span', { class: 'brand-mark' }, icon('book', 20)), h('div', null, h('strong', null, 'Tas-Time'),
      h('button', { class: 'book-name', title: 'Rename this planning book', onclick: renameBook }, book.name))),
    h('nav', { class: 'nav', 'aria-label': 'Views' }, VIEWS.map(v => h('button', {
      class: ['nav-item', ui.view === v.id && 'on'], 'aria-current': ui.view === v.id ? 'page' : null, onclick: () => setView(v.id),
    }, icon(v.icon, 18), h('span', null, v.label), h('kbd', null, v.key)))),
    h('div', { class: 'jobs-head' }, h('span', null, 'Jobs'), iconBtn('plus', 'New job', () => createJob(), { class: 'icon-btn sm' })),
    h('ul', { class: 'jobs' }, jobs.map(j => {
      const s = jobSummary(book, j, today());
      return h('li', null, h('button', {
        class: ['job-link', ui.focus === j.id && 'on'], style: { '--job': jobColor(j) }, 'aria-pressed': String(ui.focus === j.id),
        title: ui.focus === j.id ? 'Showing only this job — click to show all' : `Show only ${j.title}`,
        onclick: () => setFocus(j.id),
      }, h('span', { class: 'dot' }), h('span', { class: 'job-name' }, j.title || 'Untitled job'),
      s.late ? h('span', { class: 'late-dot', title: `${s.late} late` }) : null,
      h('span', { class: 'badge', title: `${s.open} open` }, String(s.open))));
    })),
    jobs.length ? null : h('p', { class: 'jobs-empty' }, 'No jobs yet.'),
    h('div', { class: 'side-foot' },
      h('button', { class: 'foot-link', id: 'appearance', 'aria-haspopup': 'menu', onclick: e => appearanceMenu(e.currentTarget) }, icon('palette', 16), 'Appearance'),
      h('button', { class: 'foot-link', onclick: showHelp }, icon('keyboard', 16), 'Shortcuts & help')),
  ];
}

function renameBook() {
  const name = prompt('Name this planning book', store.book.name);
  if (name && name.trim()) store.commit('Rename book', d => { d.name = name.trim().slice(0, 200); });
}

function renderStatus() {
  const host = document.getElementById('file-status');
  const dirty = store.dirty;
  let label; let kind = ''; let title = ''; let onclick = () => save();
  if (file.state === 'saving') { label = 'Saving…'; kind = 'busy'; }
  else if (file.state === 'reconnect') { label = `Reconnect ${file.name}`; kind = 'warn'; title = 'The browser needs your permission again to keep saving to this file.'; onclick = reconnect; }
  else if (file.state === 'error') { label = 'Save failed — retry'; kind = 'danger'; title = file.lastError; }
  else if (file.handle && !dirty) { label = `Saved · ${file.name}`; kind = 'ok'; title = file.savedAt ? `Last saved ${file.savedAt.toLocaleTimeString()}` : 'Up to date'; }
  else if (file.handle) { label = 'Saving soon…'; kind = 'busy'; }
  else if (dirty) { label = canLinkFiles ? 'Not saved to a file' : 'Unsaved changes'; kind = 'warn'; title = 'Your work is kept in this browser as a recovery copy, but not in a file yet.'; }
  else { label = file.name || 'New book'; title = 'No changes'; }
  fill(host,
    h('button', { class: ['status', kind], title, onclick }, h('span', { class: 'status-dot' }), h('span', { class: 'status-text' }, label)),
    !file.handle ? btn('Save', () => save(), { kind: dirty ? 'primary sm' : 'sm', iconName: 'save', title: 'Save (Ctrl+S)' }) : null,
    iconBtn('more', 'File menu', e => showMenu(e.currentTarget, fileMenu()), { id: 'file-menu', 'aria-haspopup': 'menu' }));
  if (file.restoredAt) {
    const banner = document.getElementById('banner');
    banner.replaceChildren(h('div', { class: 'banner' }, icon('alert', 16),
      h('span', null, `Restored unsaved changes from ${file.restoredAt.toLocaleString()}.`),
      btn(file.handle ? `Save to ${file.name}` : 'Save to a file', async () => { if (await (file.handle ? reconnect() : save()) !== false) { file.restoredAt = null; rerender(); } }, { kind: 'sm primary' }),
      iconBtn('x', 'Dismiss', () => { file.restoredAt = null; banner.replaceChildren(); })));
  } else document.getElementById('banner').replaceChildren();
}

function fileMenu() {
  const p = prefs();
  return [
    { label: 'Save', icon: 'save', hint: 'Ctrl+S', run: () => save() },
    { label: 'Save as…', icon: 'copy', hint: 'Ctrl+Shift+S', run: () => save({ saveAs: true }) },
    { label: 'Open…', icon: 'open', hint: 'Ctrl+O', run: openFile },
    'separator',
    { label: 'Undo', icon: 'undo', hint: 'Ctrl+Z', run: undo, disabled: !store.canUndo },
    { label: 'Redo', icon: 'redo', hint: 'Ctrl+Y', run: redo, disabled: !store.canRedo },
    'separator',
    { label: 'New book', icon: 'plus', run: newBlankBook },
    { label: 'Load example book', icon: 'book', run: () => loadExample(today()) },
    { label: 'Rename book…', icon: 'notes', run: renameBook },
    { label: 'Print this view', icon: 'print', hint: 'Ctrl+P', run: () => window.print() },
    'separator',
    { label: p.recovery ? 'Recovery copy: on' : 'Recovery copy: off', icon: p.recovery ? 'check' : 'x', run: () => setPref('recovery', !p.recovery) },
  ];
}

// ── Quick add ──

function initQuickAdd() {
  const input = document.getElementById('quick-add');
  const preview = document.getElementById('quick-preview');
  const update = () => {
    const v = input.value.trim();
    if (!v) { preview.hidden = true; return; }
    const q = parseQuickAdd(v, store.book.jobs, today());
    const job = store.book.jobs.find(j => j.id === (q.jobId || ui.focus)) || liveJobs(store.book)[0];
    fill(preview,
      h('span', { class: 'qp-title' }, q.kind === 'milestone' ? '◆ ' : '', q.title || '…'),
      job ? h('span', { class: 'job-tag', style: { '--job': jobColor(job) } }, h('span', { class: 'dot' }), job.title) : h('span', { class: 'chip' }, 'New “Inbox” job'),
      q.effort ? h('span', { class: 'chip' }, fmtEffort(q.effort)) : null,
      q.plannedDay ? h('span', { class: 'chip accent' }, `Work on ${fmtDate(q.plannedDay)}`) : null,
      q.finish ? h('span', { class: 'chip' }, `${q.kind === 'milestone' ? 'On' : 'Due'} ${fmtDate(q.finish)}`) : null,
      q.errors.map(e => h('span', { class: 'chip danger' }, e)),
      h('span', { class: 'qp-help' }, h('kbd', null, 'Enter'), ' add'));
    preview.hidden = false;
  };
  input.addEventListener('input', update);
  input.addEventListener('focus', update);
  input.addEventListener('blur', () => setTimeout(() => { preview.hidden = true; }, 120));
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { input.value = ''; preview.hidden = true; input.blur(); }
    if (e.key === 'Enter' && input.value.trim()) {
      const defaults = ui.view === 'today' ? { plannedDay: today() } : {};
      if (quickAdd(input.value, defaults)) { input.value = ''; update(); }
    }
  });
}

// ── Keyboard ──

function typing(el) { return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable); }

function initKeys() {
  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    const key = e.key.toLowerCase();
    if (mod && key === 's') { e.preventDefault(); save({ saveAs: e.shiftKey }); return; }
    if (mod && key === 'o') { e.preventDefault(); openFile(); return; }
    if (document.querySelector('dialog[open]')) return;
    if (mod && !typing(e.target) && (key === 'z' || key === 'y')) {
      e.preventDefault();
      if (key === 'y' || e.shiftKey) redo(); else undo();
      return;
    }
    if (e.key === 'Escape' && ui.drawer && !e.defaultPrevented) { closeDrawer(); return; }
    if (mod || e.altKey || typing(e.target)) return;
    const view = VIEWS.find(v => v.key === e.key);
    if (view) { e.preventDefault(); setView(view.id); return; }
    if (key === 'n' || e.key === '/') { e.preventDefault(); document.getElementById('quick-add').focus(); return; }
    if (e.key === '?') { e.preventDefault(); showHelp(); return; }
    if (ui.view === 'week' && (e.key === '[' || e.key === ']')) {
      e.preventDefault();
      document.querySelector(`.week [aria-label="${e.key === '[' ? 'Previous week' : 'Next week'}"]`)?.click();
    }
  });
}

function showHelp() {
  const row = (keys, what) => h('tr', null, h('td', null, keys.map(k => h('kbd', null, k))), h('td', null, what));
  showModal('Shortcuts & help', [
    h('div', { class: 'help-grid' },
      h('section', null,
        h('h3', null, 'Quick add'),
        h('p', null, 'Type a task in the box at the top and press Enter. Add any of:'),
        h('table', { class: 'keys' },
          row(['#phd'], 'job, by code or name'), row(['2h', '45m', '1h30'], 'effort'),
          row(['@tue', '@today'], 'day you’ll work on it'), row(['!fri', '!2026-12-01'], 'due date'), row(['*'], 'at the start: a milestone')),
        h('h3', null, 'Keys'),
        h('table', { class: 'keys' },
          row(['N', '/'], 'Quick add'), row(['1–5'], 'Today, Week, Plan, Board, Notes'), row(['Ctrl+S'], 'Save'), row(['Ctrl+Shift+S'], 'Save as'),
          row(['Ctrl+O'], 'Open'), row(['Ctrl+Z', 'Ctrl+Y'], 'Undo / redo'), row(['Esc'], 'Close panel'), row(['[', ']'], 'Previous / next week'),
          row(['← →'], 'Move a focused bar on the Plan'), row(['Shift+← →'], 'Change its finish'))),
      h('section', null,
        h('h3', null, 'How it fits together'),
        h('p', null, h('strong', null, 'Plan'), ' is the programme: jobs, phases and dated tasks with prerequisites. Dates are forecasts you control — nothing reschedules itself.'),
        h('p', null, h('strong', null, 'Week'), ' compares the effort you plan with the hours you actually have. Placing a task on a day does not change its programme dates.'),
        h('p', null, h('strong', null, 'Today'), ' shows today’s work, anything carried over, and the resume note for each job you touch.'),
        h('p', null, h('strong', null, 'Blocked'), ' is never set by hand: a task is blocked while it has a written constraint or an unfinished prerequisite.'),
        h('h3', null, 'Your data'),
        h('p', null, 'Your book is a single .json file. After the first Save it is saved automatically to that file (Edge and Chrome). A recovery copy is also kept in this browser in case the window closes; turn that off in the ⋯ menu if this computer is shared.'),
        h('p', null, 'Keep work and personal books in their own environments. Nothing is sent over the network.'))),
    h('p', { class: 'fine' }, `Tas-Time ${APP_VERSION} · © 2026 Selami Pazarbasi · MIT License`),
  ], { wide: true });
}

// ── ui/main.js ──
// Entry point.

async function start() {
  applyAppearance();
  initToasts();
  initQuickAdd();
  initKeys();
  onRender(renderShell);
  store.subscribe(reason => {
    // Quiet commits come from text fields being typed in: refresh only the chrome so the caret stays put.
    if (reason === 'quiet' || reason === 'saved') renderStatus(); else renderShell();
    if (reason !== 'saved') { writeRecovery(); autosave(); }
  });
  await restoreSession();
  renderShell();
  document.documentElement.classList.add('ready');
}

window.addEventListener('beforeunload', event => {
  writeRecovery.flush();
  // Unsaved edits are safe only if the recovery copy holds them; an autosave may still be pending.
  if (store.dirty && !prefs().recovery) { event.preventDefault(); event.returnValue = ''; }
});

start();

})();
